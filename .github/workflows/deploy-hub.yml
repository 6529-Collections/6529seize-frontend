name: Deploy Hub - FE Operation

run-name: Deploy Hub ${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Unique Deploy Hub operation identifier
        required: true
        type: string
      action:
        description: Deploy exact PRs or remove one exact PR from staging
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - remove-from-staging
      manifest:
        description: Ordered JSON array of exact frontend PR requests
        required: true
        type: string
      confirmation:
        description: Explicit live-operation confirmation
        required: true
        type: choice
        options:
          - DEPLOY
          - REMOVE

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: deploy-hub-frontend-controller
  cancel-in-progress: false

jobs:
  operate:
    name: Execute exact frontend operation
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write

    steps:
      - name: Require default-branch dispatch
        env:
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out trusted operation controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure operation commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute Deploy Hub operation
        env:
          DEPLOY_HUB_ACTOR: ${{ github.actor }}
          DEPLOY_HUB_ACTION: ${{ inputs.action }}
          DEPLOY_HUB_API_URL: ${{ github.api_url }}
          DEPLOY_HUB_BASE_REF: ${{ github.event.repository.default_branch }}
          DEPLOY_HUB_CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_HUB_MANIFEST: ${{ inputs.manifest }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.operation_id }}
          DEPLOY_HUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_HUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOY_HUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_HUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/scripts/deploy-hub-operation.cjs >> "$GITHUB_STEP_SUMMARY"
