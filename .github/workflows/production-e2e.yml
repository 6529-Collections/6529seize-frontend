name: Production E2E

on:
  workflow_dispatch:
    inputs:
      release_train_id: { type: string, required: false }
      release_train_revision: { type: string, required: false }
      operation_key: { type: string, required: false }
      source_ref: { type: string, required: false }
      expected_sha: { type: string, required: false }
      release_manifest_id: { type: string, required: false }
      release_manifest_identity_sha256: { type: string, required: false }
      frontend_sha: { type: string, required: false, default: "" }
      backend_sha: { type: string, required: false, default: "" }
      frontend_artifact_digest: { type: string, required: false, default: "" }
      backend_artifact_digest: { type: string, required: false, default: "" }
      automatic_deploy_run_id: { type: string, required: false, default: "" }

permissions:
  contents: read

run-name: Production E2E ${{ inputs.release_train_id || (inputs.automatic_deploy_run_id && 'automatic') || 'manual' }}

concurrency:
  group: production-e2e
  # Production read-only validation owns its lane independently. Never cancel
  # a manifest-bound run or share staging/ALL ownership.
  cancel-in-progress: false

jobs:
  readonly:
    runs-on: ${{ vars.E2E_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Reject mixed automatic dispatch identity
        if: inputs.automatic_deploy_run_id != ''
        env:
          AUTOMATIC_DEPLOY_RUN_ID: ${{ inputs.automatic_deploy_run_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ inputs.backend_artifact_digest }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FRONTEND_ARTIFACT_DIGEST: ${{ inputs.frontend_artifact_digest }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$AUTOMATIC_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          identity_values="$TRAIN_ID$TRAIN_REVISION$OPERATION_KEY$SOURCE_REF$EXPECTED_SHA$MANIFEST_ID$MANIFEST_IDENTITY$FRONTEND_SHA$BACKEND_SHA$FRONTEND_ARTIFACT_DIGEST$BACKEND_ARTIFACT_DIGEST"
          test -z "$identity_values"

      - name: Resolve successful automatic production deploy
        id: automatic-deploy
        if: inputs.automatic_deploy_run_id != ''
        env:
          AUTOMATIC_DEPLOY_RUN_ID: ${{ inputs.automatic_deploy_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$AUTOMATIC_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          response_file="$(mktemp)"
          runs_file=''
          trap 'rm -f "$response_file"; if [ -n "$runs_file" ]; then rm -f "$runs_file"; fi' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOMATIC_DEPLOY_RUN_ID}" \
            > "$response_file"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$AUTOMATIC_DEPLOY_RUN_ID" '
              .id == $run_id and
              .name == "Web Deploy - PROD" and
              .path == ".github/workflows/build-upload-deploy-prod.yml" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .repository.full_name == $repository and
              (.head_sha | test("^[a-f0-9]{40}$"))
            ' "$response_file" >/dev/null
          echo "deployed-sha=$(jq -r .head_sha "$response_file")" >> "$GITHUB_OUTPUT"
          started_at="$(jq -er .run_started_at "$response_file")"
          runs_file="$(mktemp)"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-upload-deploy-prod.yml/runs?status=completed&branch=main&event=workflow_dispatch&per_page=100" \
            > "$runs_file"
          previous_sha="$(jq -r \
            --argjson current_run_id "$AUTOMATIC_DEPLOY_RUN_ID" \
            --arg started_at "$started_at" '
              [.workflow_runs[] |
                select(
                  .id != $current_run_id and
                  .name == "Web Deploy - PROD" and
                  .path == ".github/workflows/build-upload-deploy-prod.yml" and
                  .event == "workflow_dispatch" and
                  .status == "completed" and
                  .conclusion == "success" and
                  .head_branch == "main" and
                  .run_started_at < $started_at and
                  (.head_sha | test("^[a-f0-9]{40}$"))
                )] |
              sort_by(.run_started_at) |
              last |
              .head_sha // empty
            ' "$runs_file")"
          if [[ "$previous_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "previous_deployed_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No prior successful production deployment could be proven; Museum E2E will be retained."
            echo "previous_deployed_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and authorize immutable inputs
        if: inputs.automatic_deploy_run_id == ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FRONTEND_ARTIFACT_DIGEST: ${{ inputs.frontend_artifact_digest }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_ARTIFACT_DIGEST: ${{ inputs.backend_artifact_digest }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^([1-9][0-9]{0,8}|rollback-[1-9][0-9]{0,8})$ ]]
          [[ "$OPERATION_KEY" =~ ^[A-Za-z0-9:._-]{1,180}$ ]]
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,255}$ ]]
          [[ "$MANIFEST_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$MANIFEST_IDENTITY" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$FRONTEND_SHA" || "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$BACKEND_SHA" || "$BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$FRONTEND_ARTIFACT_DIGEST" || "$FRONTEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$BACKEND_ARTIFACT_DIGEST" || "$BACKEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test -n "$FRONTEND_SHA$BACKEND_SHA"
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg expected_sha "$EXPECTED_SHA" --arg artifact_digest "$MANIFEST_IDENTITY" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,artifact_run_id:null,repository:"frontend",environment:"prod",service:null,expected_sha:$expected_sha,artifact_digest:$artifact_digest}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/authorize"
      - name: Check out exact production SHA
        # workflow_dispatch itself is trusted orchestration from the selected
        # default-branch ref. All pack code, the pack manifest, dependencies,
        # and evidence below come from this independently read-back deployed
        # SHA, so a later main advance cannot change the tested inventory.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha || steps.automatic-deploy.outputs.deployed-sha }}
          persist-credentials: false
      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || steps.automatic-deploy.outputs.deployed-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22.17.1" }
      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-
      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store
      - name: Install Socket Firewall
        id: socket-firewall
        continue-on-error: true
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with: { mode: firewall }
      - name: Install frozen dependencies
        id: dependencies
        if: steps.socket-firewall.outcome == 'success'
        continue-on-error: true
        env:
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen
      # The deployed tree and its dependency lifecycle run before trusted
      # control tooling is staged. This keeps untrusted install code from
      # mutating the Museum selector after its immutable-source verification.
      - name: Require an unused Museum selection control path
        if: steps.dependencies.outcome == 'success'
        run: test ! -e .release-bus-control
      - name: Check out immutable Release Bus Museum selection tooling
        if: steps.dependencies.outcome == 'success'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-bus-control
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/museum-release-tier.cjs
            scripts/museum-release-selection.cjs
          sparse-checkout-cone-mode: false
      - name: Verify immutable Museum selection tooling
        if: steps.dependencies.outcome == 'success'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C .release-bus-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          if ! control_status="$(git -C .release-bus-control status --porcelain=v1 --untracked-files=all)"; then
            echo "::error::Unable to verify the Museum selection control working tree."
            exit 1
          fi
          test -z "$control_status"
          test -f .release-bus-control/scripts/museum-release-tier.cjs
          test -f .release-bus-control/scripts/museum-release-selection.cjs
      - name: Select fail-closed Museum packs for the exact deployed range
        id: museum-selection
        if: steps.dependencies.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.automatic-deploy.outputs.previous_deployed_sha }}
          DEPLOYED_SHA: ${{ inputs.expected_sha || steps.automatic-deploy.outputs.deployed-sha }}
          GH_TOKEN: ${{ github.token }}
          MUSEUM_RELEASE_TIER_MODE: ${{ vars.MUSEUM_RELEASE_TIER_MODE }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="museum-range-unavailable"
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] &&
            [[ "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          then
            # Commit divergence is an identity failure: broader tests cannot
            # qualify a different tree from the deployed release.
            test "$head_sha" = "$DEPLOYED_SHA"
            base_available=true
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
              ! git fetch --no-tags --depth=1 origin "$BASE_SHA"
            then
              base_available=false
              echo "::warning::Unable to fetch the prior production tree; retaining every Museum pack."
            fi
            if [ "$base_available" = true ]; then
              base_sha="$BASE_SHA"
            fi
          else
            echo "::warning::No exact deployed range is available; retaining every Museum pack."
          fi

          hold_state=unknown
          if open_holds="$(gh issue list \
            --repo 6529-Collections/6529seize-frontend \
            --state open \
            --label release-bus-museum-hold \
            --limit 100 \
            --json number,title 2>/dev/null)"
          then
            if jq -e 'type == "array"' <<< "$open_holds" >/dev/null; then
              if [ "$(jq 'length' <<< "$open_holds")" -eq 0 ]; then
                hold_state=clear
              else
                hold_state=active
              fi
            fi
          else
            echo "::warning::Museum hold lookup failed; retaining every Museum pack."
          fi

          mapfile -t museum_refs < <(
            git ls-remote --refs \
              https://github.com/6529-Collections/6529networkmuseum.git \
              refs/heads/main
          )
          test "${#museum_refs[@]}" -eq 1
          read -r source_commit source_ref source_extra <<< "${museum_refs[0]}"
          test -z "${source_extra:-}"
          test "$source_ref" = "refs/heads/main"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]

          selection_file="$RUNNER_TEMP/museum-release-selection.json"
          NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
            node .release-bus-control/scripts/museum-release-selection.cjs \
              --base "$base_sha" \
              --head "$head_sha" \
              --environment production \
              --activation-mode "$MUSEUM_RELEASE_TIER_MODE" \
              --hold-state "$hold_state" \
              --repository-root "$GITHUB_WORKSPACE" \
              --source-commit "$source_commit" \
              --output "$selection_file"
          jq -e --arg source_commit "$source_commit" '
            .contract == "museum-release-selection-v1" and
            .environment == "production" and
            (.classification.tier | IN("NONE", "P0", "P1", "P2", "P3")) and
            (.activation.effective_mode | IN("tiered", "full")) and
            (.activation.hold_state | IN("clear", "active", "unknown")) and
            .source_commit == $source_commit and
            (.selected_packs | type == "array") and
            (.selected_packs | all(IN("museum-data-architecture", "museum-institutional-practice", "museum-about", "museum-inside-system", "museum-rights"))) and
            (.selection_digest | test("^[a-f0-9]{64}$"))
          ' "$selection_file" >/dev/null
          {
            echo "file=$selection_file"
            echo "selected_packs=$(jq -c .selected_packs "$selection_file")"
            echo "tier=$(jq -r .classification.tier "$selection_file")"
            echo "activation_mode=$(jq -r .activation.effective_mode "$selection_file")"
            echo "hold_state=$(jq -r .activation.hold_state "$selection_file")"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Museum production qualification selection"
            echo
            echo "Tier: $(jq -r .classification.tier "$selection_file")"
            echo "Activation: $(jq -r .activation.effective_mode "$selection_file")"
            echo "Hold: $(jq -r .activation.hold_state "$selection_file")"
            echo "Source: $source_commit"
            echo "Packs: $(jq -r '.selected_packs | join(", ") // "none"' "$selection_file")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Playwright browser
        if: steps.dependencies.outcome == 'success'
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        id: playwright
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = true ]; then
            ./bin/6529 exec playwright install-deps chromium
          else
            ./bin/6529 exec playwright install --with-deps chromium
          fi
      - name: Run production-safe read-only packs
        id: e2e
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          MUSEUM_PUBLICATION_EXPECTED_COMMIT: ${{ steps.museum-selection.outputs.source_commit }}
          MUSEUM_SELECTED_PACKS_JSON: ${{ steps.museum-selection.outputs.selected_packs }}
          RELEASE_BUS_E2E_MANIFEST_ID: ${{ inputs.release_manifest_id }}
          RELEASE_BUS_E2E_MANIFEST_IDENTITY_SHA256: ${{ inputs.release_manifest_identity_sha256 }}
          RELEASE_BUS_E2E_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          args=(
            --env production
            --trigger post-deploy
            --artifact-root production-e2e-artifacts
          )
          if runner_capabilities="$(./bin/6529 exec node scripts/e2e-packs.cjs --capabilities 2>/dev/null)" &&
            jq -e '
              .contract == "release-bus-e2e-runner-capabilities.v1" and
              .features.readonly_pack_parallelism == {
                version: 1,
                max_parallel: 4
              } and
              .features.pack_exclusion == { version: 1 }
            ' <<< "$runner_capabilities" >/dev/null
          then
            args+=(--parallel 3)
            museum_pack_aliases="$(./bin/6529 exec node - <<'NODE'
          const { PACKS } = require("./tests/packs.manifest.cjs");
          const isMuseumPack = (pack) =>
            pack.changeScope === "museum" || /^museum-/.test(pack.alias ?? "");
          const aliases = PACKS.filter((pack) =>
            pack.environments.includes("production") &&
            pack.triggers.includes("post-deploy") &&
            isMuseumPack(pack)
          ).map((pack) => pack.alias ?? pack.scriptKey);
          if (aliases.length === 0) {
            process.stderr.write("No production Museum packs were identified.\n");
            process.exit(1);
          }
          process.stdout.write(aliases.join("\n"));
          NODE
            )"
            selected_museum_packs="$(jq -c . <<< "$MUSEUM_SELECTED_PACKS_JSON")"
            jq -e '
              type == "array" and
              all(IN("museum-data-architecture", "museum-institutional-practice", "museum-about", "museum-inside-system", "museum-rights"))
            ' <<< "$selected_museum_packs" >/dev/null
            while IFS= read -r museum_pack_alias; do
              if ! jq -e --arg alias "$museum_pack_alias" '. | index($alias) != null' <<< "$selected_museum_packs" >/dev/null; then
                args+=(--exclude-pack "$museum_pack_alias")
              fi
            done <<< "$museum_pack_aliases"
          else
            echo "::warning::Deployed E2E runner cannot exclude packs; retaining all Museum E2E packs."
            MUSEUM_SELECTED_PACKS_JSON='["museum-data-architecture","museum-institutional-practice","museum-about","museum-inside-system","museum-rights"]'
          fi
          if [ -n "${runner_capabilities:-}" ] &&
            jq -e '
              .contract == "release-bus-e2e-runner-capabilities.v1" and
              .features.serial_failed_pack_retry == {
                version: 1,
                max_retries: 1
              }
            ' <<< "$runner_capabilities" >/dev/null
          then
            args+=(--retry-failed-packs 1)
            echo "SERIAL_FAILED_PACK_RETRY=true" >> "$GITHUB_ENV"
          else
            echo "SERIAL_FAILED_PACK_RETRY=false" >> "$GITHUB_ENV"
          fi
          echo "MUSEUM_SELECTED_PACKS_JSON=$MUSEUM_SELECTED_PACKS_JSON" >> "$GITHUB_ENV"
          ./bin/6529 run e2e:packs -- "${args[@]}"
      # The deployed E2E runner has now completed. Stage a second, fresh,
      # workflow-SHA-bound copy for evidence verification so tested app code
      # cannot alter the verifier used to qualify its own output.
      - name: Require an unused Museum evidence control path
        id: museum-evidence-path
        if: always() && steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success'
        run: test ! -e .release-bus-evidence-control
      - name: Check out immutable Release Bus Museum evidence tooling
        id: museum-evidence-checkout
        if: always() && steps.museum-evidence-path.outcome == 'success'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-bus-evidence-control
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/museum-release-tier.cjs
            scripts/museum-release-selection.cjs
          sparse-checkout-cone-mode: false
      - name: Verify immutable Museum evidence tooling
        id: museum-evidence-tooling
        if: always() && steps.museum-evidence-checkout.outcome == 'success'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C .release-bus-evidence-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          if ! control_status="$(git -C .release-bus-evidence-control status --porcelain=v1 --untracked-files=all)"; then
            echo "::error::Unable to verify the Museum evidence control working tree."
            exit 1
          fi
          test -z "$control_status"
          test -f .release-bus-evidence-control/scripts/museum-release-tier.cjs
          test -f .release-bus-evidence-control/scripts/museum-release-selection.cjs
      - name: Validate exact production E2E evidence
        id: evidence
        if: always() && steps.museum-evidence-tooling.outcome == 'success'
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          AUTOMATIC_DEPLOY_RUN_ID: ${{ inputs.automatic_deploy_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha || steps.automatic-deploy.outputs.deployed-sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          MUSEUM_SOURCE_COMMIT: ${{ steps.museum-selection.outputs.source_commit }}
          MUSEUM_SELECTION_FILE: ${{ steps.museum-selection.outputs.file }}
          MUSEUM_RELEASE_SELECTION_TOOL: .release-bus-evidence-control/scripts/museum-release-selection.cjs
        run: |
          set -euo pipefail
          test -f production-e2e-artifacts/evidence.json
          test -f "$MUSEUM_SELECTION_FILE"
          jq -e --arg source_commit "$MUSEUM_SOURCE_COMMIT" '
            .contract == "museum-release-selection-v1" and
            .environment == "production" and
            .source_commit == $source_commit and
            (.source_commit | test("^[a-f0-9]{40}$")) and
            (.selected_packs | type == "array") and
            (.selection_digest | test("^[a-f0-9]{64}$"))
          ' "$MUSEUM_SELECTION_FILE" >/dev/null
          node - "$MUSEUM_SELECTION_FILE" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const selection = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const { verifySelectionDigest } = require(
            path.resolve(process.env.MUSEUM_RELEASE_SELECTION_TOOL)
          );
          if (!verifySelectionDigest(selection)) {
            throw new Error("Museum selection digest verification failed.");
          }
          NODE
          validated_museum_packs="$(jq -c .selected_packs "$MUSEUM_SELECTION_FILE")"
          complete_museum_packs='["museum-data-architecture","museum-institutional-practice","museum-about","museum-inside-system","museum-rights"]'
          effective_museum_packs="${MUSEUM_SELECTED_PACKS_JSON:-}"
          if [ "$effective_museum_packs" != "$validated_museum_packs" ] && \
            [ "$effective_museum_packs" != "$complete_museum_packs" ]
          then
            echo "Museum pack inventory is not bound to the validated selection." >&2
            exit 1
          fi
          export MUSEUM_SELECTED_PACKS_JSON="$effective_museum_packs"
          expected_inventory="$(./bin/6529 exec node - <<'NODE'
          const { PACKS } = require("./tests/packs.manifest.cjs");
          const selectedMuseumPacks = JSON.parse(
            process.env.MUSEUM_SELECTED_PACKS_JSON || "null"
          );
          if (!Array.isArray(selectedMuseumPacks)) {
            throw new Error("Museum selection evidence is missing.");
          }
          const isMuseumPack = (pack) =>
            pack.changeScope === "museum" || /^museum-/.test(pack.alias ?? "");
          const keys = PACKS.filter((pack) =>
            pack.environments.includes("production") &&
            pack.triggers.includes("post-deploy") &&
            (!isMuseumPack(pack) || selectedMuseumPacks.includes(pack.alias ?? pack.scriptKey))
          ).map((pack) => pack.scriptKey);
          process.stdout.write(JSON.stringify(keys));
          NODE
          )"
          jq -e --argjson expected "$expected_inventory" --argjson retry "$SERIAL_FAILED_PACK_RETRY" '
            .schema_version == "release-bus-e2e-packs.v1" and
            .environment == "production" and
            .trigger == "post-deploy" and
            (.worker_count | type == "number" and . >= 1 and . <= 3) and
            .pack_count == ($expected | length) and
            (.results | map(.script_key)) == $expected and
            (.results | map(.script_key) | unique | length) == .pack_count and
            (.results | all(.safety == "readonly")) and
            (if $retry then
              .serial_retry_limit == 1 and
              (.results | all(
                .attempt_count == (.attempts | length) and
                .attempt_count >= 1 and .attempt_count <= 2 and
                (.attempts | to_entries | all(.value.attempt == (.key + 1))) and
                .status == .attempts[-1].status and
                .failure_class == .attempts[-1].failure_class and
                .detail == .attempts[-1].detail and
                .artifact_path == .attempts[-1].artifact_path and
                .duration_ms == ([.attempts[].duration_ms] | add)
              ))
            else
              (.serial_retry_limit // 0) == 0
            end) and
            .failed_count == ([.results[] | select(.status == "failed")] | length) and
            .infrastructure_failure_count == ([.results[] | select(.failure_class == "infrastructure")] | length)
          ' production-e2e-artifacts/evidence.json >/dev/null
          if [ -n "$AUTOMATIC_DEPLOY_RUN_ID" ]; then
            test -z "$MANIFEST_ID$MANIFEST_IDENTITY"
            jq -e '.release_binding == null' \
              production-e2e-artifacts/evidence.json >/dev/null
          else
            jq -e --arg manifest_id "$MANIFEST_ID" --arg identity "$MANIFEST_IDENTITY" --arg source_sha "$EXPECTED_SHA" '
              .release_binding == {
                manifest_id:$manifest_id,
                manifest_identity_sha256:$identity,
                source_sha:$source_sha
              }
            ' production-e2e-artifacts/evidence.json >/dev/null
          fi
          if [ "$E2E_OUTCOME" = success ]; then
            jq -e '
              .failed_count == 0 and
              .infrastructure_failure_count == 0 and
              (.results | all(.status == "passed" and .failure_class == null))
            ' production-e2e-artifacts/evidence.json >/dev/null
          fi
      - name: Stage Museum selection with production evidence
        if: always()
        env:
          MUSEUM_SELECTION_FILE: ${{ steps.museum-selection.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p production-e2e-artifacts
          if [ -n "$MUSEUM_SELECTION_FILE" ] && [ -f "$MUSEUM_SELECTION_FILE" ]; then
            install -m 0644 \
              "$MUSEUM_SELECTION_FILE" \
              production-e2e-artifacts/museum-release-selection.json
          fi
      - name: Upload manifest-bound Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e-artifacts-${{ inputs.release_train_id || inputs.automatic_deploy_run_id || github.run_id }}
          path: production-e2e-artifacts/
          retention-days: 30
          if-no-files-found: ignore
      - name: Report structured Release Bus E2E result
        if: always() && inputs.operation_key != ''
        env:
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          MUSEUM_EVIDENCE_PATH_OUTCOME: ${{ steps.museum-evidence-path.outcome }}
          MUSEUM_EVIDENCE_CHECKOUT_OUTCOME: ${{ steps.museum-evidence-checkout.outcome }}
          MUSEUM_EVIDENCE_TOOLING_OUTCOME: ${{ steps.museum-evidence-tooling.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: |
          set -euo pipefail
          status=SUCCEEDED
          failure_class=null
          failure_phase=null
          retryable=false
          if [ "$SOCKET_OUTCOME" != success ] || [ "$DEPENDENCIES_OUTCOME" != success ] || [ "$PLAYWRIGHT_OUTCOME" != success ]; then
            status=FAILED
            failure_class=INFRASTRUCTURE
            failure_phase=production_e2e_setup
            retryable=true
          elif [ "$MUSEUM_EVIDENCE_PATH_OUTCOME" != success ] || \
            [ "$MUSEUM_EVIDENCE_CHECKOUT_OUTCOME" != success ] || \
            [ "$MUSEUM_EVIDENCE_TOOLING_OUTCOME" != success ] || \
            [ "$EVIDENCE_OUTCOME" != success ]; then
            status=FAILED
            failure_class=CONTROL_PLANE
            failure_phase=production_e2e_evidence
          elif [ "$E2E_OUTCOME" != success ]; then
            status=FAILED
            if [ -f production-e2e-artifacts/evidence.json ] && \
              [ "$(jq -r '.infrastructure_failure_count // 0' production-e2e-artifacts/evidence.json)" -gt 0 ]; then
              failure_class=INFRASTRUCTURE
              failure_phase=production_e2e_infrastructure
              retryable=true
            else
              failure_class=E2E
              failure_phase=production_e2e
            fi
          fi
          if [ -f production-e2e-artifacts/evidence.json ]; then
            evidence_digest="$(sha256sum production-e2e-artifacts/evidence.json | cut -d' ' -f1)"
          else
            evidence_digest=''
          fi
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg status "$status" --arg failure_class "$failure_class" --arg failure_phase "$failure_phase" --argjson retryable "$retryable" --arg evidence_digest "$evidence_digest" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,phase:"complete",status:$status,failure_class:(if $failure_class == "null" then null else $failure_class end),failure_phase:(if $failure_phase == "null" then null else $failure_phase end),retryable:$retryable,summary:{e2e_evidence_digest:(if $evidence_digest == "" then null else $evidence_digest end)},stages:[],jest:null,backend_evidence:null}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/report-progress"
      - name: Return production E2E result
        if: always()
        env:
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          MUSEUM_EVIDENCE_PATH_OUTCOME: ${{ steps.museum-evidence-path.outcome }}
          MUSEUM_EVIDENCE_CHECKOUT_OUTCOME: ${{ steps.museum-evidence-checkout.outcome }}
          MUSEUM_EVIDENCE_TOOLING_OUTCOME: ${{ steps.museum-evidence-tooling.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          test "$SOCKET_OUTCOME" = success
          test "$DEPENDENCIES_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success
          test "$MUSEUM_EVIDENCE_PATH_OUTCOME" = success
          test "$MUSEUM_EVIDENCE_CHECKOUT_OUTCOME" = success
          test "$MUSEUM_EVIDENCE_TOOLING_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$E2E_OUTCOME" = success
