name: Production E2E

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional exact SHA for a manual read-only run
        type: string
        required: false
      automatic_deploy_run_id:
        description: Internal successful Web Deploy - PROD run ID
        type: string
        required: false

permissions:
  actions: read
  contents: read

run-name: Production E2E ${{ inputs.automatic_deploy_run_id && format('automatic {0}', inputs.automatic_deploy_run_id) || 'manual' }}

concurrency:
  group: production-e2e
  cancel-in-progress: false

jobs:
  readonly:
    name: Production read-only E2E packs
    runs-on: ${{ vars.E2E_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Resolve exact deployed SHA
        id: source
        env:
          AUTOMATIC_DEPLOY_RUN_ID: ${{ inputs.automatic_deploy_run_id }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [ -n "$AUTOMATIC_DEPLOY_RUN_ID" ]; then
            [[ "$AUTOMATIC_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOMATIC_DEPLOY_RUN_ID}" > "$RUNNER_TEMP/deploy-run.json"
            deployed_sha="$(jq -er \
              --arg repository "$GITHUB_REPOSITORY" '
                select(
                  .path == ".github/workflows/build-upload-deploy-prod.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "main" and
                  .status == "completed" and
                  .conclusion == "success" and
                  .repository.full_name == $repository and
                  .head_repository.full_name == $repository and
                  (.head_sha | test("^[a-f0-9]{40}$"))
                ) | .head_sha
              ' "$RUNNER_TEMP/deploy-run.json")"
          else
            deployed_sha="${MANUAL_TARGET_SHA:-$GITHUB_SHA}"
            [[ "$deployed_sha" =~ ^[a-f0-9]{40}$ ]]
          fi
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact deployed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify exact deployed source
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Install Socket Firewall
        id: socket-firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Install frozen dependencies
        env:
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = true ]; then
            ./bin/6529 exec playwright install-deps chromium
          else
            ./bin/6529 exec playwright install --with-deps chromium
          fi

      - name: Run read-only production packs
        env:
          DEPLOYED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          DEPLOYMENT_E2E_SOURCE_SHA="$DEPLOYED_SHA" \
            ./bin/6529 run e2e:packs -- \
              --env production \
              --trigger post-deploy \
              --artifact-root production-e2e-artifacts \
              --parallel 3 \
              --retry-failed-packs 1

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e-artifacts-${{ github.run_id }}
          path: production-e2e-artifacts/
          retention-days: 30
          if-no-files-found: ignore
