name: Production E2E

on:
  workflow_call:
    inputs:
      trusted_deployed_sha:
        description: Exact SHA deployed by the calling canonical production workflow
        type: string
        required: true
  workflow_dispatch:
    inputs:
      automatic_deploy_run_id:
        description: Successful Web Deploy - PROD run ID to validate again
        type: string
        required: false
      trusted_deployed_sha:
        description: Exact live frontend SHA supplied by trusted deployment automation
        type: string
        required: false
      tracking_id:
        description: Opaque trusted-automation correlation ID
        type: string
        required: false

permissions:
  actions: read
  contents: read

run-name: Production E2E ${{ inputs.tracking_id != '' && format('[{0}]', inputs.tracking_id) || (inputs.trusted_deployed_sha && 'automatic' || 'manual') }}

concurrency:
  # Automatic E2E runs while the caller owns web-deploy-prod. Manual recovery
  # runs acquire web-deploy-prod themselves so deployment cannot change the
  # environment while it is being validated.
  group: ${{ inputs.tracking_id == '' && inputs.trusted_deployed_sha != '' && 'production-e2e' || 'web-deploy-prod' }}
  cancel-in-progress: false

jobs:
  readonly:
    name: Production read-only E2E packs
    runs-on: ${{ vars.E2E_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Resolve exact deployed SHA
        id: source
        env:
          AUTOMATIC_DEPLOY_RUN_ID: ${{ inputs.automatic_deploy_run_id }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_ID: ${{ inputs.tracking_id }}
          TRUSTED_DEPLOYED_SHA: ${{ inputs.trusted_deployed_sha }}
        run: |
          set -euo pipefail
          if [ -n "$TRUSTED_DEPLOYED_SHA" ]; then
            [[ "$TRUSTED_DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
            test -z "$AUTOMATIC_DEPLOY_RUN_ID"
            if [ -n "$TRACKING_ID" ]; then
              test "$GITHUB_ACTOR" = '6529-release-bus[bot]'
              [[ "$TRACKING_ID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
            else
              test -z "$TRACKING_ID"
            fi
            deployed_sha="$TRUSTED_DEPLOYED_SHA"
          else
            test -z "$TRACKING_ID"
            test "$GITHUB_REF" = refs/heads/main
            [[ "$AUTOMATIC_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOMATIC_DEPLOY_RUN_ID}" > "$RUNNER_TEMP/deploy-run.json"
            deployed_sha="$(jq -er \
              --arg repository "$GITHUB_REPOSITORY" '
                select(
                  .path == ".github/workflows/build-upload-deploy-prod.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "main" and
                  .status == "completed" and
                  .repository.full_name == $repository and
                  .head_repository.full_name == $repository and
                  (.run_attempt | type == "number" and . >= 1 and . <= 1000000) and
                  (.head_sha | test("^[a-f0-9]{40}$"))
                ) | .head_sha
              ' "$RUNNER_TEMP/deploy-run.json")"
            deploy_run_attempt="$(jq -er '.run_attempt' "$RUNNER_TEMP/deploy-run.json")"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOMATIC_DEPLOY_RUN_ID}/attempts/${deploy_run_attempt}/jobs?per_page=100" \
              > "$RUNNER_TEMP/deploy-jobs.json"
            jq -e '
              [.jobs[] | select(
                .name == "Deploy verified production artifact" and
                .status == "completed" and
                .conclusion == "success"
              )] | length == 1
            ' "$RUNNER_TEMP/deploy-jobs.json" >/dev/null
          fi
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted version verifier
        if: inputs.tracking_id != '' || inputs.trusted_deployed_sha == ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
          path: .version-verifier
          sparse-checkout: |
            ops/scripts/cli-args.cjs
            ops/scripts/verify-deployment-version.cjs
          sparse-checkout-cone-mode: false

      - name: Require the selected production deployment to still be live
        if: inputs.tracking_id != '' || inputs.trusted_deployed_sha == ''
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node .version-verifier/ops/scripts/verify-deployment-version.cjs \
            --base-url https://6529.io \
            --expected-version "$EXPECTED_SHA" \
            --attempts 1 \
            --delay-ms 1000 \
            --timeout-ms 10000 \
            --output "$RUNNER_TEMP/manual-production-version.json"

      - name: Check out exact deployed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify exact deployed source
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Install Socket Firewall
        id: socket-firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Install frozen dependencies
        env:
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = true ]; then
            ./bin/6529 exec playwright install-deps chromium
          else
            ./bin/6529 exec playwright install --with-deps chromium
          fi

      - name: Run read-only production packs
        env:
          DEPLOYED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          DEPLOYMENT_E2E_SOURCE_SHA="$DEPLOYED_SHA" \
            ./bin/6529 run e2e:packs -- \
              --env production \
              --trigger post-deploy \
              --artifact-root production-e2e-artifacts \
              --parallel 3 \
              --retry-failed-packs 1

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e-artifacts-${{ github.run_id }}
          path: production-e2e-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Check out trusted notification script
        if: always() && inputs.trusted_deployed_sha == '' && steps.source.outputs.sha != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .workflow-control
          sparse-checkout: scripts/notify-ci-wave.mjs
          sparse-checkout-cone-mode: false

      - name: Record manual production revalidation outcome
        if: always() && inputs.trusted_deployed_sha == '' && steps.source.outputs.sha != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
          CI_PIPELINES_NOTIFICATION_TYPE: release_validation
          CI_PIPELINES_VALIDATION_MODE: manual
          CI_PIPELINES_TRIGGERED_BY_GITHUB_LOGIN: ${{ github.triggering_actor }}
          CI_PIPELINES_TITLE: "Seize PROD WEB DEPLOY: manual production revalidation"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ steps.source.outputs.sha }}
          CI_RELEASE_GROUP_ID: ${{ github.repository }}:${{ inputs.automatic_deploy_run_id }}
        run: node .workflow-control/scripts/notify-ci-wave.mjs
