name: Production E2E

on:
  workflow_dispatch:
    inputs:
      deploy_hub_operation_id: { type: string, required: false, default: "" }
      release_train_id: { type: string, required: false, default: "" }
      release_train_revision: { type: string, required: false, default: "" }
      operation_key: { type: string, required: false, default: "" }
      source_ref: { type: string, required: true }
      expected_sha: { type: string, required: true }
      release_manifest_id: { type: string, required: false, default: "" }
      release_manifest_identity_sha256:
        { type: string, required: false, default: "" }
      frontend_sha: { type: string, required: false, default: "" }
      backend_sha: { type: string, required: false, default: "" }
      frontend_artifact_digest: { type: string, required: false, default: "" }
      backend_artifact_digest: { type: string, required: false, default: "" }

permissions:
  contents: read

run-name: Production E2E [${{ inputs.deploy_hub_operation_id || inputs.operation_key }}]

concurrency:
  group: production-e2e
  # Production read-only validation owns its lane independently. Never cancel
  # a manifest-bound run or share staging/ALL ownership.
  cancel-in-progress: false

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Validate and authorize immutable inputs
        env:
          DEPLOY_HUB_BASE_REF: ${{ github.event.repository.default_branch }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FRONTEND_ARTIFACT_DIGEST: ${{ inputs.frontend_artifact_digest }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          BACKEND_ARTIFACT_DIGEST: ${{ inputs.backend_artifact_digest }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [ -n "${DEPLOY_HUB_OPERATION_ID:-}" ]; then
            [[ "$DEPLOY_HUB_OPERATION_ID" =~ ^dh-([1-9][0-9]{0,19})r[1-9][0-9]{0,8}-c[1-9][0-9]*-production-a[12]$ ]]
            test "$GITHUB_ACTOR" = "github-actions[bot]"
            controller_run_id="${BASH_REMATCH[1]}"
            controller_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id")"
            jq -e \
              --arg branch "$DEPLOY_HUB_BASE_REF" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow ".github/workflows/deploy-hub-production.yml" \
              '.path == $workflow and .event == "workflow_dispatch" and .head_branch == $branch and .head_repository.full_name == $repository' \
              <<< "$controller_run" >/dev/null
            test "$SOURCE_REF" = main
            test -z "$TRAIN_ID$TRAIN_REVISION$OPERATION_KEY$MANIFEST_ID$MANIFEST_IDENTITY$FRONTEND_SHA$BACKEND_SHA$FRONTEND_ARTIFACT_DIGEST$BACKEND_ARTIFACT_DIGEST"
            exit 0
          fi
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^([1-9][0-9]{0,8}|rollback-[1-9][0-9]{0,8})$ ]]
          [[ "$OPERATION_KEY" =~ ^[A-Za-z0-9:._-]{1,180}$ ]]
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,255}$ ]]
          [[ "$MANIFEST_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$MANIFEST_IDENTITY" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$FRONTEND_SHA" || "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$BACKEND_SHA" || "$BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$FRONTEND_ARTIFACT_DIGEST" || "$FRONTEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$BACKEND_ARTIFACT_DIGEST" || "$BACKEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test -n "$FRONTEND_SHA$BACKEND_SHA"
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg expected_sha "$EXPECTED_SHA" --arg artifact_digest "$MANIFEST_IDENTITY" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,artifact_run_id:null,repository:"frontend",environment:"prod",service:null,expected_sha:$expected_sha,artifact_digest:$artifact_digest}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/authorize"
      - name: Check out exact production SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22.17.1" }
      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install Socket Firewall
        id: socket-firewall
        continue-on-error: true
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with: { mode: firewall }
      - name: Install frozen dependencies
        id: dependencies
        if: steps.socket-firewall.outcome == 'success'
        continue-on-error: true
        env:
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen
      - name: Install Playwright browser
        id: playwright
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: ./bin/6529 exec playwright install --with-deps chromium
      - name: Run production-safe read-only packs
        id: e2e
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_BUS_E2E_MANIFEST_ID: ${{ inputs.release_manifest_id }}
          RELEASE_BUS_E2E_MANIFEST_IDENTITY_SHA256: ${{ inputs.release_manifest_identity_sha256 }}
          RELEASE_BUS_E2E_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          args=(
            --env production
            --trigger post-deploy
            --artifact-root production-e2e-artifacts
          )
          if runner_capabilities="$(./bin/6529 exec node scripts/e2e-packs.cjs --capabilities 2>/dev/null)" &&
            jq -e '
              .contract == "release-bus-e2e-runner-capabilities.v1" and
              .features.readonly_pack_parallelism == {
                version: 1,
                max_parallel: 4
              }
            ' <<< "$runner_capabilities" >/dev/null
          then
            args+=(--parallel 3)
          fi
          ./bin/6529 run e2e:packs -- "${args[@]}"
      - name: Validate exact manifest-bound E2E evidence
        id: evidence
        if: always() && steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success'
        env:
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
        run: |
          set -euo pipefail
          test -f production-e2e-artifacts/evidence.json
          expected_inventory="$(./bin/6529 exec node - <<'NODE'
          const { PACKS } = require("./tests/packs.manifest.cjs");
          const keys = PACKS.filter((pack) =>
            pack.environments.includes("production") &&
            pack.triggers.includes("post-deploy")
          ).map((pack) => pack.scriptKey);
          process.stdout.write(JSON.stringify(keys));
          NODE
          )"
          jq -e --argjson expected "$expected_inventory" '
            .schema_version == "release-bus-e2e-packs.v1" and
            .environment == "production" and
            .trigger == "post-deploy" and
            (.worker_count | type == "number" and . >= 1 and . <= 3) and
            .pack_count == ($expected | length) and
            (.results | map(.script_key)) == $expected and
            (.results | map(.script_key) | unique | length) == .pack_count and
            (.results | all(.safety == "readonly")) and
            .failed_count == ([.results[] | select(.status == "failed")] | length) and
            .infrastructure_failure_count == ([.results[] | select(.failure_class == "infrastructure")] | length)
          ' production-e2e-artifacts/evidence.json >/dev/null
          if [ -n "$DEPLOY_HUB_OPERATION_ID" ]; then
            jq -e '.release_binding == null' production-e2e-artifacts/evidence.json >/dev/null
          else
            jq -e --arg manifest_id "$MANIFEST_ID" --arg identity "$MANIFEST_IDENTITY" --arg source_sha "$EXPECTED_SHA" '
              .release_binding == {
                manifest_id:$manifest_id,
                manifest_identity_sha256:$identity,
                source_sha:$source_sha
              }
            ' production-e2e-artifacts/evidence.json >/dev/null
          fi
          if [ "$E2E_OUTCOME" = success ]; then
            jq -e '
              .failed_count == 0 and
              .infrastructure_failure_count == 0 and
              (.results | all(.status == "passed" and .failure_class == null))
            ' production-e2e-artifacts/evidence.json >/dev/null
          fi
      - name: Upload manifest-bound Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e-artifacts-${{ inputs.deploy_hub_operation_id || inputs.release_train_id }}
          path: production-e2e-artifacts/
          retention-days: 30
          if-no-files-found: ignore
      - name: Report structured Release Bus E2E result
        if: always() && inputs.deploy_hub_operation_id == ''
        env:
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: |
          set -euo pipefail
          status=SUCCEEDED
          failure_class=null
          failure_phase=null
          retryable=false
          if [ "$SOCKET_OUTCOME" != success ] || [ "$DEPENDENCIES_OUTCOME" != success ] || [ "$PLAYWRIGHT_OUTCOME" != success ]; then
            status=FAILED
            failure_class=INFRASTRUCTURE
            failure_phase=production_e2e_setup
            retryable=true
          elif [ "$EVIDENCE_OUTCOME" != success ]; then
            status=FAILED
            failure_class=CONTROL_PLANE
            failure_phase=production_e2e_evidence
          elif [ "$E2E_OUTCOME" != success ]; then
            status=FAILED
            if [ -f production-e2e-artifacts/evidence.json ] && \
              [ "$(jq -r '.infrastructure_failure_count // 0' production-e2e-artifacts/evidence.json)" -gt 0 ]; then
              failure_class=INFRASTRUCTURE
              failure_phase=production_e2e_infrastructure
              retryable=true
            else
              failure_class=E2E
              failure_phase=production_e2e
            fi
          fi
          if [ -f production-e2e-artifacts/evidence.json ]; then
            evidence_digest="$(sha256sum production-e2e-artifacts/evidence.json | cut -d' ' -f1)"
          else
            evidence_digest=''
          fi
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg status "$status" --arg failure_class "$failure_class" --arg failure_phase "$failure_phase" --argjson retryable "$retryable" --arg evidence_digest "$evidence_digest" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,phase:"complete",status:$status,failure_class:(if $failure_class == "null" then null else $failure_class end),failure_phase:(if $failure_phase == "null" then null else $failure_phase end),retryable:$retryable,summary:{e2e_evidence_digest:(if $evidence_digest == "" then null else $evidence_digest end)},stages:[],jest:null,backend_evidence:null}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/report-progress"
      - name: Publish Deploy Hub E2E result
        if: always() && inputs.deploy_hub_operation_id != ''
        env:
          API_URL: ${{ github.api_url }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
        run: |
          set -euo pipefail
          state=success
          description="Production E2E passed"
          if [ "$SOCKET_OUTCOME" != success ] || [ "$DEPENDENCIES_OUTCOME" != success ] || [ "$PLAYWRIGHT_OUTCOME" != success ]; then
            state=error
            description="Production E2E infrastructure failure"
          elif [ "$EVIDENCE_OUTCOME" != success ]; then
            state=error
            description="Production E2E evidence failure"
          elif [ "$E2E_OUTCOME" != success ]; then
            if [ -f production-e2e-artifacts/evidence.json ] && [ "$(jq -r '.infrastructure_failure_count // 0' production-e2e-artifacts/evidence.json)" -gt 0 ]; then
              state=error
              description="Production E2E infrastructure failure"
            else
              state=failure
              description="Production E2E product failure"
            fi
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg description "$description" \
            --arg context "Deploy Hub E2E — $DEPLOY_HUB_OPERATION_ID" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$API_URL/repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA"
      - name: Return production E2E result
        if: always()
        env:
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          test "$SOCKET_OUTCOME" = success
          test "$DEPENDENCIES_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$E2E_OUTCOME" = success
