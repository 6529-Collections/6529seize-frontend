name: Release Bus - Deploy Frontend Production

on:
  workflow_dispatch:
    inputs:
      release_train_id: { type: string, required: true }
      release_contributors: { type: string, required: false, default: "[]" }
      release_train_revision: { type: string, required: true }
      operation_key: { type: string, required: true }
      source_ref: { type: string, required: true }
      expected_sha: { type: string, required: true }
      artifact_run_id: { type: string, required: true }
      artifact_train_id: { type: string, required: false, default: "" }
      artifact_digest: { type: string, required: true }
      artifact_environment:
        {
          type: choice,
          required: false,
          default: production,
          options: [staging, production],
        }
      artifact_contract_version:
        {
          type: choice,
          required: false,
          default: legacy-v2,
          options: [legacy-v2, environment-bound-v3],
        }

permissions:
  actions: read
  contents: read

run-name: Deploy frontend production train ${{ inputs.release_train_id }} [${{ inputs.operation_key }}]

concurrency:
  group: web-deploy-prod
  cancel-in-progress: false

env:
  AWS_BUCKET: seize-web
  AWS_REGION: us-east-1
  BEANSTALK_APP_NAME: seize app
  BEANSTALK_ENV_NAME: seizeapp-env-node22
  ANNOUNCED_VERSION_OBJECT_KEY: web_build/current-production-version.json
  ANNOUNCED_VERSION_ENDPOINT: https://dnclu2fna0b2b.cloudfront.net/web_build/current-production-version.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_TRAIN_ID: ${{ inputs.artifact_train_id || inputs.release_train_id }}
      ARTIFACT_CONTRACT_VERSION: ${{ inputs.artifact_contract_version }}
      ARTIFACT_ENVIRONMENT: ${{ inputs.artifact_environment }}
      EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      OPERATION_KEY: ${{ inputs.operation_key }}
      RELEASE_CONTRIBUTORS: ${{ inputs.release_contributors }}
      SOURCE_REF: ${{ inputs.source_ref }}
      TRAIN_ID: ${{ inputs.release_train_id }}
      TRAIN_REVISION: ${{ inputs.release_train_revision }}
    steps:
      - name: Validate dispatch inputs before using credentials
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_TRAIN_ID: ${{ inputs.artifact_train_id || inputs.release_train_id }}
          ARTIFACT_CONTRACT_VERSION: ${{ inputs.artifact_contract_version }}
          ARTIFACT_ENVIRONMENT: ${{ inputs.artifact_environment }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_CONTRIBUTORS: ${{ inputs.release_contributors }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ARTIFACT_CONTRACT_VERSION" =~ ^(legacy-v2|environment-bound-v3)$ ]]
          test "$ARTIFACT_ENVIRONMENT" = production
          if [ "$ARTIFACT_CONTRACT_VERSION" = legacy-v2 ]; then
            test "$ARTIFACT_TRAIN_ID" = "$TRAIN_ID"
          fi
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^([1-9][0-9]{0,8}|rollback-[1-9][0-9]{0,8})$ ]]
          [[ "$OPERATION_KEY" =~ ^[A-Za-z0-9:._-]{1,180}$ ]]
          # Semantic GitHub-login validation is centralized in notify-ci-wave.mjs.
          jq -e 'type == "array" and length <= 100 and all(.[]; type == "string" and length >= 1 and length <= 39)' <<< "$RELEASE_CONTRIBUTORS" > /dev/null
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,255}$ ]]
      - name: Authorize immutable Release Bus operation
        env:
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg artifact_run_id "$ARTIFACT_RUN_ID" --arg expected_sha "$EXPECTED_SHA" --arg artifact_digest "$EXPECTED_ARTIFACT_DIGEST" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,artifact_run_id:$artifact_run_id,repository:"frontend",environment:"prod",service:null,expected_sha:$expected_sha,artifact_digest:$artifact_digest}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/authorize"
      - name: Confirm immutable production ref without checkout
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          if ! commit_json="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_SHA")"; then
            echo "failure_kind=api" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          commit_sha="$(jq -r '.sha' <<< "$commit_json")"
          if [ "$commit_sha" != "$EXPECTED_SHA" ]; then
            echo "failure_kind=api" >> "$GITHUB_OUTPUT"
            echo "GitHub did not resolve the authorized production commit exactly." >&2
            exit 1
          fi
          if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"; then
            echo "failure_kind=api" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          observed_type="$(jq -r '.object.type' <<< "$ref_json")"
          observed_sha="$(jq -r '.object.sha' <<< "$ref_json")"
          if [ "$observed_type" != commit ] || ! [[ "$observed_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "failure_kind=api" >> "$GITHUB_OUTPUT"
            echo "GitHub returned an invalid main ref." >&2
            exit 1
          fi
          if [[ "$TRAIN_REVISION" != rollback-* ]] && [ "$observed_sha" != "$EXPECTED_SHA" ]; then
            echo "failure_kind=ref-moved" >> "$GITHUB_OUTPUT"
            echo "observed_sha=$observed_sha" >> "$GITHUB_OUTPUT"
            echo "main moved from expected $EXPECTED_SHA to $observed_sha." >&2
            exit 1
          fi
          if [[ "$TRAIN_REVISION" == rollback-* ]] && [ "$observed_sha" != "$EXPECTED_SHA" ]; then
            if ! compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SHA...$observed_sha")"; then
              echo "failure_kind=api" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            compare_status="$(jq -r '.status' <<< "$compare_json")"
            compare_base_sha="$(jq -r '.base_commit.sha' <<< "$compare_json")"
            merge_base_sha="$(jq -r '.merge_base_commit.sha' <<< "$compare_json")"
            if [ "$compare_base_sha" != "$EXPECTED_SHA" ] ||
              [ "$merge_base_sha" != "$EXPECTED_SHA" ] ||
              [[ ! "$compare_status" =~ ^(ahead|identical)$ ]]; then
              echo "failure_kind=rollback-not-reachable" >> "$GITHUB_OUTPUT"
              echo "observed_sha=$observed_sha" >> "$GITHUB_OUTPUT"
              echo "Authorized production rollback $EXPECTED_SHA is not reachable from current main $observed_sha." >&2
              exit 1
            fi
          fi
          echo "failure_kind=" >> "$GITHUB_OUTPUT"
      - name: Download immutable preflight artifact
        id: artifact-download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: release-bus-frontend-${{ inputs.artifact_train_id || inputs.release_train_id }}-r${{ inputs.release_train_revision }}
          path: release-bus-artifact
      - name: Verify and bind immutable artifact
        id: artifact
        run: |
          set -euo pipefail
          cd release-bus-artifact
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$OPERATION_KEY" =~ ^[A-Za-z0-9:._-]{1,180}$ ]]
          sha256sum -c SHA256SUMS
          artifact_digest="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          test "$artifact_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          schema_version="$(jq -r '.schema_version' manifest.json)"
          if [ "$ARTIFACT_CONTRACT_VERSION" = environment-bound-v3 ] && [ "$schema_version" = 3 ]; then
            jq -e \
              --arg train_id "$ARTIFACT_TRAIN_ID" \
              --arg source_sha "$EXPECTED_SHA" '
                .artifact_contract == "environment-bound-v1" and
                .artifact_contract_version == "environment-bound-v3" and
                .repository == "frontend" and
                .train_id == $train_id and
                .source_sha == $source_sha and
                .environment == "production" and
                .source_evidence_reused == true and
                .artifact_bytes_reused == false and
                (.package_sha256 | test("^[a-f0-9]{64}$"))
              ' manifest.json >/dev/null
            package_root=target
            portability_inventory=artifact-portability.json
            portability_inventory_required=true
            artifact_contract=environment-bound-v1
            package_digest="$(sha256sum "$package_root/package.zip" | cut -d' ' -f1)"
            test "$package_digest" = "$(jq -r '.package_sha256' manifest.json)"
          elif [ "$ARTIFACT_CONTRACT_VERSION" = legacy-v2 ] && [ "$schema_version" = 2 ]; then
            jq -e \
              --arg train_id "$ARTIFACT_TRAIN_ID" \
              --arg source_sha "$EXPECTED_SHA" '
                .repository == "frontend" and
                .train_id == $train_id and
                .source_sha == $source_sha and
                .environment == "dual" and
                (.profiles.production.package_sha256 | test("^[a-f0-9]{64}$"))
              ' manifest.json >/dev/null
            package_root=profiles/production/target
            portability_inventory=profiles/production/artifact-portability.json
            portability_inventory_required=false
            artifact_contract=legacy-v2
            package_digest="$(sha256sum "$package_root/package.zip" | cut -d' ' -f1)"
            test "$package_digest" = "$(jq -r '.profiles.production.package_sha256' manifest.json)"
          else
            echo "Artifact schema is incompatible with $ARTIFACT_CONTRACT_VERSION." >&2
            exit 1
          fi
          if [ -f "$portability_inventory" ]; then
            jq -e \
              --arg source_sha "$EXPECTED_SHA" \
              --arg package_sha256 "$package_digest" \
              '.schema_version == "artifact-portability.v1" and
               .contract == "artifact-portability-v1" and
               .environment == "production" and
               .source.git_sha == $source_sha and
               .digests.package_sha256 == $package_sha256 and
               .portability.status == "NOT_PORTABLE" and
               .portability.portable == false and
               .portability.reuse_authorized == false and
               .portability.promotion_authorized == false' \
              "$portability_inventory" >/dev/null
            portability_status=not-portable-inventory-verified
          elif [ "$portability_inventory_required" = true ]; then
            echo "Required v3 artifact-portability inventory is missing." >&2
            exit 1
          else
            echo "::notice::Pre-PR6 legacy-v2 artifact has no portability inventory; deploy compatibility is preserved, but reuse and promotion remain unauthorized."
            portability_status=not-portable-pre-pr6-legacy
          fi
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_contract=$artifact_contract" >> "$GITHUB_OUTPUT"
          echo "package_digest=$package_digest" >> "$GITHUB_OUTPUT"
          echo "portability_status=$portability_status" >> "$GITHUB_OUTPUT"
          echo "package_root=$package_root" >> "$GITHUB_OUTPUT"
          echo "schema_version=$schema_version" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload immutable application assets
        env:
          PACKAGE_ROOT: ${{ steps.artifact.outputs.package_root }}
        run: aws s3 sync "release-bus-artifact/${PACKAGE_ROOT}" "s3://${AWS_BUCKET}/web_build/${EXPECTED_SHA}/"
      - name: Ensure Elastic Beanstalk application version
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^([1-9][0-9]{0,8}|rollback-[1-9][0-9]{0,8})$ ]]
          source_key="web_build/${EXPECTED_SHA}/package.zip"
          version_json="$(aws elasticbeanstalk describe-application-versions \
            --application-name "$BEANSTALK_APP_NAME" \
            --version-labels "$EXPECTED_SHA" \
            --output json)"
          count="$(jq '.ApplicationVersions | length' <<< "$version_json")"
          if [ "$count" -eq 0 ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "$BEANSTALK_APP_NAME" \
              --source-bundle "S3Bucket=${AWS_BUCKET},S3Key=${source_key}" \
              --version-label "$EXPECTED_SHA" \
              --description "Release Bus train $TRAIN_ID revision $TRAIN_REVISION"
          elif [ "$count" -eq 1 ]; then
            test "$(jq -r '.ApplicationVersions[0].SourceBundle.S3Bucket' <<< "$version_json")" = "$AWS_BUCKET"
            test "$(jq -r '.ApplicationVersions[0].SourceBundle.S3Key' <<< "$version_json")" = "$source_key"
          else
            echo 'More than one application version matched the immutable SHA.' >&2
            exit 1
          fi
      - name: Deploy application version
        env:
          SSR_CLIENT_ID: ${{ secrets.SSR_CLIENT_ID }}
          SSR_CLIENT_SECRET: ${{ secrets.SSR_CLIENT_SECRET }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_LINK_STATUS_PREVIEW_TOKEN: ${{ secrets.LINK_STATUS_PREVIEW_GITHUB_TOKEN }}
          PUBLIC_REVIEW_DISCUSSION_DESTINATIONS: ${{ secrets.PUBLIC_REVIEW_PRODUCTION_DISCUSSION_DESTINATIONS }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]

          jq -e '
            type == "object" and
            keys == ["production"] and
            (.production | type == "object") and
            (.production["stream-review"] | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
          ' <<<"$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" >/dev/null

          option_settings="$(
            jq -cn \
              --arg ssr_client_id "$SSR_CLIENT_ID" \
              --arg ssr_client_secret "$SSR_CLIENT_SECRET" \
              --arg alchemy_api_key "$ALCHEMY_API_KEY" \
              --arg github_link_status_preview_token "$GITHUB_LINK_STATUS_PREVIEW_TOKEN" \
              --arg public_review_discussion_destinations "$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" \
              '[
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_ID",Value:$ssr_client_id},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_SECRET",Value:$ssr_client_secret},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"ALCHEMY_API_KEY",Value:$alchemy_api_key},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"GITHUB_LINK_STATUS_PREVIEW_TOKEN",Value:$github_link_status_preview_token},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"PUBLIC_REVIEW_DISCUSSION_DESTINATIONS",Value:$public_review_discussion_destinations},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SENTRY_SERVER_INSTRUMENTATION",Value:"false"}
              ]'
          )"

          aws elasticbeanstalk update-environment \
            --application-name "$BEANSTALK_APP_NAME" \
            --environment-name "$BEANSTALK_ENV_NAME" \
            --version-label "$EXPECTED_SHA" \
            --option-settings "$option_settings"
      - name: Check out deployment verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .release-bus-verifier
          sparse-checkout: |
            ops/scripts/verify-deployment-version.cjs
            ops/scripts/cli-args.cjs
            ops/scripts/elastic-beanstalk-readiness.cjs
          sparse-checkout-cone-mode: false
      - name: Check Elastic Beanstalk health and readiness (adaptive exact-version poll)
        run: |
          set -euo pipefail
          node .release-bus-verifier/ops/scripts/elastic-beanstalk-readiness.cjs \
            --environment-name "${BEANSTALK_ENV_NAME}" \
            --expected-version "${EXPECTED_SHA}" \
            --timeout-seconds 1320 \
            --output elastic-beanstalk-readiness.json
      - name: Verify exact production version
        id: version
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          node .release-bus-verifier/ops/scripts/verify-deployment-version.cjs \
            --base-url https://6529.io \
            --expected-version "$EXPECTED_SHA" \
            --attempts 12 \
            --required-matches 3 \
            --delay-ms 10000 \
            --timeout-ms 10000 \
            --output deployment-version-evidence.json
      - name: Publish announced production version
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          workflow_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg version "$EXPECTED_SHA" \
            --arg published_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg workflow_run_url "$workflow_run_url" \
            '{schema_version:"frontend-announced-version.v1",environment:"production",version:$version,ready:true,published_at:$published_at,workflow_run_url:$workflow_run_url}' \
            > current-production-version.json
          aws s3 cp current-production-version.json "s3://${AWS_BUCKET}/${ANNOUNCED_VERSION_OBJECT_KEY}" \
            --cache-control 'no-store, max-age=0, must-revalidate' \
            --content-type application/json
          cdn_host="$(node -e 'process.stdout.write(new URL(process.env.ANNOUNCED_VERSION_ENDPOINT).hostname)')"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${cdn_host}'].Id | [0]" \
            --output text)"
          if [ -n "$distribution_id" ] && [ "$distribution_id" != None ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$distribution_id" \
              --paths "/${ANNOUNCED_VERSION_OBJECT_KEY}"
          else
            echo "Warning: no CloudFront distribution matched $cdn_host; announced-version invalidation was skipped." >&2
          fi
      - name: Upload deployment evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bus-production-deploy-${{ inputs.release_train_id }}-r${{ inputs.release_train_revision }}
          path: |
            deployment-version-evidence.json
            elastic-beanstalk-readiness.json
          if-no-files-found: error
          retention-days: 90
      - name: Report structured Release Bus deployment result
        if: always()
        env:
          ARTIFACT_CONTRACT: ${{ steps.artifact.outputs.artifact_contract }}
          ARTIFACT_CONTRACT_VERSION: ${{ inputs.artifact_contract_version }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_ENVIRONMENT: ${{ inputs.artifact_environment }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_TRAIN_ID: ${{ inputs.artifact_train_id || inputs.release_train_id }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          PACKAGE_DIGEST: ${{ steps.artifact.outputs.package_digest }}
          SCHEMA_VERSION: ${{ steps.artifact.outputs.schema_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SOURCE_FAILURE_KIND: ${{ steps.source.outputs.failure_kind }}
          DOWNLOAD_OUTCOME: ${{ steps.artifact-download.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PORTABILITY_STATUS: ${{ steps.artifact.outputs.portability_status }}
          AWS_OUTCOME: ${{ steps.aws-credentials.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          status=SUCCEEDED
          failure_class=null
          failure_phase=null
          retryable=false
          if [ "$JOB_STATUS" != success ]; then
            status=FAILED
            failure_class=DEPLOYMENT
            failure_phase=production_deploy
            retryable=true
            if [ "$SOURCE_OUTCOME" = failure ] || [ "$DOWNLOAD_OUTCOME" = failure ] || [ "$EVIDENCE_OUTCOME" = failure ]; then
              failure_class=INFRASTRUCTURE
              failure_phase=artifact_transport
              retryable=true
            elif [ "$ARTIFACT_OUTCOME" = failure ] || [ "$AWS_OUTCOME" = failure ]; then
              failure_class=CONTROL_PLANE
              failure_phase=deployment_identity_or_credentials
            fi
          fi
          if [ "$SOURCE_OUTCOME" = failure ] && [ "$SOURCE_FAILURE_KIND" = ref-moved ]; then
            failure_class=INTERACTION
            failure_phase=source_ref_moved
            retryable=false
          elif [ "$SOURCE_OUTCOME" = failure ] && [ "$SOURCE_FAILURE_KIND" = rollback-not-reachable ]; then
            failure_class=INTERACTION
            failure_phase=rollback_source_not_reachable
            retryable=false
          fi
          consumed_preflight_artifact=false
          if [ "$ARTIFACT_OUTCOME" = success ]; then
            consumed_preflight_artifact=true
          fi
          deployment_environment="$ARTIFACT_ENVIRONMENT"
          summary_environment="$ARTIFACT_ENVIRONMENT"
          payload="$(jq -n \
            --arg train_id "$TRAIN_ID" \
            --arg operation_key "$OPERATION_KEY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg status "$status" \
            --arg failure_class "$failure_class" \
            --arg failure_phase "$failure_phase" \
            --argjson retryable "$retryable" \
            --argjson consumed_preflight_artifact "$consumed_preflight_artifact" \
            --arg schema_version "$SCHEMA_VERSION" \
            --arg artifact_contract "$ARTIFACT_CONTRACT" \
            --arg artifact_contract_version "$ARTIFACT_CONTRACT_VERSION" \
            --arg repository frontend \
            --arg source_sha "$EXPECTED_SHA" \
            --arg environment "$summary_environment" \
            --arg deployment_environment "$deployment_environment" \
            --arg artifact_run_id "$ARTIFACT_RUN_ID" \
            --arg artifact_train_id "$ARTIFACT_TRAIN_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg package_digest "$PACKAGE_DIGEST" \
            --arg portability_status "$PORTABILITY_STATUS" \
            --argjson source_evidence_reused "$([ "$ARTIFACT_CONTRACT" = environment-bound-v1 ] && printf true || printf false)" \
            --argjson artifact_bytes_reused false \
            '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,phase:"complete",status:$status,failure_class:(if $failure_class == "null" then null else $failure_class end),failure_phase:(if $failure_phase == "null" then null else $failure_phase end),retryable:$retryable,summary:{schema_version:(if $schema_version == "" then null else ($schema_version | tonumber) end),artifact_contract:(if $artifact_contract == "" then null else $artifact_contract end),artifact_contract_version:$artifact_contract_version,repository:$repository,source_sha:$source_sha,environment:$environment,deployment_environment:$deployment_environment,portability_status:(if $portability_status == "" then null else $portability_status end),service:null,artifact_run_id:$artifact_run_id,artifact_train_id:$artifact_train_id,artifact_digest:(if $artifact_digest == "" then null else $artifact_digest end),package_digest:(if $package_digest == "" then null else $package_digest end),consumed_preflight_artifact:$consumed_preflight_artifact,rebuilt:false,source_evidence_reused:$source_evidence_reused,artifact_bytes_reused:$artifact_bytes_reused},stages:[],jest:null,backend_evidence:null}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/report-progress"
      - name: Check out CI wave notifier
        if: always()
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .ci-wave-notifier
          sparse-checkout: scripts/notify-ci-wave.mjs
          sparse-checkout-cone-mode: false
      - name: Verify CI wave notifier checkout
        if: always()
        run: |
          test -f .ci-wave-notifier/scripts/notify-ci-wave.mjs || {
            echo 'CI wave notifier checkout is unavailable.' >&2
            exit 1
          }
      - name: Notify CI wave about failure
        if: failure() && hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_ALERT_TYPE: deploy
          CI_PIPELINES_TARGET_ENV: prod
          CI_PIPELINES_STATUS: failure
          CI_PIPELINES_TITLE: WEB deploy failed
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ inputs.expected_sha }}
          CI_RELEASE_TRAIN_ID: ${{ inputs.release_train_id }}
          CI_RELEASE_OPERATION_KEY: ${{ inputs.operation_key }}
          CI_RELEASE_CONTRIBUTORS: ${{ inputs.release_contributors }}
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs
      - name: Notify CI wave about success
        if: success() && hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_ALERT_TYPE: deploy
          CI_PIPELINES_TARGET_ENV: prod
          CI_PIPELINES_STATUS: success
          CI_PIPELINES_TITLE: WEB deploy complete
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ inputs.expected_sha }}
          CI_RELEASE_TRAIN_ID: ${{ inputs.release_train_id }}
          CI_RELEASE_OPERATION_KEY: ${{ inputs.operation_key }}
          CI_RELEASE_CONTRIBUTORS: ${{ inputs.release_contributors }}
          CI_RELEASE_NOTES_PROMPT_PATH: ops/release-notes/release-notes.prompt.md
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs
