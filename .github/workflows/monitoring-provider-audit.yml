            const cursor = url.searchParams.get('cursor');
            const fixed = [...expected.searchParams.entries()];
            const actualFixed = [...url.searchParams.entries()].filter(([key]) => key !== 'cursor');
            if (JSON.stringify(actualFixed) !== JSON.stringify(fixed)) return { limitation: 'pagination_invalid' };
            if (result[1] === 'false') return { complete: true };
            if (keys.filter(key => key === 'cursor').length !== 1 || !cursor || cursor.length > 1024 ||
                /[\u0000-\u001f\u007f]/.test(cursor)) return { limitation: 'pagination_invalid' };
            return { cursor, path: path + (fixed.length ? '&' : '?') + 'cursor=' + encodeURIComponent(cursor) };
          }
