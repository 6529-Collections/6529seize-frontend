            return { status, pages: LIMITS.pages, items, complete: false, limitation: 'page_limit' };
          }
          function inventory(value) {
            return { status: value.status, pages: value.pages, count: value.items.length,
              complete: value.complete, limitation: value.limitation };
          }
          function destination(value) {
            if (typeof value !== 'string' || value.length > 2048) return 'unknown';
            try {
              const url = new URL(value);
              if (url.protocol !== 'https:' || url.username || url.password || url.port ||
                  url.search || url.hash) return 'unsupported';
              const fingerprint = hash(url.origin + url.pathname);
              return Object.entries(COLLECTORS).find(([, pin]) => pin === fingerprint)?.[0] ?? 'different';
            } catch { return 'unknown'; }
          }
          // Hash only bounded JSON; never retain provider text, recipients or endpoint paths.
          function fingerprint(value) {
            let nodes = 0;
            function canonical(item, depth) {
              if (++nodes > 5000 || depth > 12) throw new Error('HASH_LIMIT');
              if (item === null || typeof item === 'boolean') return item;
              if (typeof item === 'number' && Number.isFinite(item)) return item;
              if (typeof item === 'string' && item.length <= 8192) return item;
              if (Array.isArray(item) && item.length <= LIMITS.nested) return item.map(v => canonical(v, depth + 1));
              if (!record(item) || Object.keys(item).length > LIMITS.nested) throw new Error('HASH_SHAPE');
              return Object.fromEntries(Object.keys(item).sort(lexical).map(key => [key, canonical(item[key], depth + 1)]));
            }
            try { return hash(JSON.stringify(canonical(value, 0))); } catch { return null; }
          }
          function eventProjection(values) {
