name: Audit monitoring provider access

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitoring-provider-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Run this read-only audit from main.'
            exit 1
          fi
      - name: Read Sentry monitoring capabilities and configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_MONITORING_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_BUILD_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const API = 'https://sentry.io/api/0/';
          const ORG = 'seize-ff';
          const ORG_PATH = 'organizations/' + ORG + '/';
          const PROJECT_PATH = 'projects/' + ORG + '/';
          const PROJECTS = ['6529-frontend', 'seize-backend'];
          // Pin the trusted production collector origin + /sentry without publishing its URL.
          // Rotate only after independent verification of the monitoring stack output.
          const COLLECTORS = {
            prod: '6d1f55bab91567b4efe26df867b8e9d72172b02e29b9534175bb5cae8c40b5a8',
          };
          const LIMITS = { pages: 8, items: 400, nested: 50, bytes: 1048576, reads: 48, details: 12 };
          let totalReads = 0;
          const READ_DEADLINE = Date.now() + 150000;
          const ACTIONS = new Map([
            ['sentry.rules.actions.notify_event_service.NotifyEventServiceAction', 'named_integration'],
            ['sentry.rules.actions.notify_event_sentry_app.NotifyEventSentryAppAction', 'custom_component'],
            ['sentry.rules.actions.notify_event.NotifyEventAction', 'all_enabled_integrations'],
            ['sentry.mail.actions.NotifyEmailAction', 'email'],
            ['sentry.integrations.slack.notify_action.SlackNotifyServiceAction', 'slack'],
          ]);
          const CONDITIONS = new Map([
            ['sentry.rules.conditions.first_seen_event.FirstSeenEventCondition', 'first_seen'],
            ['sentry.rules.conditions.regression_event.RegressionEventCondition', 'regression'],
            ['sentry.rules.conditions.reappeared_event.ReappearedEventCondition', 'reappeared'],
            ['sentry.rules.conditions.every_event.EveryEventCondition', 'every_event'],
            ['sentry.rules.conditions.level.LevelCondition', 'level'],
            ['sentry.rules.filters.level.LevelFilter', 'level'],
            ['sentry.rules.conditions.event_frequency.EventFrequencyCondition', 'frequency'],
            ['sentry.rules.conditions.event_frequency.EventUniqueUserFrequencyCondition', 'unique_users'],
            ['sentry.rules.conditions.event_frequency.EventFrequencyPercentCondition', 'frequency_percent'],
            ['sentry.rules.filters.tagged_event.TaggedEventFilter', 'tag_filter'],
          ]);
          const SIMPLE_CONDITIONS = new Set(['first_seen', 'regression', 'reappeared', 'every_event']);
          const WEBHOOK_EVENTS = new Set([
            'error', 'error.created', 'issue', 'event.alert', 'metric_alert',
            'installation', 'installation.created', 'installation.deleted', 'comment.created',
            'issue.created', 'issue.resolved', 'issue.unresolved', 'issue.assigned', 'issue.ignored',
          ]);
          function record(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
          }
          function choice(value, allowed) {
            return allowed.includes(value) ? value : 'unknown';
          }
          function boolean(value) {
            return typeof value === 'boolean' ? value : 'unknown';
          }
          function frequencyMinutes(value) {
            return Number.isSafeInteger(value) && value >= 0 && value <= 43200 ? value : 'unknown';
          }
          function identity(value) {
            return typeof value === 'string' && /^[A-Za-z0-9_-]{1,128}$/.test(value) ? value : null;
          }
          function hash(value) {
            return createHash('sha256').update(value).digest('hex');
          }
          function idHash(value) {
            const id = identity(value);
            return id === null ? null : hash(id);
          }
          function lexical(a, b) {
            if (a === b) return 0;
            return a < b ? -1 : 1;
          }
          async function readJson(response) {
            if (!response.body) throw new Error('NO_BODY');
            const streamReader = response.body.getReader();
            const chunks = [];
            let length = 0;
            try {
              while (true) {
                const next = await streamReader.read();
                if (next.done) break;
                length += next.value.byteLength;
                if (length > LIMITS.bytes) throw new Error('BODY_LIMIT');
                chunks.push(next.value);
              }
              return JSON.parse(Buffer.concat(chunks).toString('utf8'));
            } finally {
              await streamReader.cancel().catch(() => {});
              streamReader.releaseLock();
            }
