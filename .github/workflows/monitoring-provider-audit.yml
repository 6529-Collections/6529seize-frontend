              else if (['api.6529.io', 'staging.6529.io'].includes(url.hostname)) result.kind = '6529_api';
              else if (/^[a-z0-9]+\.execute-api\.[a-z]{2}(?:-gov)?-[a-z]+-[0-9]\.amazonaws\.com$/.test(url.hostname)) result.kind = 'other_aws_gateway';
