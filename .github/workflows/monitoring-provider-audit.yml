name: Audit monitoring provider access

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitoring-provider-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Run this read-only audit from main.'
            exit 1
          fi
      - name: Read Sentry monitoring capabilities and configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_MONITORING_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const API = 'https://sentry.io/api/0/';
          const ORG = 'seize-ff';
          const ORG_PATH = 'organizations/' + ORG + '/';
          const PROJECT_PATH = 'projects/' + ORG + '/';
          const PROJECTS = ['6529-frontend', 'seize-backend'];
          // Pin the trusted production collector origin + /sentry without publishing its URL.
          // Rotate only after independent verification of the monitoring stack output.
          const COLLECTORS = {
            prod: '6d1f55bab91567b4efe26df867b8e9d72172b02e29b9534175bb5cae8c40b5a8',
          };
          const LIMITS = { pages: 8, items: 400, nested: 50, bytes: 1048576, reads: 48 };
          const READ_DEADLINE = Date.now() + 150000;
          const ACTIONS = new Map([
            ['sentry.rules.actions.notify_event_service.NotifyEventServiceAction', 'named_integration'],
            ['sentry.rules.actions.notify_event_sentry_app.NotifyEventSentryAppAction', 'custom_component'],
            ['sentry.rules.actions.notify_event.NotifyEventAction', 'all_enabled_integrations'],
            ['sentry.mail.actions.NotifyEmailAction', 'email'],
            ['sentry.integrations.slack.notify_action.SlackNotifyServiceAction', 'slack'],
          ]);
          const CONDITIONS = new Map([
            ['sentry.rules.conditions.first_seen_event.FirstSeenEventCondition', 'first_seen'],
            ['sentry.rules.conditions.regression_event.RegressionEventCondition', 'regression'],
            ['sentry.rules.conditions.reappeared_event.ReappearedEventCondition', 'reappeared'],
            ['sentry.rules.conditions.every_event.EveryEventCondition', 'every_event'],
            ['sentry.rules.conditions.level.LevelCondition', 'level'],
            ['sentry.rules.filters.level.LevelFilter', 'level'],
            ['sentry.rules.conditions.event_frequency.EventFrequencyCondition', 'frequency'],
            ['sentry.rules.conditions.event_frequency.EventUniqueUserFrequencyCondition', 'unique_users'],
            ['sentry.rules.conditions.event_frequency.EventFrequencyPercentCondition', 'frequency_percent'],
            ['sentry.rules.filters.tagged_event.TaggedEventFilter', 'tag_filter'],
          ]);
          const SIMPLE_CONDITIONS = new Set(['first_seen', 'regression', 'reappeared', 'every_event']);
          const WEBHOOK_EVENTS = new Set([
            'error', 'issue', 'event.alert', 'metric_alert',
            'issue.created', 'issue.resolved', 'issue.unresolved', 'issue.assigned', 'issue.ignored',
          ]);
          function record(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
          }
          function choice(value, allowed) {
            return allowed.includes(value) ? value : 'unknown';
          }
          function boolean(value) {
            return typeof value === 'boolean' ? value : 'unknown';
          }
          function frequencyMinutes(value) {
            return Number.isSafeInteger(value) && value >= 0 && value <= 43200 ? value : 'unknown';
          }
          function identity(value) {
            return typeof value === 'string' && /^[A-Za-z0-9_-]{1,128}$/.test(value) ? value : null;
          }
          function hash(value) {
            return createHash('sha256').update(value).digest('hex');
          }
          function idHash(value) {
            const id = identity(value);
            return id === null ? null : hash(id);
          }
          function lexical(a, b) {
            if (a === b) return 0;
            return a < b ? -1 : 1;
          }
          async function readJson(response) {
            if (!response.body) throw new Error('NO_BODY');
            const streamReader = response.body.getReader();
            const chunks = [];
            let length = 0;
            try {
              while (true) {
                const next = await streamReader.read();
                if (next.done) break;
                length += next.value.byteLength;
                if (length > LIMITS.bytes) throw new Error('BODY_LIMIT');
                chunks.push(next.value);
              }
              return JSON.parse(Buffer.concat(chunks).toString('utf8'));
            } finally {
              await streamReader.cancel().catch(() => {});
              streamReader.releaseLock();
            }
          }
          function reader(token) {
            let reads = 0;
            return async function read(path) {
              if (++reads > LIMITS.reads || Date.now() > READ_DEADLINE) {
                return { status: 'unavailable', reason: 'read_budget' };
              }
              try {
                const response = await fetch(API + path, {
                  method: 'GET',
                  headers: { Authorization: 'Bearer ' + token },
                  redirect: 'error',
                  signal: AbortSignal.timeout(Math.min(15000, Math.max(1, READ_DEADLINE - Date.now()))),
                });
                if (!response.ok) {
                  await response.body?.cancel();
                  return { status: response.status, reason: 'http_status' };
                }
                const data = await readJson(response);
                return { status: response.status, data, link: response.headers.get('link') };
              } catch {
                return { status: 'unavailable', reason: 'transport_or_body' };
              }
            };
          }
          function nextPage(link, path) {
            if (typeof link !== 'string' || link.length > 8192) return { limitation: 'pagination_not_exposed' };
            const entries = link.split(',').filter(value => /;\s*rel="next"(?:;|$)/.test(value.trim()));
            if (entries.length !== 1) return { limitation: 'pagination_invalid' };
            const entry = entries[0].trim();
            const target = /^<([^<>]+)>/.exec(entry);
            const result = /;\s*results="(true|false)"(?:;|$)/.exec(entry);
            if (!target || !result) return { limitation: 'pagination_invalid' };
            let url;
            try { url = new URL(target[1]); } catch { return { limitation: 'pagination_invalid' }; }
            const expected = new URL(API + path);
            if (url.origin !== expected.origin || url.pathname !== expected.pathname ||
                url.username || url.password || url.hash) return { limitation: 'pagination_target_rejected' };
            if (result[1] === 'false') return { complete: true };
            const keys = [...url.searchParams.keys()];
            const cursor = url.searchParams.get('cursor');
            if (keys.length !== 1 || keys[0] !== 'cursor' || !cursor || cursor.length > 1024 ||
                /[\u0000-\u001f\u007f]/.test(cursor)) return { limitation: 'pagination_invalid' };
            return { cursor, path: path + '?cursor=' + encodeURIComponent(cursor) };
          }
          async function paginate(read, path, first) {
            const items = [];
            const seen = new Set();
            let page = first ?? await read(path);
            const status = page.status;
            for (let count = 1; count <= LIMITS.pages; count++) {
              if (page.status !== 200 || !Array.isArray(page.data) || !page.data.every(record)) {
                return { status, pages: count, items, complete: false, limitation: 'page_unavailable_or_invalid' };
              }
              if (items.length + page.data.length > LIMITS.items) {
                return { status, pages: count, items, complete: false, limitation: 'item_limit' };
              }
              items.push(...page.data);
              const next = nextPage(page.link, path);
              if (next.complete) return { status, pages: count, items, complete: true, limitation: null };
              if (next.limitation) return { status, pages: count, items, complete: false, limitation: next.limitation };
              if (seen.has(next.cursor)) return { status, pages: count, items, complete: false, limitation: 'cursor_repeated' };
              if (count === LIMITS.pages) break;
              seen.add(next.cursor);
              page = await read(next.path);
            }
            return { status, pages: LIMITS.pages, items, complete: false, limitation: 'page_limit' };
          }
          function inventory(value) {
            return { status: value.status, pages: value.pages, count: value.items.length,
              complete: value.complete, limitation: value.limitation };
          }
          function destination(value) {
            if (typeof value !== 'string' || value.length > 2048) return 'unknown';
            try {
              const url = new URL(value);
              if (url.protocol !== 'https:' || url.username || url.password || url.port ||
                  url.search || url.hash) return 'unsupported';
              const fingerprint = hash(url.origin + url.pathname);
              return Object.entries(COLLECTORS).find(([, pin]) => pin === fingerprint)?.[0] ?? 'different';
            } catch { return 'unknown'; }
          }
          function listProjection(values, project) {
            if (!Array.isArray(values)) return { items: null, complete: false };
            return { items: values.slice(0, LIMITS.nested).map(project), complete: values.length <= LIMITS.nested };
          }
          function integration(app, installations) {
            const uuid = identity(app.uuid);
            const matches = uuid === null ? [] : installations.items.filter(value => identity(value.app?.uuid) === uuid);
            const states = [...new Set(matches.map(value => choice(value.status, ['installed', 'pending'])))].sort(lexical);
            const events = Array.isArray(app.webhookEvents) ? app.webhookEvents : null;
            return {
              idHash: idHash(app.uuid), disabled: boolean(app.isDisabled), alertable: boolean(app.isAlertable),
              publicationStatus: choice(app.status, ['internal', 'published', 'unpublished']),
              verifyInstall: boolean(app.verifyInstall),
              installationCount: uuid === null ? null : matches.length,
              installationInventoryComplete: installations.complete,
              installationStates: states,
              destinationMatch: destination(app.webhookUrl),
              webhookEvents: events === null ? null : {
                knownValues: [...new Set(events.filter(value => WEBHOOK_EVENTS.has(value)))].sort(lexical),
                unknownCount: events.filter(value => !WEBHOOK_EVENTS.has(value)).length,
              },
              signingConfiguration: 'not_verified',
            };
          }
          function action(value, apps, installations) {
            if (!record(value)) return { type: 'unknown', destinationMatch: 'unknown' };
            const type = ACTIONS.get(value.id) ?? 'unknown';
            const result = { type, disabled: boolean(value.disabled), destinationMatch: 'unknown',
              targetJoin: 'not_verified', componentConfigurationVerified: false };
            if (type === 'custom_component') {
              result.targetIdHash = idHash(value.sentryAppInstallationUuid);
            }
            if (type !== 'named_integration' || identity(value.service) === null) return result;
            const matches = apps.items.filter(app => app.slug === value.service);
            result.targetJoin = 'unknown';
            if (matches.length !== 1 || !apps.complete || !installations.complete) return result;
            const target = integration(matches[0], installations);
            return { ...result, targetJoin: 'unique_created_app', targetIdHash: target.idHash,
              destinationMatch: target.destinationMatch, targetDisabled: target.disabled,
              targetAlertable: target.alertable, targetInstallationCount: target.installationCount,
              targetInstallationStates: target.installationStates };
          }
          function condition(value) {
            if (!record(value)) return { type: 'unknown', parametersVerified: false };
            const type = CONDITIONS.get(value.id) ?? 'unknown';
            const keys = Object.keys(value);
            if (type === 'level') {
              const level = typeof value.level === 'number' ? String(value.level) : value.level;
              const match = choice(value.match, ['eq', 'gte', 'lte']);
              const known = ['0', '10', '20', '30', '40', '50'].includes(level) && match !== 'unknown';
              return { type, level: known ? level : 'unknown', comparison: match,
                parametersVerified: known && keys.every(key => ['id', 'name', 'level', 'match'].includes(key)) };
            }
            return { type, parametersVerified: SIMPLE_CONDITIONS.has(type) &&
              keys.every(key => ['id', 'name'].includes(key)) };
          }
          function rule(value, apps, installations) {
            const conditions = listProjection(value.conditions, condition);
            const filters = listProjection(value.filters, condition);
            const actions = listProjection(value.actions, item => action(item, apps, installations));
            return {
              idHash: idHash(value.id), status: choice(value.status, ['active', 'disabled']),
              snoozedForAuditIdentity: boolean(value.snooze),
              snoozedForEveryone: boolean(value.snoozeForEveryone),
              notificationFrequencyMinutes: frequencyMinutes(value.frequency),
              environment: value.environment === null ? 'all' : choice(value.environment, ['prod', 'production', 'staging']),
              actionMatch: choice(value.actionMatch, ['all', 'any', 'none']),
              filterMatch: choice(value.filterMatch, ['all', 'any', 'none']),
              conditions: conditions.items, filters: filters.items, actions: actions.items,
              nestedProjectionComplete: conditions.complete && filters.complete && actions.complete,
              providerRepresentationErrorCount: Array.isArray(value.errors) ? value.errors.length : null,
              fullWorkflowCoverageVerified: false,
            };
          }
          async function configuration(read, rules, integrations) {
            const [apps, installations, front, back] = await Promise.all([
              paginate(read, ORG_PATH + 'sentry-apps/', integrations),
              paginate(read, ORG_PATH + 'sentry-app-installations/'),
              paginate(read, PROJECT_PATH + '6529-frontend/rules/', rules),
              paginate(read, PROJECT_PATH + 'seize-backend/rules/'),
            ]);
            const projects = [front, back].map((value, index) => ({
              project: PROJECTS[index], inventory: inventory(value),
              rules: value.items.map(item => rule(item, apps, installations)),
            }));
            return {
              readComplete: [apps, installations, front, back].every(value => value.complete) &&
                projects.every(value => value.rules.every(item => item.nestedProjectionComplete)),
              collectorPinsConfigured: Object.keys(COLLECTORS),
              customIntegrations: { inventory: inventory(apps), items: apps.items.map(app => integration(app, installations)) },
              installations: inventory(installations), projects,
              eventForwardingVerified: false, providerSettingsChanged: false,
              limitations: [
                'Legacy issue-rule representation only; newer workflow conditions or actions may be omitted.',
                'Only organization-created custom apps are projected; unsupported or installed third-party targets remain unknown.',
                'Rule snooze reflects the audit identity and does not prove global notification state.',
                'Destination equality does not verify signing headers, component settings, transport or event delivery.',
                'Only production has a trusted collector pin; other environments are not verified.',
                'Missing fields and unsupported parameters remain unknown; no arbitrary provider text is emitted.',
              ],
            };
          }
          async function main() {
            const token = process.env.SENTRY_AUTH_TOKEN;
            if (!token) {
              console.error('Sentry monitoring audit: no configured token.');
              process.exitCode = 1;
              return;
            }
            const read = reader(token);
            const [identityResult, project, projects, uptime, crons, rules, integrations] = await Promise.all([
              read(''), read(PROJECT_PATH + '6529-frontend/'),
              read(ORG_PATH + 'projects/'), read(ORG_PATH + 'uptime/'),
              read(ORG_PATH + 'monitors/'), read(PROJECT_PATH + '6529-frontend/rules/'),
              read(ORG_PATH + 'sentry-apps/'),
            ]);
            const scopes = Array.isArray(identityResult.data?.auth?.scopes) ? identityResult.data.auth.scopes : [];
            const permitted = new Set(scopes.filter(value => typeof value === 'string'));
            const requiredReads = { authentication: identityResult.status, project: project.status,
              projectInventory: projects.status, alertRules: rules.status, customIntegrations: integrations.status };
            const unavailableRequiredReads = Object.entries(requiredReads).filter(([, status]) => status !== 200).map(([name]) => name);
            const readAccessVerified = unavailableRequiredReads.length === 0;
            const config = readAccessVerified ? await configuration(read, rules, integrations) : null;
            const summary = {
              readAccessVerified, unavailableRequiredReads,
              authenticationStatus: identityResult.status,
              scopeMetadataAvailable: Array.isArray(identityResult.data?.auth?.scopes),
              projectStatus: project.status, projectsStatus: projects.status,
              projects: Array.isArray(projects.data) ? PROJECTS.map(slug => ({
                slug, presentOnFirstPage: projects.data.some(item => item?.slug === slug),
              })) : [],
              hasAlertWriteScope: permitted.has('alerts:write'), hasLegacyOrgWriteScope: permitted.has('org:write'),
              hasProjectReadScope: permitted.has('project:read'), hasOrgReadScope: permitted.has('org:read'),
              uptimeStatus: uptime.status, uptimeMonitorsOnFirstPage: Array.isArray(uptime.data) ? uptime.data.length : null,
              cronStatus: crons.status, cronMonitorsOnFirstPage: Array.isArray(crons.data) ? crons.data.length : null,
              rulesStatus: rules.status, projectRulesOnFirstPage: Array.isArray(rules.data) ? rules.data.length : null,
              integrationsStatus: integrations.status, customIntegrationsOnFirstPage: Array.isArray(integrations.data) ? integrations.data.length : null,
              configuration: config,
            };
            const output = JSON.stringify(summary, null, 2);
            if (Buffer.byteLength(output) > LIMITS.bytes) throw new Error('OUTPUT_LIMIT');
            console.log(output);
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryPath) throw new Error('SUMMARY_PATH_UNAVAILABLE');
            const fence = String.fromCharCode(96).repeat(3);
            appendFileSync(summaryPath, '## Sentry monitoring access and configuration\n\nSuccess requires the original capability reads and complete bounded configuration inventories. Uptime and cron access are optional. Unknown rule semantics and destination matches do not prove event forwarding. No provider settings changed.\n\n' + fence + 'json\n' + output + '\n' + fence + '\n');
            if (!readAccessVerified || !config?.readComplete) process.exitCode = 1;
          }
          main().catch(() => {
            console.error('Sentry monitoring audit failed; sensitive diagnostic details suppressed.');
            process.exitCode = 1;
          });
          NODE
