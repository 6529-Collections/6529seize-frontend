            if (typeof value !== 'string' || value.length > 2048) return result;
            try {
              const url = new URL(value);
              result.queryPresent = Boolean(url.search); result.fragmentPresent = Boolean(url.hash);
              if (url.protocol !== 'https:' || url.username || url.password || url.port) return result;
              result.fingerprint = hash(url.origin + url.pathname + url.search + url.hash);
              if (destination(value) === 'prod') result.kind = 'production_collector';
