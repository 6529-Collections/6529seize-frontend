            if (typeof schema === 'string' && schema.length <= 8192) {
              try { schema = JSON.parse(schema); } catch { return null; }
            }
            if (!record(schema) || !Array.isArray(schema.elements)) return null;
            return { count: schema.elements.length, complete: schema.elements.length <= LIMITS.nested,
              items: schema.elements.slice(0, LIMITS.nested).map(element => ({
                type: choice(element?.type, ['alert-rule-action', 'issue-link', 'stacktrace-link']),
                actionUriPresent: typeof element?.uri === 'string' && element.uri.length > 0,
                settingsUriPresent: typeof element?.settings?.uri === 'string' && element.settings.uri.length > 0,
              })) };
          }
          function destinationEvidence(value) {
