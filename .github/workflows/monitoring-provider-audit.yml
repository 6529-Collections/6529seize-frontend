              publicationStatus: choice(app.status, ['internal', 'published', 'unpublished']),
              verifyInstall: boolean(app.verifyInstall),
              installationCount: uuid === null ? null : matches.length,
              installationInventoryComplete: installations.complete,
              installationStates: states,
              destinationMatch: destination(app.webhookUrl),
              destination: destinationEvidence(app.webhookUrl),
              schemaPresent: record(app.schema) || (typeof app.schema === 'string' && app.schema.length > 0),
              schemaElements: schemaEvidence(app.schema),
              schemaFingerprint: fingerprint(app.schema),
              eventSubscriptions: eventProjection(app.events),
              configurationFingerprint: fingerprint({ isDisabled: app.isDisabled ?? null, isAlertable: app.isAlertable ?? null,
                webhookUrl: app.webhookUrl ?? null, webhookEvents: app.webhookEvents ?? null, schema: app.schema ?? null }),
              webhookEvents: events === null ? null : {
