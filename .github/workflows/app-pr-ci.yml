name: App PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan risk and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_sha: ${{ github.event.pull_request.base.sha }}
      risk_floor: ${{ steps.plan_outputs.outputs.risk_floor }}
      install_required: ${{ steps.plan_outputs.outputs.install_required }}
      lint_changed_required: ${{ steps.plan_outputs.outputs.lint_changed_required }}
      typecheck_changed_required: ${{ steps.plan_outputs.outputs.typecheck_changed_required }}
      test_typecheck_required: ${{ steps.plan_outputs.outputs.test_typecheck_required }}
      jest_changed_required: ${{ steps.plan_outputs.outputs.jest_changed_required }}
      build_required: ${{ steps.plan_outputs.outputs.build_required }}
      playwright_smoke_required: ${{ steps.plan_outputs.outputs.playwright_smoke_required }}
      playwright_critical_shell_required: ${{ steps.plan_outputs.outputs.playwright_critical_shell_required }}
      playwright_museum_required: ${{ steps.plan_outputs.outputs.playwright_museum_required }}
      deployment_contract_required: ${{ steps.plan_outputs.outputs.deployment_contract_required }}
      dependency_governance_required: ${{ steps.plan_outputs.outputs.dependency_governance_required }}
      reviewbot_contract_required: ${{ steps.plan_outputs.outputs.reviewbot_contract_required }}
      agent_files_sync_required: ${{ steps.plan_outputs.outputs.agent_files_sync_required }}
      app_check_matrix: ${{ steps.plan_outputs.outputs.app_check_matrix }}
      core_playwright_required: ${{ steps.plan_outputs.outputs.core_playwright_required }}
      core_playwright_matrix: ${{ steps.plan_outputs.outputs.core_playwright_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Preserve complete history for the risk plan without transferring
          # blobs that are reachable only from unrelated refs.
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "$BASE_SHA"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Create CI plan and security reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UNTRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          ./bin/6529 run testing-strategy -- ci-plan \
            --changed-from "$BASE_SHA" \
            --untrusted-pr="${UNTRUSTED_PR}" \
            --output test-results/app-pr-ci/ci-plan.json
          ./bin/6529 exec node scripts/app-pr-ci-effective-plan.cjs \
            --plan test-results/app-pr-ci/ci-plan.json
          ./bin/6529 run testing-strategy -- scan-changed-secrets \
            --changed-from "$BASE_SHA" \
            --output test-results/app-pr-ci/secret-scan.json
          ./bin/6529 run testing-strategy -- validate-workflow-security \
            --changed-from "$BASE_SHA" \
            --output test-results/app-pr-ci/workflow-security.json

      - name: Apply protected Museum browser-lane floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          control_sha="$(git rev-parse "${BASE_SHA}^{commit}")"
          test "$control_sha" = "$BASE_SHA"
          [[ "$control_sha" =~ ^[a-f0-9]{40}$ ]]
          control_dir="$RUNNER_TEMP/museum-plan-control"
          mkdir -p "$control_dir"
          git show "$control_sha:scripts/museum-release-tier.cjs" \
            > "$control_dir/museum-release-tier.cjs"
          test -s "$control_dir/museum-release-tier.cjs"

          BASE_SHA="$BASE_SHA" \
            CONTROL_SHA="$control_sha" \
            TIER_TOOL="$control_dir/museum-release-tier.cjs" \
            node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const planPath = "test-results/app-pr-ci/ci-plan.json";
          const plan = JSON.parse(fs.readFileSync(planPath, "utf8"));
          let requiresMuseumLane = true;
          let reason = "Protected Museum policy could not classify the PR range.";
          try {
            const tier = require(process.env.TIER_TOOL);
            const files = execFileSync(
              "git",
              [
                "diff",
                "--name-only",
                "-z",
                process.env.BASE_SHA,
                "HEAD",
                "--",
              ],
              { encoding: "buffer" }
            )
              .toString("utf8")
              .split("\0")
              .filter(Boolean);
            requiresMuseumLane = files.some(
              (file) => tier.isMuseumPath(file) || tier.isPolicyPath(file)
            );
            reason = requiresMuseumLane
              ? `Protected Museum policy ${process.env.CONTROL_SHA} requires the broad browser lane.`
              : "Protected Museum policy found no Museum-owned or Museum-policy path."
          } catch {
            requiresMuseumLane = true;
          }
          if (requiresMuseumLane) {
            plan.checks.install = {
              required: true,
              reason: "Museum browser qualification requires installation.",
            };
            plan.checks.playwright_museum = { required: true, reason };
          }
          fs.writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Publish CI plan outputs
        id: plan_outputs
        env:
          DEFAULT_CI_RUNNER: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
          BUILD_CI_RUNNER: ${{ vars.CI_BUILD_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const plan = JSON.parse(fs.readFileSync("test-results/app-pr-ci/ci-plan.json", "utf8"));
          const output = process.env.GITHUB_OUTPUT;
          const write = (key, value) => {
            fs.appendFileSync(output, `${key}=${value}\n`);
          };
          const runner = (value, label) => {
            if (!/^[A-Za-z0-9._-]{1,100}$/.test(value || "")) {
              throw new Error(`${label} is not a valid GitHub runner label.`);
            }
            return value;
          };
          const defaultRunner = runner(process.env.DEFAULT_CI_RUNNER, "DEFAULT_CI_RUNNER");
          const buildRunner = runner(process.env.BUILD_CI_RUNNER, "BUILD_CI_RUNNER");
          write("risk_floor", plan.risk.computed_floor);
          for (const [name, check] of Object.entries(plan.checks)) {
            write(`${name}_required`, String(Boolean(check.required)));
          }
          const appCheckLanes = [
            { lane: "quality", label: "Quality and contracts", runner: defaultRunner },
          ];
          const corePlaywrightLanes = [];
          if (plan.checks.build.required) {
            appCheckLanes.push({ lane: "build", label: "Production build", runner: buildRunner });
          }
          if (plan.checks.playwright_smoke.required) {
            corePlaywrightLanes.push({ lane: "playwright-smoke", label: "Playwright smoke", runner: defaultRunner });
          }
          if (plan.checks.playwright_critical_shell.required) {
            corePlaywrightLanes.push({
              lane: "playwright-critical-shell",
              label: "Playwright critical shell",
              runner: defaultRunner,
            });
          }
          if (plan.checks.playwright_museum.required) {
            appCheckLanes.push(
              {
                lane: "playwright-museum-desktop",
                label: "Network Museum desktop",
                museum_project: "web-desktop-chromium",
                runner: defaultRunner,
              },
              {
                lane: "playwright-museum-mobile",
                label: "Network Museum mobile",
                museum_project: "web-mobile-chromium",
                runner: defaultRunner,
              }
            );
          }
          write("app_check_matrix", JSON.stringify({ include: appCheckLanes }));
          write("core_playwright_required", String(corePlaywrightLanes.length > 0));
          write("core_playwright_matrix", JSON.stringify({ include: corePlaywrightLanes }));
          NODE

      - name: Summarize CI plan
        if: always()
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const requiredFiles = [
            "test-results/app-pr-ci/ci-plan.json",
            "test-results/app-pr-ci/secret-scan.json",
            "test-results/app-pr-ci/workflow-security.json",
          ];
          const missing = requiredFiles.filter((file) => !fs.existsSync(file));
          if (missing.length > 0) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## App PR CI Plan\n\nPlan reports were not created:\n${missing
                .map((file) => `- ${file}`)
                .join("\n")}\n`
            );
            process.exit(0);
          }
          const plan = JSON.parse(fs.readFileSync(requiredFiles[0], "utf8"));
          const secretScan = JSON.parse(fs.readFileSync(requiredFiles[1], "utf8"));
          const workflowSecurity = JSON.parse(fs.readFileSync(requiredFiles[2], "utf8"));
          const lines = [
            "## App PR CI Plan",
            "",
            `Risk floor: level-${plan.risk.computed_floor}`,
            `Changed files: ${plan.changed_files.length}`,
            `Untrusted PR: ${plan.untrusted_pr ? "yes" : "no"}`,
            "",
            "### Required Checks",
            ...Object.entries(plan.checks).map(
              ([name, check]) => `- ${name}: ${check.required ? "required" : "skipped"}`
            ),
            "",
            `Secret scan findings: ${secretScan.findings.length}`,
            `Workflow security findings: ${workflowSecurity.findings.length}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Upload CI plan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-pr-ci-plan-${{ github.event.pull_request.number || github.run_id }}
          path: |
            test-results/app-pr-ci/ci-plan.json
            test-results/app-pr-ci/secret-scan.json
            test-results/app-pr-ci/workflow-security.json
          if-no-files-found: ignore
          retention-days: 14

  core-playwright-checks:
    name: App check / ${{ matrix.label }}
    needs: plan
    if: >-
      needs.plan.outputs.core_playwright_required == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      packages: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.core_playwright_matrix) }}

    env:
      API_ENDPOINT: "https://api.6529.io"
      WS_ENDPOINT: "wss://ws.6529.io"
      ALLOWLIST_API_ENDPOINT: "https://allowlist-api.6529.io"
      BASE_ENDPOINT: "http://localhost:3001"
      PLAYWRIGHT_BASE_URL: "http://localhost:3001"
      PLAYWRIGHT_WEB_SERVER_COMMAND: "./bin/6529 run dev"
      PLAYWRIGHT_WEB_SERVER_URL: "http://localhost:3001"
      NEXTGEN_CHAIN_ID: "1"
      MOBILE_APP_SCHEME: "mobile6529"
      CORE_SCHEME: "core6529"
      IPFS_API_ENDPOINT: "https://api-ipfs.6529.io"
      IPFS_GATEWAY_ENDPOINT: "https://ipfs.6529.io"
      GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
      ASSETS_FROM_S3: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Install Socket Firewall
        id: socket_firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        run: ./bin/6529 guard:no-package-lock

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Run small Playwright smoke pack
        if: matrix.lane == 'playwright-smoke'
        env:
          NEXT_DEV_DIST_DIR: ".next-playwright-smoke"
          PLAYWRIGHT_READONLY: "1"
        run: ./bin/6529 run test:e2e:smoke

      - name: Run critical route-shell Playwright pack
        if: matrix.lane == 'playwright-critical-shell'
        env:
          NEXT_DEV_DIST_DIR: ".next-playwright-critical-shell"
          PLAYWRIGHT_READONLY: "1"
        run: ./bin/6529 run test:e2e:critical-shell

      - name: Upload app check artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-pr-ci-results-${{ matrix.lane }}-${{ github.event.pull_request.number || github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  app-checks:
    name: App check / ${{ matrix.label }}
    needs: plan
    if: >-
      needs.plan.outputs.install_required == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      packages: read
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.app_check_matrix) }}

    env:
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      API_ENDPOINT: "https://api.6529.io"
      WS_ENDPOINT: "wss://ws.6529.io"
      ALLOWLIST_API_ENDPOINT: "https://allowlist-api.6529.io"
      BASE_ENDPOINT: "http://localhost:3001"
      PLAYWRIGHT_BASE_URL: "http://localhost:3001"
      PLAYWRIGHT_WEB_SERVER_COMMAND: "./bin/6529 run dev"
      PLAYWRIGHT_WEB_SERVER_URL: "http://localhost:3001"
      NEXTGEN_CHAIN_ID: "1"
      MOBILE_APP_SCHEME: "mobile6529"
      CORE_SCHEME: "core6529"
      IPFS_API_ENDPOINT: "https://api-ipfs.6529.io"
      IPFS_GATEWAY_ENDPOINT: "https://ipfs.6529.io"
      GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
      ASSETS_FROM_S3: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The reviewed tree is materialized during checkout; historical
          # blobs from unrelated refs are not needed by the installed gates.
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base commit
        if: matrix.lane == 'quality' || startsWith(matrix.lane, 'playwright-museum-')
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "$BASE_SHA"

      - name: Stage protected Museum tier policy
        if: matrix.lane == 'quality' || startsWith(matrix.lane, 'playwright-museum-')
        run: |
          set -euo pipefail
          control_sha="$(git rev-parse "${BASE_SHA}^{commit}")"
          test "$control_sha" = "$BASE_SHA"
          [[ "$control_sha" =~ ^[a-f0-9]{40}$ ]]
          # The protected classifier resolves the repository root relative to
          # its own location. Keep the immutable copy one level below the
          # checked-out workspace so Git reads remain bound to this merge tree.
          control_dir="$GITHUB_WORKSPACE/.museum-release-tier-control"
          printf '/.museum-release-tier-control/\n' >> "$GITHUB_WORKSPACE/.git/info/exclude"
          mkdir -p "$control_dir"
          git show "$control_sha:scripts/museum-release-tier.cjs" \
            > "$control_dir/museum-release-tier.cjs"
          test -s "$control_dir/museum-release-tier.cjs"

          selection_available=false
          if git cat-file -e "$control_sha:scripts/museum-release-selection.cjs"; then
            git show "$control_sha:scripts/museum-release-selection.cjs" \
              > "$control_dir/museum-release-selection.cjs"
            test -s "$control_dir/museum-release-selection.cjs"
            selection_available=true
          fi

          {
            echo "MUSEUM_RELEASE_TIER_TOOL=$control_dir/museum-release-tier.cjs"
            echo "MUSEUM_RELEASE_SELECTION_TOOL=$control_dir/museum-release-selection.cjs"
            echo "MUSEUM_RELEASE_SELECTION_CONTROL_AVAILABLE=$selection_available"
            echo "MUSEUM_RELEASE_SELECTION_CONTROL_SHA=$control_sha"
          } >> "$GITHUB_ENV"
          git branch --force main "$BASE_SHA"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Install Socket Firewall
        id: socket_firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        run: ./bin/6529 guard:no-package-lock

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Run Knip dead-code check
        if: matrix.lane == 'quality'
        run: ./bin/6529 run deadcode:knip

      - name: Lint package.json versions
        if: matrix.lane == 'quality' && needs.plan.outputs.dependency_governance_required == 'true'
        run: ./bin/6529 lint:package-json

      - name: Classify dependency risk
        if: matrix.lane == 'quality' && needs.plan.outputs.dependency_governance_required == 'true'
        env:
          DEPENDENCY_RISK_BASE_REF: ${{ needs.plan.outputs.base_sha }}
        run: ./bin/6529 run dependency:risk-gate

      - name: Verify reviewbot contract
        if: matrix.lane == 'quality' && needs.plan.outputs.reviewbot_contract_required == 'true'
        run: ./bin/6529 run test:no-coverage -- __tests__/scripts/testing-strategy.test.ts

      # jest --findRelatedTests follows the module import graph, so it cannot
      # see this suite's fs reads of the help corpus and committed artifacts.
      # The plan requests it by path whenever those files change.
      - name: Verify agent files sync
        if: matrix.lane == 'quality' && needs.plan.outputs.agent_files_sync_required == 'true'
        run: ./bin/6529 run test:no-coverage -- __tests__/scripts/sync-agent-files.test.ts

      - name: Verify frontend deployment workflow contracts
        if: matrix.lane == 'quality' && needs.plan.outputs.deployment_contract_required == 'true'
        run: |
          set -euo pipefail
          ./bin/6529 run test:no-coverage --runInBand --runTestsByPath \
            __tests__/scripts/app-pr-ci-effective-plan.test.ts \
            __tests__/scripts/ci-wave-web-validation.test.ts \
            __tests__/scripts/deploy-staging-artifact.test.ts \
            __tests__/scripts/e2e-packs.test.ts \
            __tests__/scripts/frontend-deployment-workflows.test.ts \
            __tests__/scripts/museum-release-tier.test.ts \
            __tests__/scripts/museum-surface-registry.test.ts \
            __tests__/scripts/package-public-review-artifacts.test.ts \
            __tests__/scripts/production-build-artifact.test.ts \
            __tests__/scripts/production-artifact-metadata.test.ts \
            __tests__/scripts/production-artifact-verifier.test.ts \
            __tests__/scripts/deployment-e2e-workflows.test.ts \
            __tests__/scripts/public-review-artifact-workflows.test.ts \
            __tests__/scripts/sync-e2e-manifest.test.ts

      - name: Lint changed source
        if: matrix.lane == 'quality' && needs.plan.outputs.lint_changed_required == 'true'
        run: ./bin/6529 run lint:changed

      - name: Typecheck changed source
        if: matrix.lane == 'quality' && needs.plan.outputs.typecheck_changed_required == 'true'
        run: ./bin/6529 run typecheck:changed

      - name: Typecheck Jest, Playwright, and test helpers
        if: matrix.lane == 'quality' && needs.plan.outputs.test_typecheck_required == 'true'
        run: ./bin/6529 run typecheck:tests

      - name: Run related Jest tests
        if: matrix.lane == 'quality' && needs.plan.outputs.jest_changed_required == 'true'
        run: |
          set -euo pipefail

          mapfile -d '' changed_files < <(
            git diff --name-only -z --diff-filter=ACMRD "${BASE_SHA}...HEAD" -- \
              "*.js" "*.jsx" "*.cjs" "*.mjs" "*.ts" "*.tsx" ":(exclude)generated/**"
          )
          existing_files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              existing_files+=("$file")
            fi
          done

          if [ "${#existing_files[@]}" -eq 0 ]; then
            echo "No existing source or test files need related Jest coverage."
            exit 0
          fi

          jest_test_files=()
          related_source_files=()
          i18n_messages_test_required=false
          for file in "${existing_files[@]}"; do
            case "$file" in
              tests/*.spec.ts|tests/*.spec.tsx|tests/**/*.spec.ts|tests/**/*.spec.tsx)
                echo "Skipping Playwright spec for related Jest coverage: $file"
                ;;
              *.test.ts|*.test.tsx)
                jest_test_files+=("$file")
                ;;
              *.spec.ts|*.spec.tsx)
                echo "Skipping non-Jest spec for related Jest coverage: $file"
                ;;
              i18n/messages.ts|i18n/messages/*.ts)
                i18n_messages_test_required=true
                ;;
              *)
                related_source_files+=("$file")
                ;;
            esac
          done

          if [ "$i18n_messages_test_required" = true ] && [ -f "__tests__/i18n/messages.test.ts" ]; then
            jest_test_files+=("__tests__/i18n/messages.test.ts")
          fi

          run_jest_with_timeout() {
            local timeout_seconds="$1"
            local label="$2"
            shift 2

            set +e
            NODE_ENV=test timeout "${timeout_seconds}s" ./bin/6529 exec jest --silent --verbose=false --coverage=false --runInBand --forceExit --passWithNoTests "$@"
            local status=$?
            set -e

            if [ "$status" -eq 124 ]; then
              echo "::error::${label} timed out after ${timeout_seconds}s"
            fi

            return "$status"
          }

          run_related_jest_with_timeout() {
            local list_timeout_seconds="$1"
            local chunk_timeout_seconds="$2"
            shift 2

            local related_tests_file
            related_tests_file="$(mktemp)"

            set +e
            NODE_ENV=test timeout "${list_timeout_seconds}s" ./bin/6529 exec jest --listTests --findRelatedTests "$@" > "${related_tests_file}"
            local list_status=$?
            set -e

            if [ "$list_status" -eq 124 ]; then
              echo "::error::Related Jest test discovery timed out after ${list_timeout_seconds}s"
            fi

            if [ "$list_status" -ne 0 ]; then
              rm -f "${related_tests_file}"
              return "$list_status"
            fi

            mapfile -t related_jest_tests < "${related_tests_file}"
            rm -f "${related_tests_file}"

            valid_related_tests=()
            for related_test in "${related_jest_tests[@]}"; do
              if [ -z "$related_test" ]; then
                continue
              fi
              if [ ! -f "$related_test" ]; then
                echo "Skipping non-file Jest discovery output: $related_test"
                continue
              fi
              valid_related_tests+=("$related_test")
            done
            related_jest_tests=("${valid_related_tests[@]}")

            if [ "${#jest_test_files[@]}" -gt 0 ]; then
              declare -A direct_jest_paths=()
              for test_file in "${jest_test_files[@]}"; do
                direct_jest_paths["$(realpath "$test_file")"]=1
              done
              filtered_related_tests=()
              for related_test in "${related_jest_tests[@]}"; do
                related_path="$(realpath "$related_test")"
                if [ -n "${direct_jest_paths[$related_path]:-}" ]; then
                  echo "Skipping related Jest duplicate already selected directly: $related_test"
                else
                  filtered_related_tests+=("$related_test")
                fi
              done
              related_jest_tests=("${filtered_related_tests[@]}")
            fi

            if [ "${#related_jest_tests[@]}" -eq 0 ]; then
              echo "No related Jest tests found."
              return 0
            fi

            local chunk_size=40
            local chunk_number=1
            for ((offset = 0; offset < ${#related_jest_tests[@]}; offset += chunk_size)); do
              local chunk=("${related_jest_tests[@]:offset:chunk_size}")
              run_jest_with_timeout "${chunk_timeout_seconds}" "Related Jest tests chunk ${chunk_number}" --runTestsByPath "${chunk[@]}"
              chunk_number=$((chunk_number + 1))
            done
          }

          if [ "${#jest_test_files[@]}" -gt 0 ]; then
            run_jest_with_timeout 180 "Direct Jest tests" "${jest_test_files[@]}"
          fi

          if [ "${#related_source_files[@]}" -gt 0 ]; then
            run_related_jest_with_timeout 180 240 "${related_source_files[@]}"
          fi

          if [ "${#jest_test_files[@]}" -eq 0 ] && [ "${#related_source_files[@]}" -eq 0 ]; then
            echo "No Jest-related source or test files need coverage."
          fi

      - name: Classify Museum release tier and durable selection input
        if: matrix.lane == 'quality'
        env:
          GH_TOKEN: ${{ github.token }}
          MUSEUM_RELEASE_TIER_MODE: ${{ vars.MUSEUM_RELEASE_TIER_MODE }}
        run: |
          set -euo pipefail
          hold_state="clear"
          mapfile -t museum_refs < <(
            git ls-remote --refs \
              https://github.com/6529-Collections/6529networkmuseum.git \
              refs/heads/main
          )
          test "${#museum_refs[@]}" -eq 1
          read -r source_commit source_ref source_extra <<< "${museum_refs[0]}"
          test -z "${source_extra:-}"
          test "$source_ref" = "refs/heads/main"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
            node "$MUSEUM_RELEASE_TIER_TOOL" \
            --base "$BASE_SHA" \
            --head HEAD \
            --output test-results/app-pr-ci/museum-release-classification.json
          if [ "$MUSEUM_RELEASE_SELECTION_CONTROL_AVAILABLE" = true ]; then
            NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
              node "$MUSEUM_RELEASE_SELECTION_TOOL" \
                --base "$BASE_SHA" \
                --head HEAD \
                --environment pr \
                --activation-mode "$MUSEUM_RELEASE_TIER_MODE" \
                --hold-state "$hold_state" \
                --source-commit "$source_commit" \
                --output test-results/app-pr-ci/museum-release-selection.json
          else
            CLASSIFICATION_OUTPUT=test-results/app-pr-ci/museum-release-classification.json \
              SELECTION_OUTPUT=test-results/app-pr-ci/museum-release-selection.json \
              HOLD_STATE="$hold_state" \
              ACTIVATION_MODE="$MUSEUM_RELEASE_TIER_MODE" \
              SOURCE_COMMIT="$source_commit" \
              node <<'NODE'
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const classification = JSON.parse(
              fs.readFileSync(process.env.CLASSIFICATION_OUTPUT, "utf8")
            );
            const output = {
              activation: {
                effective_mode: "full",
                hold_state: process.env.HOLD_STATE,
                requested_mode: process.env.ACTIVATION_MODE,
                reason: `Protected policy ${process.env.MUSEUM_RELEASE_SELECTION_CONTROL_SHA} does not yet contain museum-release-selection-v1.`,
              },
              browser_scope: "all-museum-packs",
              classification,
              contract: "museum-release-selection-v1",
              environment: "pr",
              selected_packs: [
                "test:e2e:museum-data-architecture",
                "test:e2e:museum-institutional-practice",
                "test:e2e:museum-about",
                "test:e2e:museum-inside-system",
                "test:e2e:museum-rights",
              ],
              source_commit: process.env.SOURCE_COMMIT,
              static_contracts: [
                "__tests__/lib/museum/publication/corpusContracts.test.ts",
              ],
              static_scope: "full",
            };
            output.selection_digest = crypto
              .createHash("sha256")
              .update(JSON.stringify(output))
              .digest("hex");
            fs.writeFileSync(
              process.env.SELECTION_OUTPUT,
              `${JSON.stringify(output, null, 2)}\n`
            );
          NODE
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(
            fs.readFileSync(
              "test-results/app-pr-ci/museum-release-classification.json",
              "utf8"
            )
          );
          if (
            !Array.isArray(report.affected_surfaces) ||
            typeof report.mode !== "string" ||
            typeof report.tier !== "string" ||
            typeof report.reason !== "string" ||
            !/^[a-f0-9]{64}$/.test(report.classification_digest)
          ) {
            throw new Error("Museum release classification report is malformed.");
          }
          const lines = [
            "## Museum release classification",
            "",
            `Mode: ${report.mode}`,
            `Tier: ${report.tier}`,
            `Affected surfaces: ${report.affected_surfaces.join(", ") || "none"}`,
            `Reason: ${report.reason}`,
            `Classification digest: \`${report.classification_digest}\``,
          ];
          const selection = JSON.parse(
            fs.readFileSync(
              "test-results/app-pr-ci/museum-release-selection.json",
              "utf8"
            )
          );
          lines.push(
            `Selection activation: ${selection.activation.effective_mode}`,
            `Selection hold: ${selection.activation.hold_state}`,
            `Selected packs: ${selection.selected_packs.join(", ") || "none"}`,
            `Selection digest: \`${selection.selection_digest}\``
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Verify Museum surface registry and source-shell corpus
        if: startsWith(matrix.lane, 'playwright-museum-')
        run: |
          set -euo pipefail
          mkdir -p test-results/app-pr-ci/museum-surface-registry
          base_sha="$(git rev-parse --verify "${BASE_SHA}^{commit}")"
          test "$base_sha" = "$BASE_SHA"
          head_sha="$(git rev-parse --verify "HEAD^{commit}")"
          ./bin/6529 run museum:surface-registry -- \
            --changed-from "$base_sha" \
            --changed-to "$head_sha" \
            --output test-results/app-pr-ci/museum-surface-registry/registry.json
          ./bin/6529 run test:no-coverage --runInBand --runTestsByPath \
            __tests__/lib/museum/publication/corpusContracts.test.ts
          {
            echo "## Museum surface registry and source-shell corpus"
            echo
            echo "Registry and corpus sentinel passed before route-browser qualification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Next.js build cache
        id: nextjs_build_cache
        if: matrix.lane == 'build'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-node22-pr-production-nextjs-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig*.json', 'postcss.config.*', 'tailwind.config.*') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-pr-production-nextjs-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig*.json', 'postcss.config.*', 'tailwind.config.*') }}-
            ${{ runner.os }}-node22-pr-production-nextjs-

      - name: Build production profile
        if: matrix.lane == 'build'
        env:
          NODE_ENV: "production"
          BASE_ENDPOINT: "https://6529.io"
        # The CI build runs the generators explicitly without repeating the
        # full-repository lint already covered by changed-file lint.
        run: |
          set -euo pipefail
          ./bin/6529 run build:ci

      - name: Create exact PR merge-tree CI evidence
        if: matrix.lane == 'quality'
        env:
          EXPECTED_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          BUILD_REQUIRED: ${{ needs.plan.outputs.build_required }}
          DEPLOYMENT_CONTRACT_REQUIRED: ${{ needs.plan.outputs.deployment_contract_required }}
          TEST_TYPECHECK_REQUIRED: ${{ needs.plan.outputs.test_typecheck_required }}
          MUSEUM_BROWSER_REQUIRED: ${{ needs.plan.outputs.playwright_museum_required }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BUILD_REQUIRED" =~ ^(true|false)$ ]]
          [[ "$DEPLOYMENT_CONTRACT_REQUIRED" =~ ^(true|false)$ ]]
          [[ "$TEST_TYPECHECK_REQUIRED" =~ ^(true|false)$ ]]
          [[ "$MUSEUM_BROWSER_REQUIRED" =~ ^(true|false)$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          rm -rf exact-pr-ci-evidence
          mkdir -p exact-pr-ci-evidence
          jq -e --arg base_sha "$EXPECTED_BASE_SHA" --arg head_sha "$EXPECTED_MERGE_SHA" '
            .contract == "museum-release-selection-v1" and
            .environment == "pr" and
            (.classification.tier | IN("NONE", "P0", "P1", "P2", "P3")) and
            .classification.base_sha == $base_sha and
            .classification.head_sha == $head_sha and
            (.activation.effective_mode | IN("tiered", "full")) and
            (.selected_packs | type == "array") and
            (.source_commit | test("^[a-f0-9]{40}$")) and
            (.selection_digest | test("^[a-f0-9]{64}$"))
          ' test-results/app-pr-ci/museum-release-selection.json >/dev/null
          selection_verifier="$MUSEUM_RELEASE_SELECTION_TOOL"
          if [ "$MUSEUM_RELEASE_SELECTION_CONTROL_AVAILABLE" != true ]; then
            selection_verifier="$GITHUB_WORKSPACE/scripts/museum-release-selection.cjs"
          fi
          NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
            SELECTION_VERIFIER="$selection_verifier" \
            ./bin/6529 exec node - <<'NODE'
          const fs = require("node:fs");
          const { verifySelectionDigest } = require(process.env.SELECTION_VERIFIER);
          const selection = JSON.parse(
            fs.readFileSync("test-results/app-pr-ci/museum-release-selection.json", "utf8")
          );
          if (!verifySelectionDigest(selection)) {
            throw new Error("Museum PR selection digest verification failed.");
          }
          NODE
          jq -n \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg merge_sha "$EXPECTED_MERGE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --argjson build_required "$BUILD_REQUIRED" \
            --argjson deployment_contract_required "$DEPLOYMENT_CONTRACT_REQUIRED" \
            --argjson test_typecheck_required "$TEST_TYPECHECK_REQUIRED" \
            --argjson museum_browser_required "$MUSEUM_BROWSER_REQUIRED" \
            --slurpfile museum_release_selection test-results/app-pr-ci/museum-release-selection.json \
            '{
              schema_version:1,
              evidence_contract:"exact-merge-tree-pr-ci-v1",
              repository:"frontend",
              event:"pull_request",
              workflow:".github/workflows/app-pr-ci.yml",
              base_sha:$base_sha,
              merge_sha:$merge_sha,
              head_sha:$head_sha,
              production_build_required:$build_required,
              dependency_analysis_required:true,
              deployment_contract_required:$deployment_contract_required,
              test_typecheck_required:$test_typecheck_required,
              museum_browser_required:$museum_browser_required,
              museum_source_commit:$museum_release_selection[0].source_commit,
              museum_release_selection_digest:$museum_release_selection[0].selection_digest,
              museum_release_selection:$museum_release_selection[0],
              required_gates:([
                "package-manager-discipline",
                "dependency-analysis",
                "reviewbot-contract",
                "generated-agent-files",
                "deployment-workflow-contract-or-plan-not-required",
                "changed-lint",
                "changed-typecheck",
                "test-typecheck-or-plan-not-required",
                "related-jest-selection",
                "production-build-or-plan-not-required",
                "museum-release-selection"
              ] + (if $museum_browser_required then ["museum-browser-qualification"] else [] end))
            }' > exact-pr-ci-evidence/manifest.json
          (cd exact-pr-ci-evidence && \
            sha256sum ./manifest.json > SHA256SUMS)

      - name: Upload exact PR merge-tree CI evidence
        if: matrix.lane == 'quality'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-pr-ci-${{ github.sha }}
          path: exact-pr-ci-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Save Next.js build cache
        if: matrix.lane == 'build' && steps.nextjs_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ steps.nextjs_build_cache.outputs.cache-primary-key }}

      - name: Restore Playwright browser
        if: startsWith(matrix.lane, 'playwright-museum-')
        id: playwright_browser_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-node22-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright dependencies
        id: playwright_dependencies_primary
        if: startsWith(matrix.lane, 'playwright-museum-')
        timeout-minutes: 3
        continue-on-error: true
        run: ./bin/6529 exec playwright install-deps chromium

      - name: Retry Playwright dependencies
        id: playwright_dependencies_retry
        if: startsWith(matrix.lane, 'playwright-museum-') && steps.playwright_dependencies_primary.outcome != 'success'
        timeout-minutes: 3
        continue-on-error: true
        run: ./bin/6529 exec playwright install-deps chromium

      - name: Verify Playwright dependencies
        if: startsWith(matrix.lane, 'playwright-museum-')
        env:
          PRIMARY_OUTCOME: ${{ steps.playwright_dependencies_primary.outcome }}
          RETRY_OUTCOME: ${{ steps.playwright_dependencies_retry.outcome }}
        run: |
          if [ "$PRIMARY_OUTCOME" != success ] && [ "$RETRY_OUTCOME" != success ]; then
            echo "Playwright system dependency installation failed twice." >&2
            exit 1
          fi

      - name: Install Playwright browser
        if: startsWith(matrix.lane, 'playwright-museum-')
        timeout-minutes: 10
        run: ./bin/6529 exec playwright install chromium

      - name: Resolve exact Museum publication for Playwright
        id: museum_publication
        if: startsWith(matrix.lane, 'playwright-museum-')
        env:
          GH_TOKEN: ${{ github.token }}
          # Exact canonical-C qualification. The runtime resolves the pointer
          # and catalog at C, then assembles only the immutable reviewed B corpus.
          MUSEUM_PUBLICATION_TEST_CATALOG_COMMIT: "858d3ebc049b59219d6fa639dbd325b6adc7345a"
          MUSEUM_PUBLICATION_TEST_SOURCE_COMMIT: "92966f2836ebf2af06edfe0fe2cff25041307c92"
        run: |
          set -euo pipefail
          mapfile -t museum_refs < <(
            git ls-remote --refs \
              https://github.com/6529-Collections/6529networkmuseum.git \
              refs/heads/main
          )
          test "${#museum_refs[@]}" -eq 1
          read -r museum_commit museum_ref extra <<< "${museum_refs[0]}"
          test -z "${extra:-}"
          test "$museum_ref" = "refs/heads/main"
          [[ "$museum_commit" =~ ^[a-f0-9]{40}$ ]]
          catalog_commit="$MUSEUM_PUBLICATION_TEST_CATALOG_COMMIT"
          source_commit="$MUSEUM_PUBLICATION_TEST_SOURCE_COMMIT"
          [[ "$catalog_commit" =~ ^[a-f0-9]{40}$ ]]
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          gh api \
            "repos/6529-Collections/6529networkmuseum/git/commits/$catalog_commit" \
            --jq '.sha' | grep -Fx "$catalog_commit"
          gh api \
            "repos/6529-Collections/6529networkmuseum/git/commits/$source_commit" \
            --jq '.sha' | grep -Fx "$source_commit"
          echo "catalog_commit=$catalog_commit" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "Museum moving source main: $museum_commit"
          echo "Museum Playwright catalog fixture: $catalog_commit"
          echo "Museum Playwright source fixture: $source_commit"

      - name: Select fail-closed Museum qualification packs
        id: museum-selection
        if: startsWith(matrix.lane, 'playwright-museum-')
        env:
          GH_TOKEN: ${{ github.token }}
          MUSEUM_RELEASE_TIER_MODE: ${{ vars.MUSEUM_RELEASE_TIER_MODE }}
          SOURCE_COMMIT: ${{ steps.museum_publication.outputs.source_commit }}
        run: |
          set -euo pipefail
          hold_state="clear"
          if [ "$MUSEUM_RELEASE_SELECTION_CONTROL_AVAILABLE" = true ]; then
            NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
              node "$MUSEUM_RELEASE_SELECTION_TOOL" \
                --base "$BASE_SHA" \
                --head HEAD \
                --environment pr \
                --activation-mode "$MUSEUM_RELEASE_TIER_MODE" \
                --hold-state "$hold_state" \
                --source-commit "$SOURCE_COMMIT" \
                --output test-results/app-pr-ci/museum-release-selection.json
          else
            NODE_PATH="$GITHUB_WORKSPACE/node_modules${NODE_PATH:+:$NODE_PATH}" \
              node "$MUSEUM_RELEASE_TIER_TOOL" \
                --base "$BASE_SHA" \
                --head HEAD \
                --output test-results/app-pr-ci/museum-release-classification.json
            CLASSIFICATION_OUTPUT=test-results/app-pr-ci/museum-release-classification.json \
              SELECTION_OUTPUT=test-results/app-pr-ci/museum-release-selection.json \
              HOLD_STATE="$hold_state" \
              ACTIVATION_MODE="$MUSEUM_RELEASE_TIER_MODE" \
              node <<'NODE'
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const classification = JSON.parse(
              fs.readFileSync(process.env.CLASSIFICATION_OUTPUT, "utf8")
            );
            const output = {
              activation: {
                effective_mode: "full",
                hold_state: process.env.HOLD_STATE,
                requested_mode: process.env.ACTIVATION_MODE,
                reason: `Protected policy ${process.env.MUSEUM_RELEASE_SELECTION_CONTROL_SHA} does not yet contain museum-release-selection-v1.`,
              },
              browser_scope: "all-museum-packs",
              classification,
              contract: "museum-release-selection-v1",
              environment: "pr",
              selected_packs: [
                "test:e2e:museum-data-architecture",
                "test:e2e:museum-institutional-practice",
                "test:e2e:museum-about",
                "test:e2e:museum-inside-system",
                "test:e2e:museum-rights",
              ],
              source_commit: process.env.SOURCE_COMMIT,
              static_contracts: [
                "__tests__/lib/museum/publication/corpusContracts.test.ts",
              ],
              static_scope: "full",
            };
            output.selection_digest = crypto
              .createHash("sha256")
              .update(JSON.stringify(output))
              .digest("hex");
            fs.writeFileSync(
              process.env.SELECTION_OUTPUT,
              `${JSON.stringify(output, null, 2)}\n`
            );
          NODE
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const selection = JSON.parse(
            fs.readFileSync("test-results/app-pr-ci/museum-release-selection.json", "utf8")
          );
          const allowed = new Set([
            "test:e2e:museum-data-architecture",
            "test:e2e:museum-institutional-practice",
            "test:e2e:museum-about",
            "test:e2e:museum-rights",
            "test:e2e:museum-inside-system",
          ]);
          if (
            selection.contract !== "museum-release-selection-v1" ||
            selection.environment !== "pr" ||
            !["NONE", "P0", "P1", "P2", "P3"].includes(selection.classification?.tier) ||
            selection.source_commit !== process.env.SOURCE_COMMIT ||
            !Array.isArray(selection.selected_packs) ||
            selection.selected_packs.some((pack) => !allowed.has(pack))
          ) {
            throw new Error("Museum selection report is malformed.");
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Museum qualification selection",
              "",
              `Tier: ${selection.classification.tier}`,
              `Activation: ${selection.activation.effective_mode}`,
              `Hold: ${selection.activation.hold_state}`,
              `Browser scope: ${selection.browser_scope}`,
              `Packs: ${selection.selected_packs.join(", ") || "none"}`,
              `Selection digest: \`${selection.selection_digest}\``,
              "",
            ].join("\n")
          );
          NODE

      - name: Run Network Museum Playwright packs
        if: startsWith(matrix.lane, 'playwright-museum-')
        env:
          MUSEUM_PROJECT: ${{ matrix.museum_project }}
          NODE_ENV: "development"
          PLAYWRIGHT_READONLY: "1"
          MUSEUM_PUBLICATION_EXPECTED_COMMIT: ${{ steps.museum_publication.outputs.source_commit }}
          MUSEUM_PUBLICATION_TEST_COMMIT: ${{ steps.museum_publication.outputs.catalog_commit }}
        run: |
          set -euo pipefail
          case "$MUSEUM_PROJECT" in
            web-desktop-chromium|web-mobile-chromium) ;;
            *)
              echo "Unexpected Museum project: $MUSEUM_PROJECT" >&2
              exit 1
            ;;
          esac
          mapfile -t selected_packs < <(
            jq -r '.selected_packs[]' test-results/app-pr-ci/museum-release-selection.json
          )
          test "${#selected_packs[@]}" -gt 0
          museum_gate_spec=tests/museum/network-ia-readonly.spec.ts
          selected_specs=()
          for selected_pack in "${selected_packs[@]}"; do
            case "$selected_pack" in
              test:e2e:museum-data-architecture) selected_specs+=(tests/museum/data-architecture-readonly.spec.ts) ;;
              test:e2e:museum-institutional-practice) selected_specs+=(tests/museum/institutional-practice-readonly.spec.ts) ;;
              test:e2e:museum-about) selected_specs+=(tests/museum/about-readonly.spec.ts) ;;
              test:e2e:museum-inside-system) selected_specs+=(tests/museum/inside-system-readonly.spec.ts) ;;
              test:e2e:museum-rights) selected_specs+=(tests/museum/rights-readonly.spec.ts) ;;
              *)
                echo "Unexpected Museum selection pack: $selected_pack" >&2
                exit 1
              ;;
            esac
          done
          for selected_spec in "$museum_gate_spec" "${selected_specs[@]}"; do
            if [ ! -f "$selected_spec" ]; then
              echo "Selected Museum spec is missing: $selected_spec" >&2
              exit 1
            fi
          done
          # Desktop and mobile are separate matrix jobs. Each job owns its
          # runner, dev server, and Next.js dist directory, eliminating shared
          # route-compilation and browser state. Network IA runs first, retries
          # are disabled, and the first failure stops this job immediately.
          mkdir -p test-results/app-pr-ci
          PLAYWRIGHT_SKIP_WEB_SERVER=1 \
            ./bin/6529 exec playwright test \
              "$museum_gate_spec" \
              "${selected_specs[@]}" \
              --project="$MUSEUM_PROJECT" \
              --workers=1 \
              --list \
              --reporter=json \
              > test-results/app-pr-ci/museum-tests-full.json
          PLAYWRIGHT_SKIP_WEB_SERVER=1 \
            ./bin/6529 exec playwright test \
              "$museum_gate_spec" \
              --project="$MUSEUM_PROJECT" \
              --workers=1 \
              --list \
              --reporter=json \
              > test-results/app-pr-ci/museum-tests-gate.json
          PLAYWRIGHT_SKIP_WEB_SERVER=1 \
            ./bin/6529 exec playwright test \
              "${selected_specs[@]}" \
              --project="$MUSEUM_PROJECT" \
              --workers=1 \
              --list \
              --reporter=json \
              > test-results/app-pr-ci/museum-tests-remaining.json
          node <<'NODE'
          const fs = require("node:fs");
          const outputDir = "test-results/app-pr-ci";
          const exactCommit = /^[a-f0-9]{40}$/;
          const catalogCommit = process.env.MUSEUM_PUBLICATION_TEST_COMMIT || "";
          const sourceCommit = process.env.MUSEUM_PUBLICATION_EXPECTED_COMMIT || "";
          const project = process.env.MUSEUM_PROJECT || "";
          const allowedProjects = new Set([
            "web-desktop-chromium",
            "web-mobile-chromium",
          ]);
          if (!exactCommit.test(catalogCommit) || !exactCommit.test(sourceCommit)) {
            throw new Error("Museum execution inventory requires exact catalog and source commits.");
          }
          if (!allowedProjects.has(project)) {
            throw new Error(`Unexpected Museum project in execution inventory: ${project}`);
          }
          const selection = JSON.parse(
            fs.readFileSync(`${outputDir}/museum-release-selection.json`, "utf8")
          );
          const packSpecs = new Map([
            ["test:e2e:museum-data-architecture", "museum/data-architecture-readonly.spec.ts"],
            ["test:e2e:museum-institutional-practice", "museum/institutional-practice-readonly.spec.ts"],
            ["test:e2e:museum-about", "museum/about-readonly.spec.ts"],
            ["test:e2e:museum-inside-system", "museum/inside-system-readonly.spec.ts"],
            ["test:e2e:museum-rights", "museum/rights-readonly.spec.ts"],
          ]);
          const expectedSpecs = new Set(["museum/network-ia-readonly.spec.ts"]);
          for (const pack of selection.selected_packs) {
            const spec = packSpecs.get(pack);
            if (!spec) throw new Error(`Unknown Museum pack in execution inventory: ${pack}`);
            expectedSpecs.add(spec);
          }
          function collect(reportPath) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const entries = [];
            const visit = (suite) => {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if (test.expectedStatus !== "passed") {
                    throw new Error(
                      `Museum execution inventory contains a non-passing expected test: ${test.projectName}:${spec.id}`
                    );
                  }
                  entries.push({
                    file: spec.file,
                    key: `${test.projectName}:${spec.id}`,
                    project: test.projectName,
                    title: spec.title,
                  });
                }
              }
              for (const child of suite.suites || []) visit(child);
            };
            for (const suite of report.suites || []) visit(suite);
            if (entries.length === 0) throw new Error("Museum execution inventory is empty.");
            const keys = new Set(entries.map((entry) => entry.key));
            if (keys.size !== entries.length) {
              throw new Error("Museum execution inventory contains duplicate test identities.");
            }
            return entries;
          }
          const full = collect(`${outputDir}/museum-tests-full.json`);
          const gate = collect(`${outputDir}/museum-tests-gate.json`);
          const remaining = collect(`${outputDir}/museum-tests-remaining.json`);
          const fullKeys = new Set(full.map((entry) => entry.key));
          const assigned = new Set();
          for (const entries of [gate, remaining]) {
            for (const entry of entries) {
              if (!fullKeys.has(entry.key) || assigned.has(entry.key)) {
                throw new Error(`Museum execution overlap or unexpected test: ${entry.key}`);
              }
              assigned.add(entry.key);
            }
          }
          const missing = [...fullKeys].filter((key) => !assigned.has(key));
          if (missing.length > 0 || assigned.size !== fullKeys.size) {
            throw new Error(`Museum execution coverage is incomplete: ${missing.join(", ")}`);
          }
          const actualProjects = [...new Set(full.map((entry) => entry.project))].sort();
          if (JSON.stringify(actualProjects) !== JSON.stringify([project])) {
            throw new Error(`Museum execution inventory must cover only ${project}.`);
          }
          if (
            gate.some((entry) => entry.file !== "museum/network-ia-readonly.spec.ts") ||
            gate.some((entry) => entry.project !== project)
          ) {
            throw new Error(`Museum fail-fast gate must cover Network IA on ${project}.`);
          }
          const files = new Set(full.map((entry) => entry.file));
          if (
            files.size !== expectedSpecs.size ||
            [...expectedSpecs].some((file) => !files.has(file))
          ) {
            throw new Error(`Museum execution spec coverage is incomplete for ${project}.`);
          }
          fs.writeFileSync(
            `${outputDir}/museum-execution-inventory.json`,
            `${JSON.stringify(
              {
                catalog_commit: catalogCommit,
                contract: "museum-playwright-isolated-project-v3",
                full_test_count: full.length,
                gate: {
                  id: "network-ia",
                  test_count: gate.length,
                  test_keys: gate.map((entry) => entry.key).sort(),
                },
                project,
                selection_digest: selection.selection_digest,
                remaining: {
                  test_count: remaining.length,
                  test_keys: remaining.map((entry) => entry.key).sort(),
                  workers: 1,
                },
                source_commit: sourceCommit,
                specs: [...expectedSpecs].sort(),
              },
              null,
              2
            )}\n`
          );
          NODE
          museum_port=3101
          museum_base_url="http://localhost:${museum_port}"
          museum_server_log="test-results/app-pr-ci/museum-server.log"
          NEXT_DEV_DIST_DIR=".next-playwright-${MUSEUM_PROJECT}" \
            BASE_ENDPOINT="$museum_base_url" \
            PORT="$museum_port" \
            ./bin/6529 run dev > "$museum_server_log" 2>&1 &
          museum_server_pid="$!"
          cleanup_museum_server() {
            if kill -0 "$museum_server_pid" 2>/dev/null; then
              kill "$museum_server_pid" 2>/dev/null || true
              wait "$museum_server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_museum_server EXIT
          museum_server_ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              "$museum_base_url/museum/network/about" >/dev/null
            then
              museum_server_ready=true
              break
            fi
            if ! kill -0 "$museum_server_pid" 2>/dev/null; then
              cat "$museum_server_log"
              echo "Museum server exited before readiness for $MUSEUM_PROJECT." >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$museum_server_ready" != true ]; then
            cat "$museum_server_log"
            echo "Museum server did not become ready for $MUSEUM_PROJECT." >&2
            exit 1
          fi

          museum_gate_log="test-results/app-pr-ci/museum-gate.log"
          set +e
          PLAYWRIGHT_SKIP_WEB_SERVER=1 \
            BASE_ENDPOINT="$museum_base_url" \
            PLAYWRIGHT_BASE_URL="$museum_base_url" \
            PLAYWRIGHT_OUTPUT_DIR="test-results/playwright/museum-gate" \
            PLAYWRIGHT_HTML_REPORT_DIR="playwright-report/museum-gate" \
            timeout --signal=TERM --kill-after=30s 10m \
            ./bin/6529 exec playwright test \
              "$museum_gate_spec" \
              --project="$MUSEUM_PROJECT" \
              --workers=1 \
              --retries=0 \
              --max-failures=1 \
              2>&1 \
            | sed -u "s/^/[museum $MUSEUM_PROJECT gate] /" \
            | tee "$museum_gate_log"
          museum_gate_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$museum_gate_exit" -ne 0 ]; then
            if [ "$museum_gate_exit" -eq 124 ]; then
              echo "::error::Museum $MUSEUM_PROJECT Network IA gate exceeded its 10-minute timeout."
            else
              echo "::error::Museum $MUSEUM_PROJECT Network IA gate failed with exit ${museum_gate_exit}."
            fi
            tail -n 120 "$museum_gate_log"
            cat "$museum_server_log"
            exit "$museum_gate_exit"
          fi

          museum_remaining_log="test-results/app-pr-ci/museum-remaining.log"
          set +e
          PLAYWRIGHT_SKIP_WEB_SERVER=1 \
            BASE_ENDPOINT="$museum_base_url" \
            PLAYWRIGHT_BASE_URL="$museum_base_url" \
            PLAYWRIGHT_OUTPUT_DIR="test-results/playwright/museum-remaining" \
            PLAYWRIGHT_HTML_REPORT_DIR="playwright-report/museum-remaining" \
            timeout --signal=TERM --kill-after=30s 20m \
            ./bin/6529 exec playwright test \
              "${selected_specs[@]}" \
              --project="$MUSEUM_PROJECT" \
              --workers=1 \
              --retries=0 \
              --max-failures=1 \
              2>&1 \
            | sed -u "s/^/[museum $MUSEUM_PROJECT remaining] /" \
            | tee "$museum_remaining_log"
          museum_remaining_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$museum_remaining_exit" -ne 0 ]; then
            if [ "$museum_remaining_exit" -eq 124 ]; then
              echo "::error::Museum $MUSEUM_PROJECT remaining coverage exceeded its 20-minute timeout."
            else
              echo "::error::Museum $MUSEUM_PROJECT remaining coverage failed with exit ${museum_remaining_exit}."
            fi
            tail -n 120 "$museum_remaining_log"
            cat "$museum_server_log"
            exit "$museum_remaining_exit"
          fi
          tail -n 12 "$museum_remaining_log"
          tail -n 12 "$museum_server_log"

      - name: Upload app check artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-pr-ci-results-${{ matrix.lane }}-${{ github.event.pull_request.number || github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  installed-checks:
    name: Installed app checks
    needs:
      - plan
      - app-checks
      - core-playwright-checks
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.install_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require successful parallel app checks
        env:
          APP_CHECKS_RESULT: ${{ needs.app-checks.result }}
          CORE_PLAYWRIGHT_REQUIRED: ${{ needs.plan.outputs.core_playwright_required }}
          CORE_PLAYWRIGHT_RESULT: ${{ needs.core-playwright-checks.result }}
        run: |
          test "$APP_CHECKS_RESULT" = "success"
          if [ "$CORE_PLAYWRIGHT_REQUIRED" = true ]; then
            test "$CORE_PLAYWRIGHT_RESULT" = "success"
          fi
