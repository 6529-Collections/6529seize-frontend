name: Build Production Artifact

on:
  push:
    branches: [main]
    # A non-runtime-only merge intentionally has no automatic deploy artifact.
    # If that exact SHA must be promoted, dispatch this workflow manually first;
    # production deployment otherwise fails closed on the missing artifact.
    paths-ignore:
      - ".github/**"
      - "__tests__/**"
      - "ops/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-artifact-${{ github.sha }}
  cancel-in-progress: false

env:
  API_ENDPOINT: "https://api.6529.io"
  WS_ENDPOINT: "wss://ws.6529.io"
  ALLOWLIST_API_ENDPOINT: "https://allowlist-api.6529.io"
  BASE_ENDPOINT: "https://6529.io"
  NEXTGEN_CHAIN_ID: "1"
  MOBILE_APP_SCHEME: "mobile6529"
  CORE_SCHEME: "core6529"
  IPFS_API_ENDPOINT: "https://api-ipfs.6529.io"
  IPFS_GATEWAY_ENDPOINT: "https://ipfs.6529.io"
  ASSETS_FROM_S3: "true"
  ANNOUNCED_VERSION_ENDPOINT: "https://dnclu2fna0b2b.cloudfront.net/web_build/current-production-version.json"

jobs:
  build-production-artifact:
    name: Build exact production artifact
    runs-on: ${{ vars.PRODUCTION_BUILD_RUNNER || vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # This workflow runs only trusted main-branch code. No deployment or
      # cloud-mutation credentials are available to the build job.
      - name: Checkout exact production SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact production SHA
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Capture deterministic production build timestamp
        run: |
          set -euo pipefail
          build_timestamp="$(git show -s --format=%cI HEAD)"
          [[ "$build_timestamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          echo "VERSION_BUILD_TIMESTAMP=$build_timestamp" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Install Socket Firewall
        id: socket-firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        run: ./bin/6529 guard:no-package-lock

      - name: Install frozen dependencies
        env:
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Lint package.json versions
        run: ./bin/6529 lint:package-json

      - name: Build exact production bytes
        env:
          NODE_ENV: "production"
          VERSION: ${{ github.sha }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY || secrets.GIPHY_API_KEY }}
          AWS_RUM_APP_ID: ${{ secrets.AWS_RUM_APP_ID }}
          AWS_RUM_REGION: ${{ secrets.AWS_RUM_REGION }}
          AWS_RUM_SAMPLE_RATE: ${{ secrets.AWS_RUM_SAMPLE_RATE }}
          NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./bin/6529 run build:ci

      - name: Package exact production bytes
        run: |
          set -euo pipefail
          rm -rf production-artifact .production-bundle
          mkdir -p production-artifact/target/_next .production-bundle/.next

          test -f .next/standalone/server.js
          cp -r .next/standalone/. .production-bundle/
          cp -r .next/static production-artifact/target/_next/
          cp -r .next/static .production-bundle/.next/
          cp Procfile .production-bundle/
          cp -r .ebextensions .production-bundle/
          if [ -d .platform ]; then cp -r .platform .production-bundle/; fi
          find .production-bundle -xtype l -delete

          for file in BUILD_ID PUBLIC_RUNTIME.json ASSETS_FROM_S3; do
            if [ -f ".next/$file" ]; then
              cp ".next/$file" ".production-bundle/.next/$file"
            fi
          done

          node scripts/package-public-review-artifacts.cjs prepare \
            --profile production \
            --bundle-root .production-bundle
          test -z "$(find production-artifact/target/_next -type l -print -quit)"
          (cd .production-bundle && zip -qry ../production-artifact/target/package.zip .)

          zip_listing="$(mktemp)"
          zip_extract="$(mktemp -d)"
          trap 'rm -f "$zip_listing"; rm -rf "$zip_extract"' EXIT
          unzip -Z1 production-artifact/target/package.zip > "$zip_listing"
          node scripts/package-public-review-artifacts.cjs assert-listing \
            --profile production \
            --bundle-root .production-bundle \
            --listing-file "$zip_listing"
          unzip -q production-artifact/target/package.zip -d "$zip_extract"
          node scripts/package-public-review-artifacts.cjs assert-zip \
            --profile production \
            --bundle-root .production-bundle \
            --listing-file "$zip_listing" \
            --extracted-root "$zip_extract"

          package_size="$(stat -c%s production-artifact/target/package.zip)"
          test "$package_size" -le $((500 * 1024 * 1024))
          package_digest="$(sha256sum production-artifact/target/package.zip | cut -d' ' -f1)"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg package_digest "$package_digest" \
            --arg build_timestamp "$VERSION_BUILD_TIMESTAMP" \
            '{schema_version:1,artifact_contract:"production-prebuild-v1",repository:"frontend",source_sha:$source_sha,environment:"production",package_sha256:$package_digest,build_timestamp:$build_timestamp}' \
            > production-artifact/manifest.json
          (
            cd production-artifact
            find manifest.json target -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test -z "$(git status --porcelain=v1 --untracked-files=all -- public/help-index.json public/glossary.json public/llms.txt)"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- public/review-data content/public-reviews config/public-reviews)"

      - name: Upload exact production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-frontend-${{ github.sha }}
          path: production-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
