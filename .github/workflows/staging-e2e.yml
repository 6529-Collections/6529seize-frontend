name: Staging E2E

on:
  workflow_run:
    workflows: ["Web Deploy - STAGING"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pack:
        description: Post-deploy manifest alias; use all for the full set
        type: choice
        required: true
        default: all
        options:
          - all
          - core
          - social-readonly
          - input-detection-readonly
          - public-groups-tools-readonly
          - delegation-readonly
          - collections-readonly
          - admin-guards-readonly
          - public-content-readonly
          - profile-deep-links-readonly
          - search-waves-readonly
          - media-readonly
          - network-open-data-readonly
          - museum-institutional-practice
      deploy_hub_operation_id:
        description: Deploy Hub correlation id
        type: string
        required: false
        default: ""
      release_train_id:
        description: Release Bus train id
        type: string
        required: false
      release_train_revision:
        description: Release Bus train revision
        type: string
        required: false
      operation_key:
        description: Release Bus idempotency key
        type: string
        required: false
      source_ref:
        description: Immutable Release Bus source ref
        type: string
        required: false
      expected_sha:
        description: Immutable deployed SHA
        type: string
        required: false
      release_manifest_id:
        description: Exact Release Bus v2 manifest id
        type: string
        required: false
      release_manifest_identity_sha256:
        description: Exact Release Bus v2 manifest identity digest
        type: string
        required: false
      frontend_sha: { type: string, required: false }
      backend_sha: { type: string, required: false }
      frontend_artifact_digest: { type: string, required: false }
      backend_artifact_digest: { type: string, required: false }

permissions:
  contents: read

run-name: Staging E2E [${{ inputs.deploy_hub_operation_id || inputs.operation_key || 'automatic' }}]

concurrency:
  group: staging-e2e
  # Staging is a single mutable environment. Release Bus v2 freezes staging
  # during exact E2E ownership, so an older run must never be cancelled by a
  # later dispatch.
  cancel-in-progress: false

jobs:
  baseline-adoption-decision:
    name: Resolve pending baseline adoption
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == '1a-staging' &&
      !startsWith(github.event.workflow_run.display_title, 'Deploy Hub ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      manifest_ready: ${{ steps.decision.outputs.manifest_ready }}
    steps:
      - name: Check out trusted decision client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            bin/6529
            package.json
            scripts/release-bus-baseline-adoption-decision.cjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - name: Resolve exact automatic E2E decision
        id: decision
        env:
          DEPLOYED_REF: ${{ github.event.workflow_run.head_branch }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if ! result="$(./bin/6529 exec node scripts/release-bus-baseline-adoption-decision.cjs)"; then
            echo "Baseline-adoption decision client failed closed" >&2
            exit 1
          fi
          case "$result" in
            LEGACY:false)
              printf 'decision=LEGACY\nmanifest_ready=false\n'
              ;;
            DEFERRED:false)
              printf 'decision=DEFERRED\nmanifest_ready=false\n'
              ;;
            DEFERRED:true)
              printf 'decision=DEFERRED\nmanifest_ready=true\n'
              ;;
            *)
              echo "Baseline-adoption decision returned an invalid exact token" >&2
              exit 1
              ;;
          esac >> "$GITHUB_OUTPUT"

  staging-packs:
    name: Staging E2E packs
    needs: baseline-adoption-decision
    # Trust gate: this job holds a secret and executes checked-out code, so
    # workflow_run triggers must come from this repository's own 1a-staging
    # branch (staging deploys are push-triggered; forks cannot push there).
    # The explicit head_repository/head_branch conditions keep that invariant
    # enforced even if the upstream deploy workflow's triggers ever change.
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.baseline-adoption-decision.result == 'success' &&
          needs.baseline-adoption-decision.outputs.decision == 'LEGACY' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == '1a-staging' &&
          !startsWith(github.event.workflow_run.display_title, 'Deploy Hub ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      PLAYWRIGHT_STAGING_ACCESS_CODE: ${{ secrets.PLAYWRIGHT_STAGING_ACCESS_CODE }}
      SELECTED_PACK: ${{ github.event.inputs.pack || 'all' }}
    steps:
      - name: Reject partial Release Bus identity
        if: github.event_name == 'workflow_dispatch'
        env:
          BACKEND_ARTIFACT_DIGEST: ${{ inputs.backend_artifact_digest }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          DEPLOY_HUB_BASE_REF: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FRONTEND_ARTIFACT_DIGEST: ${{ inputs.frontend_artifact_digest }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          identity_values="$TRAIN_ID$TRAIN_REVISION$OPERATION_KEY$SOURCE_REF$EXPECTED_SHA$MANIFEST_ID$MANIFEST_IDENTITY$FRONTEND_SHA$BACKEND_SHA$FRONTEND_ARTIFACT_DIGEST$BACKEND_ARTIFACT_DIGEST"
          release_bus_values="$TRAIN_ID$TRAIN_REVISION$OPERATION_KEY$MANIFEST_ID$MANIFEST_IDENTITY$FRONTEND_SHA$BACKEND_SHA$FRONTEND_ARTIFACT_DIGEST$BACKEND_ARTIFACT_DIGEST"
          if [ -n "${DEPLOY_HUB_OPERATION_ID:-}" ]; then
            [[ "$DEPLOY_HUB_OPERATION_ID" =~ ^dh-([1-9][0-9]{0,19})r[1-9][0-9]{0,8}-c[1-9][0-9]*-staging-a[12]$ ]]
            test "$GITHUB_ACTOR" = "github-actions[bot]"
            controller_run_id="${BASH_REMATCH[1]}"
            controller_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id")"
            jq -e \
              --arg branch "$DEPLOY_HUB_BASE_REF" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow ".github/workflows/deploy-hub.yml" \
              '.path == $workflow and .event == "workflow_dispatch" and .head_branch == $branch and .head_repository.full_name == $repository' \
              <<< "$controller_run" >/dev/null
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$SOURCE_REF" = 1a-staging
            test -z "$release_bus_values"
          elif [ -z "$OPERATION_KEY" ]; then
            test -z "$identity_values"
          else
            test -n "$TRAIN_ID"
          fi

      - name: Validate Release Bus inputs
        if: github.event_name == 'workflow_dispatch' && inputs.operation_key != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FRONTEND_ARTIFACT_DIGEST: ${{ inputs.frontend_artifact_digest }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_ARTIFACT_DIGEST: ${{ inputs.backend_artifact_digest }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^([1-9][0-9]{0,8}|rollback-[1-9][0-9]{0,8})$ ]]
          [[ "$OPERATION_KEY" =~ ^[A-Za-z0-9:._-]{1,180}$ ]]
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]{1,255}$ ]]
          [[ "$MANIFEST_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$MANIFEST_IDENTITY" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$FRONTEND_SHA" || "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$BACKEND_SHA" || "$BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$FRONTEND_ARTIFACT_DIGEST" || "$FRONTEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$BACKEND_ARTIFACT_DIGEST" || "$BACKEND_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test -n "$FRONTEND_SHA$BACKEND_SHA"

      - name: Authorize Release Bus E2E operation
        if: github.event_name == 'workflow_dispatch' && inputs.operation_key != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          TRAIN_ID: ${{ inputs.release_train_id }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg expected_sha "$EXPECTED_SHA" --arg artifact_digest "$MANIFEST_IDENTITY" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,artifact_run_id:null,repository:"frontend",environment:"staging",service:null,expected_sha:$expected_sha,artifact_digest:$artifact_digest}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/authorize"

      # workflow_run: the exact SHA the staging deploy shipped. Manual
      # dispatch falls back to the branch tip, which may differ from what is
      # currently deployed to staging — fine for ad-hoc reruns, but prefer
      # letting the deploy trigger this workflow for deployed-SHA fidelity.
      - name: Check out the deployed ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable dispatched source
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Stage immutable Release Bus E2E tooling
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || \
            git fetch --no-tags origin "$WORKFLOW_SHA"
          tooling="$RUNNER_TEMP/release-bus-tooling/scripts"
          mkdir -p "$tooling" "$RUNNER_TEMP/release-bus-evidence"
          for file in \
            scripts/release-bus-install-dependencies.cjs
          do
            git show "$WORKFLOW_SHA:$file" > "$RUNNER_TEMP/release-bus-tooling/$file"
          done
          {
            echo "RELEASE_BUS_INSTALL_TOOL=$tooling/release-bus-install-dependencies.cjs"
            echo "RELEASE_BUS_INSTALL_EVIDENCE=$RUNNER_TEMP/release-bus-evidence/dependency-install.json"
          } >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Install Socket Firewall
        id: socket-firewall
        continue-on-error: true
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        run: ./bin/6529 guard:no-package-lock

      - name: Install and verify frozen dependencies
        id: dependencies
        continue-on-error: true
        env:
          RELEASE_BUS_SOCKET_FIREWALL_OUTCOME: ${{ steps.socket-firewall.outcome }}
          SFW_BIN: ${{ steps.socket-firewall.outputs.firewall-path-binary }}
        run: node "$RELEASE_BUS_INSTALL_TOOL"

      - name: Install Playwright browser
        if: steps.dependencies.outcome == 'success'
        id: playwright
        continue-on-error: true
        run: ./bin/6529 exec playwright install --with-deps chromium

      - name: Run staging packs against staging.6529.io
        if: steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success'
        id: e2e
        continue-on-error: true
        env:
          RELEASE_BUS_E2E_MANIFEST_ID: ${{ inputs.release_manifest_id }}
          RELEASE_BUS_E2E_MANIFEST_IDENTITY_SHA256: ${{ inputs.release_manifest_identity_sha256 }}
          RELEASE_BUS_E2E_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          args=(
            --env staging
            --trigger post-deploy
            --artifact-root staging-e2e-artifacts
          )
          if runner_capabilities="$(./bin/6529 exec node scripts/e2e-packs.cjs --capabilities 2>/dev/null)" &&
            jq -e '
              .contract == "release-bus-e2e-runner-capabilities.v1" and
              .features.readonly_pack_parallelism == {
                version: 1,
                max_parallel: 4
              }
            ' <<< "$runner_capabilities" >/dev/null
          then
            args+=(--parallel 3)
          fi
          if [ "${SELECTED_PACK:-all}" != all ]; then
            args+=(--pack "$SELECTED_PACK")
          fi
          ./bin/6529 run e2e:packs -- "${args[@]}"

      - name: Validate exact manifest-bound E2E evidence
        id: evidence
        if: always() && steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success'
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MANIFEST_ID: ${{ inputs.release_manifest_id }}
          MANIFEST_IDENTITY: ${{ inputs.release_manifest_identity_sha256 }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: |
          set -euo pipefail
          test -f staging-e2e-artifacts/evidence.json
          expected_inventory="$(./bin/6529 exec node - <<'NODE'
          const { PACKS } = require("./tests/packs.manifest.cjs");
          const selected = process.env.SELECTED_PACK || "all";
          const keys = PACKS.filter((pack) =>
            pack.environments.includes("staging") &&
            pack.triggers.includes("post-deploy") &&
            (selected === "all" || pack.scriptKey === selected || pack.alias === selected)
          ).map((pack) => pack.scriptKey);
          process.stdout.write(JSON.stringify(keys));
          NODE
          )"
          jq -e --argjson expected "$expected_inventory" '
            .schema_version == "release-bus-e2e-packs.v1" and
            .environment == "staging" and
            .trigger == "post-deploy" and
            (.worker_count | type == "number" and . >= 1 and . <= 3) and
            .pack_count == ($expected | length) and
            (.results | map(.script_key)) == $expected and
            (.results | map(.script_key) | unique | length) == .pack_count and
            (.results | all(.safety == "readonly")) and
            .failed_count == ([.results[] | select(.status == "failed")] | length) and
            .infrastructure_failure_count == ([.results[] | select(.failure_class == "infrastructure")] | length)
          ' staging-e2e-artifacts/evidence.json >/dev/null
          if [ -n "$OPERATION_KEY" ]; then
            jq -e --arg manifest_id "$MANIFEST_ID" --arg identity "$MANIFEST_IDENTITY" --arg source_sha "$EXPECTED_SHA" '
              .release_binding == {
                manifest_id:$manifest_id,
                manifest_identity_sha256:$identity,
                source_sha:$source_sha
              }
            ' staging-e2e-artifacts/evidence.json >/dev/null
          else
            jq -e '.release_binding == null' staging-e2e-artifacts/evidence.json >/dev/null
          fi
          if [ "$E2E_OUTCOME" = success ]; then
            jq -e '
              .failed_count == 0 and
              .infrastructure_failure_count == 0 and
              (.results | all(.status == "passed" and .failure_class == null))
            ' staging-e2e-artifacts/evidence.json >/dev/null
          fi

      - name: Upload manifest-bound Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-e2e-artifacts-${{ inputs.deploy_hub_operation_id || inputs.release_train_id || github.run_id }}
          path: staging-e2e-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Report structured Release Bus E2E result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation_key != ''
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
          TRAIN_ID: ${{ inputs.release_train_id }}
        run: |
          set -euo pipefail
          status=SUCCEEDED
          failure_class=null
          failure_phase=null
          retryable=false
          if [ "$SOCKET_OUTCOME" != success ] || [ "$DEPENDENCIES_OUTCOME" != success ] || [ "$PLAYWRIGHT_OUTCOME" != success ]; then
            status=FAILED
            failure_class=INFRASTRUCTURE
            failure_phase=staging_e2e_setup
            retryable=true
          elif [ "$EVIDENCE_OUTCOME" != success ]; then
            status=FAILED
            failure_class=CONTROL_PLANE
            failure_phase=staging_e2e_evidence
          elif [ "$E2E_OUTCOME" != success ]; then
            status=FAILED
            if [ -f staging-e2e-artifacts/evidence.json ] && \
              [ "$(jq -r '.infrastructure_failure_count // 0' staging-e2e-artifacts/evidence.json)" -gt 0 ]; then
              failure_class=INFRASTRUCTURE
              failure_phase=staging_e2e_infrastructure
              retryable=true
            else
              failure_class=E2E
              failure_phase=staging_e2e
            fi
          fi
          if [ -f staging-e2e-artifacts/evidence.json ]; then
            evidence_digest="$(sha256sum staging-e2e-artifacts/evidence.json | cut -d' ' -f1)"
          else
            evidence_digest=''
          fi
          payload="$(jq -n --arg train_id "$TRAIN_ID" --arg operation_key "$OPERATION_KEY" --arg workflow_run_id "$GITHUB_RUN_ID" --arg status "$status" --arg failure_class "$failure_class" --arg failure_phase "$failure_phase" --argjson retryable "$retryable" --arg evidence_digest "$evidence_digest" '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,phase:"complete",status:$status,failure_class:(if $failure_class == "null" then null else $failure_class end),failure_phase:(if $failure_phase == "null" then null else $failure_phase end),retryable:$retryable,summary:{e2e_evidence_digest:(if $evidence_digest == "" then null else $evidence_digest end)},stages:[],jest:null,backend_evidence:null}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/report-progress"

      - name: Publish Deploy Hub E2E result
        if: always() && inputs.deploy_hub_operation_id != ''
        env:
          API_URL: ${{ github.api_url }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          SOCKET_OUTCOME: ${{ steps.socket-firewall.outcome }}
        run: |
          set -euo pipefail
          state=success
          description="Staging E2E passed"
          if [ "$SOCKET_OUTCOME" != success ] || [ "$DEPENDENCIES_OUTCOME" != success ] || [ "$PLAYWRIGHT_OUTCOME" != success ]; then
            state=error
            description="Staging E2E infrastructure failure"
          elif [ "$EVIDENCE_OUTCOME" != success ]; then
            state=error
            description="Staging E2E evidence failure"
          elif [ "$E2E_OUTCOME" != success ]; then
            if [ -f staging-e2e-artifacts/evidence.json ] && [ "$(jq -r '.infrastructure_failure_count // 0' staging-e2e-artifacts/evidence.json)" -gt 0 ]; then
              state=error
              description="Staging E2E infrastructure failure"
            else
              state=failure
              description="Staging E2E product failure"
            fi
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg description "$description" \
            --arg context "Deploy Hub E2E — $DEPLOY_HUB_OPERATION_ID" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$API_URL/repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA"

      - name: Return staging E2E result
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$E2E_OUTCOME" = success
