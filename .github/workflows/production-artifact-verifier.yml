name: Verify Production Artifact

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
        description: Exact production source SHA.
      artifact_run_id:
        type: string
        required: true
        description: Workflow run that built the artifact.
      artifact_run_attempt:
        type: string
        required: true
        description: Exact builder run attempt.
      artifact_id:
        type: string
        required: true
        description: Exact GitHub artifact ID.
      artifact_digest:
        type: string
        required: true
        description: GitHub artifact API digest.
      artifact_name:
        type: string
        required: true
        description: Exact target-and-run-bound artifact name.
      artifact_workflow_sha:
        type: string
        required: true
        description: Exact workflow head SHA bound to the artifact.
    outputs:
      package_sha256:
        description: Verified SHA-256 digest of target/package.zip.
        value: ${{ jobs.verify.outputs.package_sha256 }}
  workflow_dispatch:
    inputs:
      target_sha: { type: string, required: true }
      artifact_run_id: { type: string, required: true }
      artifact_run_attempt: { type: string, required: true }
      artifact_id: { type: string, required: true }
      artifact_digest: { type: string, required: true }
      artifact_name: { type: string, required: true }
      artifact_workflow_sha: { type: string, required: true }

permissions:
  actions: read
  contents: read

run-name: Verify production artifact ${{ inputs.target_sha }} [artifact ${{ inputs.artifact_id }}]

concurrency:
  group: production-artifact-verifier-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      package_sha256: ${{ steps.verify.outputs.package_sha256 }}

    steps:
      - name: Check out immutable artifact safety helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
          sparse-checkout: |
            ops/scripts/verify-production-artifact.cjs
            ops/scripts/cli-args.cjs
          sparse-checkout-cone-mode: false

      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"

      - name: Validate exact artifact inputs
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_WORKFLOW_SHA: ${{ inputs.artifact_workflow_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$ARTIFACT_NAME" = "production-frontend-${TARGET_SHA}-${ARTIFACT_RUN_ID}"
          test "$GITHUB_REF" = refs/heads/main

      - name: Read exact builder run and artifact metadata
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-artifact-verifier"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/attempts/${ARTIFACT_RUN_ATTEMPT}" \
            > "$RUNNER_TEMP/production-artifact-verifier/run.json"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/attempts/${ARTIFACT_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs' | jq -s 'add' \
            > "$RUNNER_TEMP/production-artifact-verifier/jobs.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "$RUNNER_TEMP/production-artifact-verifier/artifact.json"

      - name: Verify builder and artifact identity
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_WORKFLOW_SHA: ${{ inputs.artifact_workflow_sha }}
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/production-artifact-verifier/run.json"
          artifact_file="$RUNNER_TEMP/production-artifact-verifier/artifact.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$ARTIFACT_RUN_ID" \
            --argjson run_attempt "$ARTIFACT_RUN_ATTEMPT" \
            --arg workflow_sha "$ARTIFACT_WORKFLOW_SHA" '
              .id == ($run_id | tonumber) and
              .run_attempt == $run_attempt and
              (
                .path == ".github/workflows/production-build-artifact.yml" or
                (
                  .path == ".github/workflows/build-upload-deploy-prod.yml" and
                  (.referenced_workflows | type == "array") and
                  any(.referenced_workflows[]?;
                    (.path | split("@")[0]) == ($repository + "/.github/workflows/production-build-artifact.yml") and
                    .sha == $workflow_sha
                  )
                )
              ) and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $workflow_sha and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository
            ' "$run_file" >/dev/null
          # A later job may have failed in the original attempt. Reuse its
          # artifact only when the exact builder job itself succeeded.
          jq -e \
            --arg run_id "$ARTIFACT_RUN_ID" \
            --arg workflow_sha "$ARTIFACT_WORKFLOW_SHA" '
              [.[] | select(
                .name == "Build exact production artifact" or
                .name == "Build exact production artifact / Build exact production artifact"
              )] as $builders |
              ($builders | length) == 1 and
              ($builders[0] |
                (.run_id | tostring) == $run_id and
                .head_sha == $workflow_sha and
                .status == "completed" and .conclusion == "success"
              )
            ' "$RUNNER_TEMP/production-artifact-verifier/jobs.json" >/dev/null
          jq -e \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg run_id "$ARTIFACT_RUN_ID" '
              .id == ($id | tonumber) and
              .name == $name and
              .expired == false and
              .digest == $digest and
              (.workflow_run.id | tostring) == $run_id
            ' "$artifact_file" >/dev/null

      - name: Download exact artifact archive by ID
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 900 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/production-artifact-verifier/artifact.zip"

      - name: Validate and extract archive safely
        env:
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact.cjs
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/production-artifact-verifier"
          unzip -Z1 "$root/artifact.zip" > "$root/archive-members.txt"
          node "$TOOL" validate-archive-members --archive-members "$root/archive-members.txt" >/dev/null
          mkdir -p "$root/artifact"
          unzip -q "$root/artifact.zip" -d "$root/artifact"
          node "$TOOL" validate-extracted-artifact --artifact-root "$root/artifact" >/dev/null

      - name: Read current protected main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/production-artifact-verifier"
          protected_main_sha="$(jq -er .protected_main_sha "$root/artifact/manifest.json")"
          [[ "$protected_main_sha" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$root/main-ref.json"
          current_main_sha="$(jq -er 'select(.ref == "refs/heads/main" and .object.type == "commit") | .object.sha' "$root/main-ref.json")"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${current_main_sha}" > "$root/target-ancestry.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${protected_main_sha}...${current_main_sha}" > "$root/protected-main-ancestry.json"
          jq -e '.status == "identical" or .status == "ahead"' "$root/target-ancestry.json" >/dev/null
          jq -e '.status == "identical" or .status == "ahead"' "$root/protected-main-ancestry.json" >/dev/null

      - name: Verify checksums, manifest, and package bytes
        id: verify
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_WORKFLOW_SHA: ${{ inputs.artifact_workflow_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/production-artifact-verifier"
          artifact_root="$root/artifact"
          test "$(sha256sum "$root/artifact.zip" | cut -d' ' -f1)" = "${ARTIFACT_DIGEST#sha256:}"
          (cd "$artifact_root" && sha256sum -c SHA256SUMS)
          unzip -t "$artifact_root/target/package.zip" >/dev/null
          jq -e \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg run_id "$ARTIFACT_RUN_ID" \
            --argjson run_attempt "$ARTIFACT_RUN_ATTEMPT" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_sha "$ARTIFACT_WORKFLOW_SHA" '
              .schema_version == 1 and
              .artifact_contract == "production-deployment-v1" and
              .repository == "frontend" and
              .environment == "production" and
              .artifact_name == $artifact_name and
              .target_sha == $target_sha and
              .source_sha == $target_sha and
              .workflow_sha == $workflow_sha and
              (.workflow_run_id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              (.protected_main_sha | test("^[a-f0-9]{40}$")) and
              (.package_sha256 | test("^[a-f0-9]{64}$"))
            ' "$artifact_root/manifest.json" >/dev/null
          package_digest="$(sha256sum "$artifact_root/target/package.zip" | cut -d' ' -f1)"
          test "$package_digest" = "$(jq -r .package_sha256 "$artifact_root/manifest.json")"
          jq -e \
            --arg source_sha "$TARGET_SHA" \
            --arg package_sha256 "$package_digest" '
              .schema_version == "artifact-portability.v1" and
              .contract == "artifact-portability-v1" and
              .environment == "production" and
              .source.git_sha == $source_sha and
              .digests.package_sha256 == $package_sha256 and
              .portability.status == "NOT_PORTABLE" and
              .portability.portable == false and
              .portability.reuse_authorized == false and
              .portability.promotion_authorized == false
            ' "$artifact_root/artifact-portability.json" >/dev/null
          test "$(stat -c%s "$artifact_root/target/package.zip")" -le $((500 * 1024 * 1024))
          echo "package_sha256=$package_digest" >> "$GITHUB_OUTPUT"
