name: Verify One-Click Production Artifact

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
        description: Frozen production source SHA selected by the orchestrator.
      operation_id:
        type: string
        required: true
        description: Immutable one-click operation identity.
      artifact_run_id:
        type: string
        required: true
        description: Exact successful production builder workflow run ID from the controller.
      artifact_run_attempt:
        type: string
        required: true
        description: Exact successful builder run attempt from the controller.
      artifact_id:
        type: string
        required: true
        description: Exact GitHub artifact ID from artifact_run_id.
      artifact_api_digest:
        type: string
        required: true
        description: Exact GitHub artifact API digest from trusted controller evidence.
      artifact_name:
        type: string
        required: true
        description: Exact target-and-operation-bound builder artifact name.
      artifact_workflow_sha:
        type: string
        required: true
        description: Exact builder workflow head SHA bound to the artifact.
    outputs:
      selection_artifact_run_id:
        description: Workflow run containing the immutable selection artifact.
        value: ${{ jobs.verify.outputs.selection_artifact_run_id }}
      selection_artifact_id:
        description: Exact GitHub artifact ID for the immutable selection.
        value: ${{ jobs.verify.outputs.selection_artifact_id }}
      selection_artifact_name:
        description: Exact name of the immutable selection artifact.
        value: ${{ jobs.verify.outputs.selection_artifact_name }}
      selection_artifact_digest:
        description: GitHub API SHA256 digest of the selection artifact archive.
        value: ${{ jobs.verify.outputs.selection_artifact_digest }}
      selection_artifact_run_attempt:
        description: Exact verifier workflow run attempt containing the selection artifact.
        value: ${{ jobs.verify.outputs.selection_artifact_run_attempt }}
      selection_digest:
        description: SHA256 digest embedded in selection.json.
        value: ${{ jobs.verify.outputs.selection_digest }}
  workflow_dispatch:
    inputs:
      target_sha:
        type: string
        required: true
        description: Frozen production source SHA selected by the orchestrator.
      operation_id:
        type: string
        required: true
        description: Immutable one-click operation identity.
      artifact_run_id:
        type: string
        required: true
        description: Exact successful production builder workflow run ID from the controller.
      artifact_run_attempt:
        type: string
        required: true
        description: Exact successful builder run attempt from the controller.
      artifact_id:
        type: string
        required: true
        description: Exact GitHub artifact ID from artifact_run_id.
      artifact_api_digest:
        type: string
        required: true
        description: Exact GitHub artifact API digest from trusted controller evidence.
      artifact_name:
        type: string
        required: true
        description: Exact target-and-operation-bound builder artifact name.
      artifact_workflow_sha:
        type: string
        required: true
        description: Exact builder workflow head SHA bound to the artifact.

permissions:
  actions: read
  contents: read

run-name: Verify production artifact ${{ inputs.target_sha }} [${{ inputs.operation_id }}] [builder ${{ inputs.artifact_run_id }}/${{ inputs.artifact_run_attempt }} ${{ inputs.artifact_id }} ${{ inputs.artifact_api_digest }} ${{ inputs.artifact_workflow_sha }}]

concurrency:
  group: one-click-production-verifier-${{ inputs.operation_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      selection_artifact_run_id: ${{ steps.selection-result.outputs.selection_artifact_run_id }}
      selection_artifact_id: ${{ steps.selection-result.outputs.selection_artifact_id }}
      selection_artifact_name: ${{ steps.selection-result.outputs.selection_artifact_name }}
      selection_artifact_digest: ${{ steps.selection-result.outputs.selection_artifact_digest }}
      selection_artifact_run_attempt: ${{ steps.selection-result.outputs.selection_artifact_run_attempt }}
      selection_digest: ${{ steps.selection-result.outputs.selection_digest }}
    steps:
      - name: Check out immutable verifier helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
          sparse-checkout: |
            ops/scripts/verify-production-artifact-selection.cjs
            ops/scripts/cli-args.cjs
          sparse-checkout-cone-mode: false

      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"

      - name: Validate frozen verifier inputs
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_API_DIGEST: ${{ inputs.artifact_api_digest }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_WORKFLOW_SHA: ${{ inputs.artifact_workflow_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact-selection.cjs
        run: |
          set -euo pipefail
          node "$TOOL" validate-inputs \
            --target-sha "$TARGET_SHA" \
            --operation-id "$OPERATION_ID" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --artifact-run-attempt "$ARTIFACT_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-api-digest "$ARTIFACT_API_DIGEST" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$REPOSITORY" >/dev/null
          [[ "$ARTIFACT_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main

      - name: Read exact builder run and artifact metadata
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_API_DIGEST: ${{ inputs.artifact_api_digest }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
          RUN_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact-run.json
          ARTIFACT_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RUN_METADATA")"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/attempts/${ARTIFACT_RUN_ATTEMPT}" \
            > "$RUN_METADATA"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "$ARTIFACT_METADATA"

      - name: Verify exact builder workflow and artifact identity
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_API_DIGEST: ${{ inputs.artifact_api_digest }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact.json
          OPERATION_ID: ${{ inputs.operation_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact-run.json
          TARGET_SHA: ${{ inputs.target_sha }}
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact-selection.cjs
        run: |
          set -euo pipefail
          node "$TOOL" verify-metadata \
            --target-sha "$TARGET_SHA" \
            --operation-id "$OPERATION_ID" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --artifact-run-attempt "$ARTIFACT_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-api-digest "$ARTIFACT_API_DIGEST" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$REPOSITORY" \
            --run-metadata "$RUN_METADATA" \
            --artifact-metadata "$ARTIFACT_METADATA" >/dev/null

      - name: Download exact artifact archive by ID
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ runner.temp }}/one-click-production-verifier/artifact.zip
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 900 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$ARCHIVE"

      - name: Validate archive member paths before extraction
        env:
          ARCHIVE: ${{ runner.temp }}/one-click-production-verifier/artifact.zip
          ARCHIVE_MEMBERS: ${{ runner.temp }}/one-click-production-verifier/archive-members.txt
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact-selection.cjs
        run: |
          set -euo pipefail
          unzip -Z1 "$ARCHIVE" > "$ARCHIVE_MEMBERS"
          node "$TOOL" validate-archive-members \
            --archive-members "$ARCHIVE_MEMBERS" >/dev/null

      - name: Extract exact artifact into a fresh verifier directory
        env:
          ARCHIVE: ${{ runner.temp }}/one-click-production-verifier/artifact.zip
          ARTIFACT_ROOT: ${{ runner.temp }}/one-click-production-verifier/artifact
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          unzip -q "$ARCHIVE" -d "$ARTIFACT_ROOT"

      - name: Validate extracted entries before reading manifest
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/one-click-production-verifier/artifact
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact-selection.cjs
        run: |
          set -euo pipefail
          node "$TOOL" validate-extracted-artifact \
            --artifact-root "$ARTIFACT_ROOT" >/dev/null

      - name: Read protected main and exact ancestry evidence
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/one-click-production-verifier/artifact
          GH_TOKEN: ${{ github.token }}
          PROTECTED_MAIN_ANCESTRY: ${{ runner.temp }}/one-click-production-verifier/protected-main-ancestry.json
          PROTECTED_MAIN_REF: ${{ runner.temp }}/one-click-production-verifier/protected-main-ref.json
          TARGET_ANCESTRY: ${{ runner.temp }}/one-click-production-verifier/target-ancestry.json
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            > "$PROTECTED_MAIN_REF"
          current_main_sha="$(jq -er 'select(.ref == "refs/heads/main" and .object.type == "commit") | .object.sha' "$PROTECTED_MAIN_REF")"
          [[ "$current_main_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          protected_main_sha="$(jq -er '.protected_main_sha' "$ARTIFACT_ROOT/manifest.json")"
          [[ "$protected_main_sha" =~ ^[a-f0-9]{40}$ ]]
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${current_main_sha}" \
            > "$TARGET_ANCESTRY"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/compare/${protected_main_sha}...${current_main_sha}" \
            > "$PROTECTED_MAIN_ANCESTRY"

      - name: Verify archive digest, manifest, checksums, and package bytes
        id: verified-selection
        env:
          ARCHIVE: ${{ runner.temp }}/one-click-production-verifier/artifact.zip
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_API_DIGEST: ${{ inputs.artifact_api_digest }}
          ARTIFACT_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact.json
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_ROOT: ${{ runner.temp }}/one-click-production-verifier/artifact
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          CHECKSUMS_OUTPUT: ${{ runner.temp }}/one-click-production-verifier/selection/SHA256SUMS
          OPERATION_ID: ${{ inputs.operation_id }}
          OUTPUT: ${{ runner.temp }}/one-click-production-verifier/selection/selection.json
          PROTECTED_MAIN_ANCESTRY: ${{ runner.temp }}/one-click-production-verifier/protected-main-ancestry.json
          PROTECTED_MAIN_REF: ${{ runner.temp }}/one-click-production-verifier/protected-main-ref.json
          REPOSITORY: ${{ github.repository }}
          RUN_METADATA: ${{ runner.temp }}/one-click-production-verifier/artifact-run.json
          TARGET_ANCESTRY: ${{ runner.temp }}/one-click-production-verifier/target-ancestry.json
          TARGET_SHA: ${{ inputs.target_sha }}
          VERIFIER_REF: ${{ github.ref }}
          VERIFIER_RUN_ID: ${{ github.run_id }}
          VERIFIER_RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOOL: ${{ github.workspace }}/trusted-verifier/ops/scripts/verify-production-artifact-selection.cjs
        run: |
          set -euo pipefail
          node "$TOOL" verify-artifact \
            --target-sha "$TARGET_SHA" \
            --operation-id "$OPERATION_ID" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --artifact-run-attempt "$ARTIFACT_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-api-digest "$ARTIFACT_API_DIGEST" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$REPOSITORY" \
            --run-metadata "$RUN_METADATA" \
            --artifact-metadata "$ARTIFACT_METADATA" \
            --archive "$ARCHIVE" \
            --artifact-root "$ARTIFACT_ROOT" \
            --protected-main-ref "$PROTECTED_MAIN_REF" \
            --target-ancestry "$TARGET_ANCESTRY" \
            --protected-main-ancestry "$PROTECTED_MAIN_ANCESTRY" \
            --verifier-run-id "$VERIFIER_RUN_ID" \
            --verifier-run-attempt "$VERIFIER_RUN_ATTEMPT" \
            --verifier-workflow-sha "$VERIFIER_WORKFLOW_SHA" \
            --verifier-ref "$VERIFIER_REF" \
            --output "$OUTPUT" \
            --checksums-output "$CHECKSUMS_OUTPUT" >/dev/null
          selection_digest="$(jq -er '.selection_digest' "$OUTPUT")"
          selection_name="$(jq -er '.selection_artifact_name' "$OUTPUT")"
          selection_run_attempt="$(jq -er '.verifier_run_attempt' "$OUTPUT")"
          {
            echo "selection_digest=$selection_digest"
            echo "selection_artifact_name=$selection_name"
            echo "selection_artifact_run_id=$VERIFIER_RUN_ID"
            echo "selection_artifact_run_attempt=$selection_run_attempt"
          } >> "$GITHUB_OUTPUT"

      - name: Independently recheck verified SHA256SUMS
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/one-click-production-verifier/artifact
        run: |
          set -euo pipefail
          (cd "$ARTIFACT_ROOT" && sha256sum -c SHA256SUMS)
          unzip -t "$ARTIFACT_ROOT/target/package.zip" >/dev/null

      - name: Upload immutable production artifact selection
        id: upload-selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.verified-selection.outputs.selection_artifact_name }}
          path: ${{ runner.temp }}/one-click-production-verifier/selection
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable selection identity
        id: selection-result
        env:
          SELECTION_ARTIFACT_DIGEST: sha256:${{ steps.upload-selection.outputs.artifact-digest }}
          SELECTION_ARTIFACT_ID: ${{ steps.upload-selection.outputs.artifact-id }}
          SELECTION_ARTIFACT_NAME: ${{ steps.verified-selection.outputs.selection_artifact_name }}
          SELECTION_ARTIFACT_RUN_ATTEMPT: ${{ steps.verified-selection.outputs.selection_artifact_run_attempt }}
          SELECTION_ARTIFACT_RUN_ID: ${{ steps.verified-selection.outputs.selection_artifact_run_id }}
          SELECTION_DIGEST: ${{ steps.verified-selection.outputs.selection_digest }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SELECTION_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SELECTION_ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SELECTION_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          {
            echo "selection_artifact_run_id=$SELECTION_ARTIFACT_RUN_ID"
            echo "selection_artifact_id=$SELECTION_ARTIFACT_ID"
            echo "selection_artifact_name=$SELECTION_ARTIFACT_NAME"
            echo "selection_artifact_digest=$SELECTION_ARTIFACT_DIGEST"
            echo "selection_artifact_run_attempt=$SELECTION_ARTIFACT_RUN_ATTEMPT"
            echo "selection_digest=$SELECTION_DIGEST"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Immutable production artifact selection"
            echo
            printf '%s\n' "- target SHA: \`$TARGET_SHA\`"
            printf '%s\n' "- selection artifact run ID: \`$SELECTION_ARTIFACT_RUN_ID\`"
            printf '%s\n' "- selection artifact ID: \`$SELECTION_ARTIFACT_ID\`"
            printf '%s\n' "- selection artifact digest: \`$SELECTION_ARTIFACT_DIGEST\`"
            printf '%s\n' "- selection digest: \`$SELECTION_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
