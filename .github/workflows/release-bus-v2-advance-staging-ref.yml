name: Release Bus v2 - Advance Frontend Staging Ref

on:
  workflow_dispatch:
    inputs:
      release_train_id: { type: string, required: true }
      release_train_revision: { type: string, required: true }
      operation_key: { type: string, required: true }
      expected_old_sha: { type: string, required: true }
      expected_sha: { type: string, required: true }
      phase: { type: string, required: true }

permissions:
  contents: write

run-name: Advance frontend staging ref for v2 train ${{ inputs.release_train_id }} [${{ inputs.operation_key }}]

concurrency:
  group: release-bus-v2-staging-ref-${{ github.repository }}
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable inputs
        env:
          EXPECTED_OLD_SHA: ${{ inputs.expected_old_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          PHASE: ${{ inputs.phase }}
          TRAIN_ID: ${{ inputs.release_train_id }}
          TRAIN_REVISION: ${{ inputs.release_train_revision }}
        run: |
          set -euo pipefail
          [[ "$TRAIN_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$TRAIN_REVISION" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$OPERATION_KEY" =~ ^rb2:[A-Za-z0-9:._-]+:a[1-9][0-9]*$ ]]
          [[ "$EXPECTED_OLD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PHASE" =~ ^(release|rollback)$ ]]

      - name: Authorize exact v2 operation
        id: authorize
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          TRAIN_ID: ${{ inputs.release_train_id }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg train_id "$TRAIN_ID" \
            --arg operation_key "$OPERATION_KEY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg expected_sha "$EXPECTED_SHA" \
            '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,artifact_run_id:null,repository:"frontend",environment:"staging",service:null,expected_sha:$expected_sha,artifact_digest:null}')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/authorize"

      - name: Check out exact target with the workflow token
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Advance exact staging ref
        id: advance
        continue-on-error: true
        env:
          EXPECTED_OLD_SHA: ${{ inputs.expected_old_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/staging-ref-result.json"
          write_result() {
            jq -n \
              --arg status "$1" \
              --arg failure_class "$2" \
              --arg failure_phase "$3" \
              --argjson retryable "$4" \
              --arg expected_old_sha "$EXPECTED_OLD_SHA" \
              --arg release_sha "$EXPECTED_SHA" \
              --arg observed_sha "$5" \
              --arg phase "$PHASE" \
              --argjson changed "$6" \
              '{
                status:$status,
                failure_class:(if $failure_class == "" then null else $failure_class end),
                failure_phase:(if $failure_phase == "" then null else $failure_phase end),
                retryable:$retryable,
                summary:{
                  ref:"1a-staging",
                  phase:$phase,
                  expected_old_sha:$expected_old_sha,
                  release_sha:$release_sha,
                  observed_sha:$observed_sha,
                  changed:$changed
                }
              }' > "$result"
          }

          observed="$(git ls-remote origin refs/heads/1a-staging | cut -f1)"
          if ! [[ "$observed" =~ ^[a-f0-9]{40}$ ]]; then
            write_result FAILED CONTROL_PLANE staging_ref_missing false "$observed" false
            exit 1
          fi

          git fetch --no-tags origin "$EXPECTED_OLD_SHA" "$EXPECTED_SHA"
          if ! git merge-base --is-ancestor "$EXPECTED_OLD_SHA" "$EXPECTED_SHA"; then
            write_result FAILED CONTROL_PLANE staging_ref_non_fast_forward false "$observed" false
            exit 1
          fi

          # The environment lease admits only one staging train, and this
          # repository concurrency group serializes its attempts. Re-observing
          # the exact target is therefore idempotent convergence for this
          # authorized operation, never ownership inferred from unrelated work.
          if [ "$observed" = "$EXPECTED_SHA" ]; then
            write_result SUCCEEDED "" "" false "$observed" false
            exit 0
          fi
          if [ "$observed" != "$EXPECTED_OLD_SHA" ]; then
            write_result FAILED INTERACTION staging_ref_moved false "$observed" false
            exit 1
          fi

          if ! git push \
            --force-with-lease="refs/heads/1a-staging:$EXPECTED_OLD_SHA" \
            origin "$EXPECTED_SHA:refs/heads/1a-staging"
          then
            observed="$(git ls-remote origin refs/heads/1a-staging | cut -f1 || true)"
            if [ "$observed" = "$EXPECTED_SHA" ]; then
              # The push transport was ambiguous, so do not attribute the
              # mutation to this run. Exact target convergence is still safe.
              write_result SUCCEEDED "" "" false "$observed" false
              exit 0
            fi
            if ! [[ "$observed" =~ ^[a-f0-9]{40}$ ]]; then
              write_result FAILED INFRASTRUCTURE staging_ref_transport true "$observed" false
              exit 1
            fi
            if [ "$observed" != "$EXPECTED_OLD_SHA" ]; then
              write_result FAILED INTERACTION staging_ref_moved false "$observed" false
              exit 1
            fi
            write_result FAILED INFRASTRUCTURE staging_ref_transport true "$observed" false
            exit 1
          fi

          observed="$(git ls-remote origin refs/heads/1a-staging | cut -f1)"
          if [ "$observed" != "$EXPECTED_SHA" ]; then
            write_result FAILED INTERACTION staging_ref_postcondition false "$observed" false
            exit 1
          fi
          write_result SUCCEEDED "" "" false "$observed" true

      - name: Report structured terminal result
        id: report
        if: always()
        env:
          ADVANCE_OUTCOME: ${{ steps.advance.outcome }}
          AUTHORIZE_OUTCOME: ${{ steps.authorize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          TRAIN_ID: ${{ inputs.release_train_id }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/staging-ref-result.json"
          if [ ! -s "$result" ]; then
            failure_class=INFRASTRUCTURE
            failure_phase=staging_ref_runner
            retryable=true
            if [ "$AUTHORIZE_OUTCOME" != success ]; then
              failure_class=CONTROL_PLANE
              failure_phase=authorization
              retryable=false
            elif [ "$CHECKOUT_OUTCOME" != success ]; then
              failure_class=CONTROL_PLANE
              failure_phase=checkout
              retryable=false
            fi
            jq -n \
              --arg failure_class "$failure_class" \
              --arg failure_phase "$failure_phase" \
              --argjson retryable "$retryable" \
              '{
              status:"FAILED",
              failure_class:$failure_class,
              failure_phase:$failure_phase,
              retryable:$retryable,
              summary:null
            }' > "$result"
          fi
          status="$(jq -er .status "$result")"
          failure_class="$(jq -r '.failure_class // ""' "$result")"
          failure_phase="$(jq -r '.failure_phase // ""' "$result")"
          retryable="$(jq -er .retryable "$result")"
          summary="$(jq -c .summary "$result")"
          payload="$(jq -n \
            --arg train_id "$TRAIN_ID" \
            --arg operation_key "$OPERATION_KEY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg status "$status" \
            --arg failure_class "$failure_class" \
            --arg failure_phase "$failure_phase" \
            --argjson retryable "$retryable" \
            --argjson summary "$summary" \
            '{train_id:$train_id,operation_key:$operation_key,workflow_run_id:$workflow_run_id,phase:"advance_staging_ref",status:$status,failure_class:(if $failure_class == "" then null else $failure_class end),failure_phase:(if $failure_phase == "" then null else $failure_phase end),retryable:$retryable,summary:$summary,stages:[],jest:null,backend_evidence:null}')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/report-progress"
          test "$ADVANCE_OUTCOME" = success

      - name: Return authoritative ref result
        if: always()
        env:
          ADVANCE_OUTCOME: ${{ steps.advance.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: test "$ADVANCE_OUTCOME" = success -a "$REPORT_OUTCOME" = success
