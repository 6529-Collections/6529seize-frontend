name: Museum publication compatibility

on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact canonical 6529networkmuseum main commit to validate.
        required: true
        type: string
  repository_dispatch:
    types: [museum-publication-main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact canonical 6529networkmuseum main commit; blank resolves current main.
        required: false
        type: string
      run_full_sweep:
        description: Run the deployed broad Museum sweep.
        type: choice
        required: true
        default: "false"
        options: ["false", "true"]
      authorize_hold_clear:
        description: Explicitly allow a passing manual full sweep to clear the Museum hold.
        type: choice
        required: true
        default: "false"
        options: ["false", "true"]

# The source repository's protected main workflow calls this workflow with its
# exact github.sha. This workflow independently confirms that SHA is still the
# canonical source main, then checks out current frontend main before invoking
# the strict publication adapter. A stale caller, moving-main fixture, or
# arbitrary SHA cannot satisfy the bilateral gate.

concurrency:
  group: museum-publication-compatibility
  cancel-in-progress: false

jobs:
  resolve-canonical-source:
    name: Resolve exact canonical Museum source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Resolve and bind canonical source main
        id: source
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit || github.event.client_payload.source_commit || '' }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(
            git ls-remote --refs \
              https://github.com/6529-Collections/6529networkmuseum.git \
              refs/heads/main
          )
          test "${#refs[@]}" -eq 1
          read -r canonical_commit canonical_ref extra <<< "${refs[0]}"
          test -z "${extra:-}"
          test "$canonical_ref" = "refs/heads/main"
          [[ "$canonical_commit" =~ ^[a-f0-9]{40}$ ]]
          if [ -n "$REQUESTED_SOURCE_COMMIT" ]; then
            [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            test "$REQUESTED_SOURCE_COMMIT" = "$canonical_commit"
          fi
          echo "source_commit=$canonical_commit" >> "$GITHUB_OUTPUT"

  strict-adapter:
    name: Current frontend strict adapter accepts exact source
    needs: resolve-canonical-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      frontend_commit: ${{ steps.frontend.outputs.frontend_commit }}
    steps:
      - name: Check out current frontend main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: 6529-Collections/6529seize-frontend
          ref: main
          persist-credentials: false
      - name: Record current frontend adapter commit
        id: frontend
        run: |
          set -euo pipefail
          frontend_commit="$(git rev-parse HEAD)"
          [[ "$frontend_commit" =~ ^[a-f0-9]{40}$ ]]
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-
      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store
      - name: Install frozen dependencies
        run: ./bin/6529 install:frozen
      - name: Validate exact source through the strict adapter
        env:
          FRONTEND_COMMIT: ${{ steps.frontend.outputs.frontend_commit }}
          MUSEUM_PUBLICATION_COMPATIBILITY_COMMIT: ${{ needs.resolve-canonical-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p museum-publication-compatibility-artifacts
          set +e
          ./bin/6529 exec tsx scripts/museum-publication-compatibility.ts \
            --source-commit "$MUSEUM_PUBLICATION_COMPATIBILITY_COMMIT" \
            --output museum-publication-compatibility-artifacts/strict-adapter.json
          adapter_exit=$?
          set -e
          if [ ! -f museum-publication-compatibility-artifacts/strict-adapter.json ]; then
            jq -n \
              --arg contract "museum-publication-compatibility-v1" \
              --arg source_commit "$MUSEUM_PUBLICATION_COMPATIBILITY_COMMIT" \
              --arg error_code "publication_compatibility_runner_failed" \
              "{contract:\$contract,source_commit:\$source_commit,accepted:false,adapter_status:\"unavailable\",adapter_error_code:\$error_code,publication_commit:null}" \
              > museum-publication-compatibility-artifacts/strict-adapter.json
          fi
          jq --arg frontend_commit "$FRONTEND_COMMIT" \
            ". + {frontend_commit:\$frontend_commit}" \
            museum-publication-compatibility-artifacts/strict-adapter.json \
            > museum-publication-compatibility-artifacts/strict-adapter.tmp.json
          mv museum-publication-compatibility-artifacts/strict-adapter.tmp.json \
            museum-publication-compatibility-artifacts/strict-adapter.json
          exit "$adapter_exit"
      - name: Upload strict-adapter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: museum-publication-compatibility-${{ github.run_id }}
          path: museum-publication-compatibility-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  deployed-broad-sweep:
    name: Nightly deployed Museum broad sweep
    needs: [resolve-canonical-source, strict-adapter]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_sweep == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sweep_outcome: ${{ steps.sweep.outcome }}
    steps:
      - name: Check out current frontend main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: 6529-Collections/6529seize-frontend
          ref: main
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-
      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store
      - name: Install frozen dependencies
        run: ./bin/6529 install:frozen
      - name: Run complete read-only production Museum sweep
        id: sweep
        continue-on-error: true
        env:
          MUSEUM_PUBLICATION_EXPECTED_COMMIT: ${{ needs.resolve-canonical-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          ./bin/6529 run e2e:packs -- \
            --env production \
            --trigger cron \
            --pack museum-institutional-practice \
            --artifact-root museum-release-baseline-artifacts
      - name: Upload broad-sweep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: museum-release-baseline-${{ github.run_id }}
          path: museum-release-baseline-artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Return broad sweep result
        if: always()
        env:
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
        run: test "$SWEEP_OUTCOME" = success

  record-museum-hold:
    name: Set or clear auditable Release Bus Museum hold
    needs: [resolve-canonical-source, strict-adapter, deployed-broad-sweep]
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_full_sweep == 'true' && inputs.authorize_hold_clear == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record auditable Museum hold state
        env:
          ADAPTER_RESULT: ${{ needs.strict-adapter.result }}
          FRONTEND_COMMIT: ${{ needs.strict-adapter.outputs.frontend_commit }}
          FRONTEND_REPOSITORY: 6529-Collections/6529seize-frontend
          SOURCE_COMMIT: ${{ needs.resolve-canonical-source.outputs.source_commit }}
          SWEEP_OUTCOME: ${{ needs.deployed-broad-sweep.outputs.sweep_outcome }}
          SWEEP_RESULT: ${{ needs.deployed-broad-sweep.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hold_label="release-bus-museum-hold"
          hold_title="[Release Bus] Museum qualification hold"
          marker="<!-- release-bus-museum-hold:v1 -->"
          mkdir -p museum-release-hold-artifacts

          labels="$(gh label list --repo "$FRONTEND_REPOSITORY" --search "$hold_label" --limit 100 --json name)"
          if ! jq -e --arg label "$hold_label" ".[] | select(.name == \$label)" <<< "$labels" >/dev/null; then
            gh label create "$hold_label" \
              --repo "$FRONTEND_REPOSITORY" \
              --color B60205 \
              --description "Automated Release Bus Museum qualification hold" \
              --force
          fi

          open_issues="$(gh issue list \
            --repo "$FRONTEND_REPOSITORY" \
            --state open \
            --label "$hold_label" \
            --limit 100 \
            --json number,title,body,author)"
          managed_issues="$(
            # shellcheck disable=SC2016
            jq -c \
            --arg title "$hold_title" \
            --arg marker "$marker" \
            "[.[] | select(.title == \$title and (.body | contains(\$marker)) and .author.login == \"github-actions[bot]\")]" \
            <<< "$open_issues"
          )"
          foreign_issues="$(
            # shellcheck disable=SC2016
            jq -c \
            --arg title "$hold_title" \
            --arg marker "$marker" \
            '[.[] | select(.title != $title or (.body | contains($marker) | not) or .author.login != "github-actions[bot]") ]' \
            <<< "$open_issues"
          )"

          sweep_passed=false
          if [ "$ADAPTER_RESULT" = success ] && \
            [ "$SWEEP_RESULT" = success ] && \
            [ "$SWEEP_OUTCOME" = success ]
          then
            sweep_passed=true
          fi

          state=""
          refuse_clear=false
          if [ "$sweep_passed" = true ]; then
            if [ "$(jq 'length' <<< "$foreign_issues")" -ne 0 ]; then
              echo "A foreign Museum-hold issue is open; refusing to clear it." >&2
              refuse_clear=true
              state="clear_refused_foreign_issue"
            else
              while IFS= read -r issue_number; do
                [ -z "$issue_number" ] && continue
                gh issue close "$issue_number" \
                  --repo "$FRONTEND_REPOSITORY" \
                  --comment "${marker} Authorized exact-source adapter and broad sweep passed for ${SOURCE_COMMIT}; clearing automated Museum hold."
              done < <(jq -r '.[].number' <<< "$managed_issues")
              state="cleared"
            fi
          else
            body="$(printf "%s\n\n%s\n\n- Canonical source commit: \`%s\`\n- Frontend strict adapter commit: \`%s\`\n- Strict adapter result: \`%s\`\n- Broad sweep result: \`%s/%s\`\n- Workflow run: %s/%s/actions/runs/%s" \
              "$marker" \
              "The authorized Museum compatibility sweep did not pass, so Release Bus Museum tier activation must use the complete pack inventory until an authorized sweep clears this hold." \
              "$SOURCE_COMMIT" \
              "${FRONTEND_COMMIT:-unavailable}" \
              "$ADAPTER_RESULT" \
              "$SWEEP_RESULT" \
              "$SWEEP_OUTCOME" \
              "$GITHUB_SERVER_URL" \
              "$FRONTEND_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            existing_numbers="$(jq -r '.[].number' <<< "$managed_issues")"
            if [ -n "$existing_numbers" ]; then
              while IFS= read -r issue_number; do
                [ -z "$issue_number" ] && continue
                gh issue comment "$issue_number" \
                  --repo "$FRONTEND_REPOSITORY" \
                  --body "${marker} Sweep remains failing for ${SOURCE_COMMIT}: adapter=${ADAPTER_RESULT}, broad=${SWEEP_RESULT}/${SWEEP_OUTCOME}."
              done <<< "$existing_numbers"
            else
              gh issue create \
                --repo "$FRONTEND_REPOSITORY" \
                --title "$hold_title" \
                --label "$hold_label" \
                --body "$body"
            fi
            state="set"
          fi

          # shellcheck disable=SC2016
          jq -n \
            --arg adapter_result "$ADAPTER_RESULT" \
            --arg contract "release-bus-museum-hold.v1" \
            --arg frontend_commit "$FRONTEND_COMMIT" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg state "$state" \
            --arg sweep_outcome "$SWEEP_OUTCOME" \
            --arg sweep_result "$SWEEP_RESULT" \
            '{contract:$contract,state:$state,source_commit:$source_commit,frontend_commit:$frontend_commit,adapter_result:$adapter_result,sweep_result:$sweep_result,sweep_outcome:$sweep_outcome}' \
            > museum-release-hold-artifacts/hold.json
          if [ "$sweep_passed" != true ] || [ "$refuse_clear" = true ]; then
            exit 1
          fi
      - name: Upload Museum hold evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: museum-release-hold-${{ github.run_id }}
          path: museum-release-hold-artifacts/
          if-no-files-found: ignore
          retention-days: 30
