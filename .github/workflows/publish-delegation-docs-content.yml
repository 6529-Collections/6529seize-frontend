name: Publish Delegation Docs Content

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and receipt the bundle without publishing to IPFS"
        required: true
        default: true
        type: boolean
      skip_gateway_verify:
        description: "Skip post-publish verification through the configured IPFS gateway"
        required: true
        default: false
        type: boolean
      skip_cdn_sync:
        description: "Skip optional S3/CloudFront acceleration mirror sync"
        required: true
        default: false
        type: boolean
      version:
        description: "Delegation docs package version"
        required: true
        default: "delegation-docs-2026-10-15"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: delegation-docs
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    env:
      DELEGATION_DOCS_VERSION: ${{ inputs.version }}
      DELEGATION_DOCS_IPFS_GATEWAY_BASE_URL: ${{ vars.DELEGATION_DOCS_IPFS_GATEWAY_BASE_URL }}
      DELEGATION_DOCS_CDN_S3_URI: ${{ vars.DELEGATION_DOCS_CDN_S3_URI }}
      DELEGATION_DOCS_CDN_BASE_URL: ${{ vars.DELEGATION_DOCS_CDN_BASE_URL }}

    steps:
      - name: Validate CDN deployment role
        id: deploy_role
        if: ${{ inputs.skip_cdn_sync == false && startsWith(vars.DELEGATION_DOCS_CDN_S3_URI, 's3://') }}
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CDN_AWS_REGION: ${{ vars.DELEGATION_DOCS_CDN_AWS_REGION || 'eu-west-1' }}
        run: |
          if ! [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9_+=,.@/-]+$ ]]; then
            echo "::error::Configure a valid AWS_DEPLOY_ROLE_ARN in the delegation-docs environment"
            exit 1
          fi
          account_id="${BASH_REMATCH[1]}"
          if [ "$CDN_AWS_REGION" != "eu-west-1" ] || [ "$DELEGATION_DOCS_CDN_S3_URI" != 's3://6529bucket/delegation-content/{cid}' ]; then
            echo "::error::The CDN configuration must match the scoped delegation-docs role"
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Install Socket Firewall
        id: socket_firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        run: ./bin/6529 run guard:no-package-lock

      - name: Install dependencies
        env:
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 ci

      - name: Configure AWS credentials for optional CDN sync
        id: aws_credentials
        if: ${{ inputs.skip_cdn_sync == false && startsWith(vars.DELEGATION_DOCS_CDN_S3_URI, 's3://') }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ steps.deploy_role.outputs.account_id }}
          role-session-name: frontend-docs-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          aws-region: eu-west-1

      - name: Verify scoped CDN access
        if: ${{ inputs.skip_cdn_sync == false && startsWith(vars.DELEGATION_DOCS_CDN_S3_URI, 's3://') }}
        env:
          AUTH_OUTCOME: ${{ steps.aws_credentials.outcome }}
        run: |
          test "$AUTH_OUTCOME" = "success"
          aws s3api get-bucket-location --bucket 6529bucket --region eu-west-1 --query LocationConstraint
          aws s3api list-objects-v2 --bucket 6529bucket --prefix delegation-content/ --max-keys 1 --region eu-west-1 --query KeyCount

      - name: Publish delegation docs package
        env:
          DELEGATION_DOCS_IPFS_API_ENDPOINT: ${{ secrets.DELEGATION_DOCS_IPFS_API_ENDPOINT }}
          DELEGATION_DOCS_IPFS_API_BEARER_TOKEN: ${{ secrets.DELEGATION_DOCS_IPFS_API_BEARER_TOKEN }}
          DELEGATION_DOCS_IPFS_API_AUTH_HEADER: ${{ secrets.DELEGATION_DOCS_IPFS_API_AUTH_HEADER }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_GATEWAY_VERIFY: ${{ inputs.skip_gateway_verify }}
          INPUT_SKIP_CDN_SYNC: ${{ inputs.skip_cdn_sync }}
        run: |
          args=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$INPUT_SKIP_GATEWAY_VERIFY" = "true" ]; then
            args+=(--skip-gateway-verify)
          fi
          if [ "$INPUT_SKIP_CDN_SYNC" = "true" ]; then
            args+=(--skip-cdn-sync)
          fi
          node ops/scripts/publish-delegation-docs-content.mjs "${args[@]}"

      - name: Upload publish receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delegation-docs-ipfs-receipt
          path: tmp/delegation-docs-publish/*.json
