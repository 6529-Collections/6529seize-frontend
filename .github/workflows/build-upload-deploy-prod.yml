name: Web Deploy - PROD

on:
  workflow_dispatch:
    inputs:
      release_note_opt_out:
        description: Suppress autonomous release notes only when explicitly requested by the user
        type: boolean
        required: false
        default: false

run-name: Production deploy ${{ github.sha }}

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: web-deploy-prod
  cancel-in-progress: false

env:
  AWS_BUCKET: "seize-web"
  COMMIT_SHA: "${{ github.sha }}"
  AWS_REGION: "us-east-1"
  BEANSTALK_APP_NAME: "seize app"
  BEANSTALK_ENV_NAME: "seizeapp-env-node22"
  ANNOUNCED_VERSION_OBJECT_KEY: "web_build/current-production-version.json"
  ANNOUNCED_VERSION_ENDPOINT: "https://dnclu2fna0b2b.cloudfront.net/web_build/current-production-version.json"

jobs:
  build-production-artifact:
    name: Build exact production artifact
    uses: ./.github/workflows/production-build-artifact.yml
    with:
      target_sha: ${{ github.sha }}
    secrets:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      AWS_RUM_APP_ID: ${{ secrets.AWS_RUM_APP_ID }}
      AWS_RUM_REGION: ${{ secrets.AWS_RUM_REGION }}
      AWS_RUM_SAMPLE_RATE: ${{ secrets.AWS_RUM_SAMPLE_RATE }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  resolve-production-artifact:
    name: Resolve production artifact metadata
    needs: build-production-artifact
    uses: ./.github/workflows/production-artifact-metadata.yml

  verify-production-artifact:
    name: Verify exact production artifact
    permissions:
      actions: read
      contents: read
    needs: resolve-production-artifact
    uses: ./.github/workflows/production-artifact-verifier.yml
    with:
      target_sha: ${{ github.sha }}
      artifact_run_id: ${{ github.run_id }}
      artifact_run_attempt: ${{ needs.resolve-production-artifact.outputs.producer_run_attempt }}
      artifact_id: ${{ needs.resolve-production-artifact.outputs.artifact_id }}
      artifact_digest: ${{ needs.resolve-production-artifact.outputs.artifact_digest }}
      artifact_name: production-frontend-${{ github.sha }}-${{ github.run_id }}
      artifact_workflow_sha: ${{ github.sha }}

  build-upload-deploy:
    name: Deploy verified production artifact
    needs:
      [
        build-production-artifact,
        resolve-production-artifact,
        verify-production-artifact,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      deployments: write
    environment: production

    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the canonical production entry point
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: Download exact production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: production-frontend-${{ github.sha }}-${{ github.run_id }}
          path: production-artifact

      - name: Independently verify selected production bytes
        env:
          ARTIFACT_NAME: production-frontend-${{ github.sha }}-${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.resolve-production-artifact.outputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          VERIFIER_PACKAGE_SHA256: ${{ needs.verify-production-artifact.outputs.package_sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd production-artifact && sha256sum -c SHA256SUMS)
          unzip -t production-artifact/target/package.zip >/dev/null
          jq -e \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg target_sha "$COMMIT_SHA" \
            --arg workflow_sha "$WORKFLOW_SHA" '
              .schema_version == 1 and
              .artifact_contract == "production-deployment-v1" and
              .repository == "frontend" and
              .environment == "production" and
              .artifact_name == $artifact_name and
              .target_sha == $target_sha and
              .source_sha == $target_sha and
              .workflow_sha == $workflow_sha and
              (.workflow_run_id | tostring) == $run_id and
              .run_attempt == $run_attempt and
              (.protected_main_sha | test("^[a-f0-9]{40}$")) and
              (.package_sha256 | test("^[a-f0-9]{64}$"))
            ' production-artifact/manifest.json >/dev/null
          package_digest="$(sha256sum production-artifact/target/package.zip | cut -d' ' -f1)"
          test "$package_digest" = "$VERIFIER_PACKAGE_SHA256"
          test "$package_digest" = "$(jq -r .package_sha256 production-artifact/manifest.json)"
          jq -e \
            --arg source_sha "$COMMIT_SHA" \
            --arg package_sha256 "$package_digest" '
              .schema_version == "artifact-portability.v1" and
              .contract == "artifact-portability-v1" and
              .environment == "production" and
              .source.git_sha == $source_sha and
              .digests.package_sha256 == $package_sha256 and
              .portability.status == "NOT_PORTABLE" and
              .portability.portable == false and
              .portability.reuse_authorized == false and
              .portability.promotion_authorized == false
            ' production-artifact/artifact-portability.json >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refuse stale main or production downgrade
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "$current_main_sha"; then
            echo "::error::Selected production SHA $COMMIT_SHA is no longer in current main history at $current_main_sha."
            exit 1
          fi

          current_version="$(aws elasticbeanstalk describe-environments \
            --environment-names "$BEANSTALK_ENV_NAME" \
            --query 'Environments[0].VersionLabel' \
            --output text)"
          if ! [[ "$current_version" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Current production version '$current_version' is not an exact commit SHA; refusing deployment."
            exit 1
          fi
          git cat-file -e "${current_version}^{commit}"
          if ! git merge-base --is-ancestor "$current_version" "$COMMIT_SHA"; then
            echo "::error::Target $COMMIT_SHA is older than or unrelated to deployed production $current_version; refusing downgrade."
            exit 1
          fi
          echo "Production $current_version can advance safely to $COMMIT_SHA."

      - name: Upload verified assets to S3
        run: aws s3 sync production-artifact/target "s3://${AWS_BUCKET}/web_build/${COMMIT_SHA}/"

      - name: Get commit message
        run: printf 'COMMIT_MESSAGE=%s\n' "$(git show -s --format=%s "$COMMIT_SHA")" >> "$GITHUB_ENV"

      - name: Ensure Elastic Beanstalk application version
        run: |
          set -euo pipefail
          source_bundle_key="web_build/${COMMIT_SHA}/package.zip"
          application_version_json="$(aws elasticbeanstalk describe-application-versions \
            --application-name "$BEANSTALK_APP_NAME" \
            --version-labels "$COMMIT_SHA" \
            --output json)"
          version_count="$(jq '.ApplicationVersions | length' <<< "$application_version_json")"
          case "$version_count" in
            0)
              aws elasticbeanstalk create-application-version \
                --application-name "$BEANSTALK_APP_NAME" \
                --source-bundle "S3Bucket=${AWS_BUCKET},S3Key=${source_bundle_key}" \
                --version-label "$COMMIT_SHA" \
                --description "$COMMIT_MESSAGE"
              ;;
            1)
              existing_bucket="$(jq -r '.ApplicationVersions[0].SourceBundle.S3Bucket // ""' <<< "$application_version_json")"
              existing_key="$(jq -r '.ApplicationVersions[0].SourceBundle.S3Key // ""' <<< "$application_version_json")"
              test "$existing_bucket" = "$AWS_BUCKET"
              test "$existing_key" = "$source_bundle_key"
              ;;
            *)
              echo "::error::Expected at most one Elastic Beanstalk version for $COMMIT_SHA, found $version_count."
              exit 1
              ;;
          esac

      - name: Deploy new version to Elastic Beanstalk
        env:
          SSR_CLIENT_ID: ${{ secrets.SSR_CLIENT_ID }}
          SSR_CLIENT_SECRET: ${{ secrets.SSR_CLIENT_SECRET }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_LINK_STATUS_PREVIEW_TOKEN: ${{ secrets.LINK_STATUS_PREVIEW_GITHUB_TOKEN }}
          PUBLIC_REVIEW_DISCUSSION_DESTINATIONS: ${{ secrets.PUBLIC_REVIEW_PRODUCTION_DISCUSSION_DESTINATIONS }}
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            keys == ["production"] and
            (.production | type == "object") and
            (.production["stream-review"] | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
          ' <<< "$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" >/dev/null
          option_settings="$(jq -cn \
            --arg ssr_client_id "$SSR_CLIENT_ID" \
            --arg ssr_client_secret "$SSR_CLIENT_SECRET" \
            --arg alchemy_api_key "$ALCHEMY_API_KEY" \
            --arg github_link_status_preview_token "$GITHUB_LINK_STATUS_PREVIEW_TOKEN" \
            --arg public_review_discussion_destinations "$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" '
              [
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_ID",Value:$ssr_client_id},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_SECRET",Value:$ssr_client_secret},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"ALCHEMY_API_KEY",Value:$alchemy_api_key},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"GITHUB_LINK_STATUS_PREVIEW_TOKEN",Value:$github_link_status_preview_token},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"PUBLIC_REVIEW_DISCUSSION_DESTINATIONS",Value:$public_review_discussion_destinations},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SENTRY_SERVER_INSTRUMENTATION",Value:"false"}
              ]')"
          aws elasticbeanstalk update-environment \
            --application-name "$BEANSTALK_APP_NAME" \
            --environment-name "$BEANSTALK_ENV_NAME" \
            --version-label "$COMMIT_SHA" \
            --option-settings "$option_settings"

      - name: Check Elastic Beanstalk health and readiness
        run: |
          set -euo pipefail
          node ops/scripts/elastic-beanstalk-readiness.cjs \
            --environment-name "$BEANSTALK_ENV_NAME" \
            --expected-version "$COMMIT_SHA" \
            --timeout-seconds 1320 \
            --output elastic-beanstalk-readiness.json

      - name: Upload Elastic Beanstalk readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-elastic-beanstalk-readiness-${{ github.run_id }}
          path: elastic-beanstalk-readiness.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify exact deployed version
        run: |
          set -euo pipefail
          deployed_version="$(aws elasticbeanstalk describe-environments \
            --environment-names "$BEANSTALK_ENV_NAME" \
            --query 'Environments[0].VersionLabel' \
            --output text)"
          test "$deployed_version" = "$COMMIT_SHA"
          node ops/scripts/verify-deployment-version.cjs \
            --base-url https://6529.io \
            --expected-version "$COMMIT_SHA" \
            --attempts 12 \
            --required-matches 3 \
            --delay-ms 10000 \
            --timeout-ms 10000 \
            --output deployment-version-evidence.json

      - name: Publish announced production version
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current_version="$(aws elasticbeanstalk describe-environments \
            --environment-names "$BEANSTALK_ENV_NAME" \
            --query 'Environments[0].VersionLabel' \
            --output text)"
          if [ "$current_version" != "$COMMIT_SHA" ]; then
            echo "::error::Production advanced to $current_version before the version announcement; refusing to overwrite it with $COMMIT_SHA."
            exit 1
          fi

          announcement_file="current-production-version.json"
          published_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          announced_host="$(node -e 'process.stdout.write(new URL(process.env.ANNOUNCED_VERSION_ENDPOINT).hostname)')"
          jq -n \
            --arg version "$COMMIT_SHA" \
            --arg published_at "$published_at" \
            --arg workflow_run_url "$RUN_URL" \
            '{schema_version:"frontend-announced-version.v1",environment:"production",version:$version,ready:true,published_at:$published_at,workflow_run_url:$workflow_run_url}' \
            > "$announcement_file"
          aws s3 cp "$announcement_file" "s3://${AWS_BUCKET}/${ANNOUNCED_VERSION_OBJECT_KEY}" \
            --cache-control "no-store, max-age=0, must-revalidate" \
            --content-type "application/json"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${announced_host}' || contains(Aliases.Items || \`[]\`, '${announced_host}')].Id | [0]" \
            --output text)"
          if [ -n "$distribution_id" ] && [ "$distribution_id" != None ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$distribution_id" \
              --paths "/${ANNOUNCED_VERSION_OBJECT_KEY}" || true
          fi

      - name: Upload exact production version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-version-evidence-${{ github.run_id }}
          path: deployment-version-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  notify-production-deployment:
    name: Notify production deployment outcome
    if: always()
    needs:
      - build-production-artifact
      - resolve-production-artifact
      - verify-production-artifact
      - build-upload-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out CI wave notifier
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .ci-wave-notifier
          sparse-checkout: scripts/notify-ci-wave.mjs
          sparse-checkout-cone-mode: false

      - name: Notify CI wave about failure
        if: >-
          (needs.build-production-artifact.result != 'success' ||
          needs.resolve-production-artifact.result != 'success' ||
          needs.verify-production-artifact.result != 'success' ||
          needs.build-upload-deploy.result != 'success') &&
          hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_ALERT_TYPE: deploy
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: failure
          CI_PIPELINES_TITLE: "WEB deploy failed"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ github.sha }}
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs

      - name: Notify CI wave about success
        if: >-
          needs.build-production-artifact.result == 'success' &&
          needs.resolve-production-artifact.result == 'success' &&
          needs.verify-production-artifact.result == 'success' &&
          needs.build-upload-deploy.result == 'success' &&
          hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_ALERT_TYPE: deploy
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: success
          CI_PIPELINES_TITLE: "WEB deploy complete"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ github.sha }}
          CI_RELEASE_NOTES_PROMPT_PATH: ops/release-notes/release-notes.prompt.md
          CI_RELEASE_NOTE_OPT_OUT: ${{ inputs.release_note_opt_out }}
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs
