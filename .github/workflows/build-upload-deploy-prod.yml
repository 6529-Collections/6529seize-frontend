name: Web Deploy - PROD

on:
  workflow_dispatch:
    inputs:
      deploy_hub_operation_id:
        description: Deploy Hub correlation id; leave empty for manual fallback
        type: string
        required: false
        default: ""
      deploy_hub_controller_operation_id:
        description: Deploy Hub controller operation id
        type: string
        required: false
        default: ""
      allow_rollback:
        description: Explicitly allow deploying behind the current production SHA
        type: boolean
        required: false
        default: false

run-name: ${{ inputs.deploy_hub_operation_id != '' && format('Deploy Hub {0} — production', inputs.deploy_hub_operation_id) || 'Manual production deploy' }}

permissions:
  contents: read

concurrency:
  group: web-deploy-prod
  cancel-in-progress: false

env:
  AWS_BUCKET: "seize-web"
  COMMIT_SHA: "${{ github.sha }}"
  AWS_REGION: "us-east-1"
  BEANSTALK_APP_NAME: "seize app"
  BEANSTALK_ENV_NAME: "seizeapp-env-node22"
  API_ENDPOINT: "https://api.6529.io"
  WS_ENDPOINT: "wss://ws.6529.io"
  ALLOWLIST_API_ENDPOINT: "https://allowlist-api.6529.io"
  BASE_ENDPOINT: "https://6529.io"
  NEXTGEN_CHAIN_ID: "1"
  MOBILE_APP_SCHEME: "mobile6529"
  CORE_SCHEME: "core6529"
  IPFS_API_ENDPOINT: "https://api-ipfs.6529.io"
  IPFS_GATEWAY_ENDPOINT: "https://ipfs.6529.io"
  ASSETS_FROM_S3: "true"
  ANNOUNCED_VERSION_OBJECT_KEY: "web_build/current-production-version.json"
  ANNOUNCED_VERSION_ENDPOINT: "https://dnclu2fna0b2b.cloudfront.net/web_build/current-production-version.json"

jobs:
  manual-deployment-guard:
    name: Authorize manual production fallback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require authoritative production fallback readiness
        env:
          DEPLOY_HUB_BASE_REF: ${{ github.event.repository.default_branch }}
          DEPLOY_HUB_CONTROLLER_OPERATION_ID: ${{ inputs.deploy_hub_controller_operation_id }}
          DEPLOY_HUB_OPERATION_ID: ${{ inputs.deploy_hub_operation_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          TARGET_ENVIRONMENT: prod
          TARGET_LANE: PRODUCTION
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_HUB_OPERATION_ID:-}" ]; then
            test "$GITHUB_ACTOR" = "github-actions[bot]"
            [[ "$DEPLOY_HUB_OPERATION_ID" =~ ^dh-([1-9][0-9]{0,19})r[1-9][0-9]{0,8}-c[1-9][0-9]*-production-a[12]$ ]]
            controller_run_id="${BASH_REMATCH[1]}"
            controller_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id")"
            jq -e \
              --arg branch "$DEPLOY_HUB_BASE_REF" \
              --arg display_title "Deploy Hub $DEPLOY_HUB_CONTROLLER_OPERATION_ID — production continuation" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow ".github/workflows/deploy-hub-production.yml" \
              '.path == $workflow and .event == "workflow_dispatch" and .head_branch == $branch and .head_repository.full_name == $repository and .display_title == $display_title' \
              <<< "$controller_run" >/dev/null
            [[ "$DEPLOY_HUB_CONTROLLER_OPERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
            target_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")"
            jq -e \
              --arg operation "$DEPLOY_HUB_CONTROLLER_OPERATION_ID" \
              --arg sha "$GITHUB_SHA" \
              '.sha == $sha and (.commit.message | split("\n")[0] | startswith("Deploy Hub " + $operation + ":"))' \
              <<< "$target_commit" >/dev/null
            exit 0
          fi

          test -n "$RELEASE_BUS_API_URL" || {
            echo "::error::Release Bus API URL is unavailable; refusing manual production deployment."
            exit 1
          }
          test -n "$RELEASE_BUS_WORKFLOW_AUTH_TOKEN" || {
            echo "::error::Release Bus workflow credential is unavailable; refusing manual production deployment."
            exit 1
          }
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::GitHub run identity is malformed; refusing manual production deployment."
            exit 1
          }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]] || {
            echo "::error::GitHub run attempt is malformed; refusing manual production deployment."
            exit 1
          }
          [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9._/-]{1,255}$ ]] || {
            echo "::error::GitHub source ref is malformed; refusing manual production deployment."
            exit 1
          }
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::GitHub source SHA is malformed; refusing manual production deployment."
            exit 1
          }

          payload="$(
            jq -n \
              --arg repository frontend \
              --arg environment "$TARGET_ENVIRONMENT" \
              --arg service frontend \
              --arg workflow_run_id "$GITHUB_RUN_ID" \
              --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg source_ref "$GITHUB_REF_NAME" \
              --arg source_sha "$GITHUB_SHA" \
              '{repository:$repository,environment:$environment,service:$service,workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,source_ref:$source_ref,source_sha:$source_sha}'
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! http_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$RELEASE_BUS_API_URL/deploy/release-bus-v2/manual-deployment-readiness"
          )"; then
            echo "::error::Release Bus readiness is unavailable; refusing manual production deployment."
            exit 1
          fi
          if [ "$http_status" != 200 ]; then
            echo "::error::Manual production fallback readiness was rejected with HTTP $http_status."
            exit 1
          fi
          if ! jq -e \
            --arg repository frontend \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg service frontend \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_ref "$GITHUB_REF_NAME" \
            --arg source_sha "$GITHUB_SHA" \
            --arg lane "$TARGET_LANE" \
            'type == "object" and
             .ready == true and
             .mode == "manual" and
             .lane == $lane and
             .repository == $repository and
             .environment == $environment and
             .service == $service and
             (.workflow_run_id | tostring) == $workflow_run_id and
             (.workflow_run_attempt | tostring) == $workflow_run_attempt and
             .source_ref == $source_ref and
             .source_sha == $source_sha' \
            "$response_file" >/dev/null; then
            echo "::error::Release Bus returned malformed or mismatched readiness evidence; refusing manual production deployment."
            exit 1
          fi

  assert-main-ref:
    name: Assert main ref
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Assert production deploy runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must be run from the main branch. Selected ref: ${GITHUB_REF_NAME} (${GITHUB_SHA})."
            exit 1
          fi

  build-upload-deploy:
    needs: [assert-main-ref, manual-deployment-guard]
    runs-on: ${{ vars.PRODUCTION_BUILD_RUNNER || vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create deployment bus manifest
        run: |
          set -euo pipefail

          node ops/scripts/deployment-bus.cjs create-manifest \
            --environment production \
            --production-candidate-sha "${COMMIT_SHA}" \
            --production-eligible true \
            --required-packs "playwright:core-smoke,playwright:surface-matrix,playwright:wcag-i18n" \
            --release-captain "github-actions/${{ github.actor }}" \
            --status queued \
            --phase queued \
            --message "Production deployment queued for ${COMMIT_SHA}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output deployment-bus-manifest.json

      - name: Create GitHub deployment record
        id: deployment-record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deployment_id="$(node ops/scripts/deployment-bus.cjs github-create-deployment \
            --file deployment-bus-manifest.json \
            --ref "${COMMIT_SHA}" \
            --environment production \
            --task deploy:production \
            --description "Production deployment bus ${COMMIT_SHA}")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Mark production deployment queued
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          node ops/scripts/deployment-bus.cjs github-create-status \
            --deployment-id "${{ steps.deployment-record.outputs.deployment_id }}" \
            --state queued \
            --description "Production deployment bus queued" \
            --environment-url "https://6529.io" \
            --log-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Locate successful exact production prebuild
        id: production-artifact
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ env.COMMIT_SHA }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          artifact_name="production-frontend-${EXPECTED_SHA}"
          artifact_json=''
          for attempt in $(seq 1 12); do
            artifact_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
            run_id="$(jq -er --arg sha "$EXPECTED_SHA" '
              [.artifacts[] |
                select(.expired == false and .workflow_run.head_sha == $sha)] |
              sort_by(.created_at) | last | .workflow_run.id // empty
            ' <<< "$artifact_json" 2>/dev/null || true)"
            if [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]; then
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              if jq -e --arg sha "$EXPECTED_SHA" '
                .path == ".github/workflows/production-build-artifact.yml" and
                (.event == "push" or .event == "workflow_dispatch") and
                .conclusion == "success" and
                .head_branch == "main" and
                .head_sha == $sha
              ' <<< "$run_json" >/dev/null; then
                artifact_id="$(jq -er --arg sha "$EXPECTED_SHA" '
                  [.artifacts[] |
                    select(.expired == false and .workflow_run.head_sha == $sha)] |
                  sort_by(.created_at) | last | .id
                ' <<< "$artifact_json")"
                [[ "$artifact_id" =~ ^[1-9][0-9]{0,19}$ ]]
                echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
                echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 20; fi
          done
          echo "::error::No successful exact production prebuild is available for $EXPECTED_SHA."
          exit 1

      - name: Download exact production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.production-artifact.outputs.name }}
          path: production-artifact
          run-id: ${{ steps.production-artifact.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify exact production artifact
        env:
          EXPECTED_SHA: ${{ env.COMMIT_SHA }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -f production-artifact/manifest.json
          test -f production-artifact/SHA256SUMS
          test -f production-artifact/target/package.zip
          (cd production-artifact && sha256sum -c SHA256SUMS)
          jq -e --arg source_sha "$EXPECTED_SHA" '
            .schema_version == 1 and
            .artifact_contract == "production-prebuild-v1" and
            .repository == "frontend" and
            .source_sha == $source_sha and
            .environment == "production" and
            (.package_sha256 | test("^[a-f0-9]{64}$")) and
            (.build_timestamp | type == "string" and length >= 20)
          ' production-artifact/manifest.json >/dev/null
          package_digest="$(sha256sum production-artifact/target/package.zip | cut -d' ' -f1)"
          test "$package_digest" = "$(jq -r .package_sha256 production-artifact/manifest.json)"
          package_size="$(stat -c%s production-artifact/target/package.zip)"
          test "$package_size" -le $((500 * 1024 * 1024))

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm frozen production candidate remains safe
        env:
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          current_production_sha="$(aws elasticbeanstalk describe-environments \
            --application-name "${BEANSTALK_APP_NAME}" \
            --environment-names "${BEANSTALK_ENV_NAME}" \
            --query 'Environments[0].VersionLabel' \
            --output text)"
          node ops/scripts/deployment-bus.cjs production-preflight \
            --file deployment-bus-manifest.json \
            --current-main-sha "$latest_main_sha" \
            --current-production-sha "$current_production_sha" \
            --allow-rollback "${ALLOW_ROLLBACK:-false}" \
            --remote origin \
            --branch main

      - name: Upload assets to S3
        run: aws s3 sync production-artifact/target "s3://${AWS_BUCKET}/web_build/${COMMIT_SHA}/"

      - name: Get commit message
        run: printf 'COMMIT_MESSAGE=%s\n' "$(git show -s --format=%s)" >> "$GITHUB_ENV"

      - name: Mark production deployment in progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          node ops/scripts/deployment-bus.cjs github-create-status \
            --deployment-id "${{ steps.deployment-record.outputs.deployment_id }}" \
            --state in_progress \
            --description "Production Elastic Beanstalk deployment starting" \
            --environment-url "https://6529.io" \
            --log-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Ensure ElasticBeanstalk Application Version
        run: |
          set -euo pipefail

          SOURCE_BUNDLE_KEY="web_build/${COMMIT_SHA}/package.zip"

          create_application_version() {
            aws elasticbeanstalk create-application-version \
              --application-name "${BEANSTALK_APP_NAME}" \
              --source-bundle "S3Bucket=${AWS_BUCKET},S3Key=${SOURCE_BUNDLE_KEY}" \
              --version-label "${COMMIT_SHA}" \
              --description "${COMMIT_MESSAGE}"
          }

          APPLICATION_VERSION_JSON=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${BEANSTALK_APP_NAME}" \
            --version-labels "${COMMIT_SHA}" \
            --output json)
          VERSION_COUNT=$(jq '.ApplicationVersions | length' <<< "$APPLICATION_VERSION_JSON")

          case "$VERSION_COUNT" in
            0)
              echo "Creating Elastic Beanstalk application version ${COMMIT_SHA}."
              create_application_version
              ;;
            1)
              EXISTING_BUCKET=$(jq -r '.ApplicationVersions[0].SourceBundle.S3Bucket // ""' <<< "$APPLICATION_VERSION_JSON")
              EXISTING_KEY=$(jq -r '.ApplicationVersions[0].SourceBundle.S3Key // ""' <<< "$APPLICATION_VERSION_JSON")

              if [ "$EXISTING_BUCKET" = "$AWS_BUCKET" ] && [ "$EXISTING_KEY" = "$SOURCE_BUNDLE_KEY" ]; then
                echo "Elastic Beanstalk application version ${COMMIT_SHA} already exists with the expected source bundle; reusing it."
              else
                echo "::error::Elastic Beanstalk application version ${COMMIT_SHA} already exists with unexpected source s3://${EXISTING_BUCKET}/${EXISTING_KEY}; expected s3://${AWS_BUCKET}/${SOURCE_BUNDLE_KEY}. Refusing to replace an unexpected production version label automatically."
                exit 1
              fi
              ;;
            *)
              echo "::error::Expected at most one Elastic Beanstalk application version for ${COMMIT_SHA}, found ${VERSION_COUNT}."
              exit 1
              ;;
          esac

      - name: Deploy new Version to ElasticBeanstalk with Runtime Environment Variables
        env:
          SSR_CLIENT_ID: ${{ secrets.SSR_CLIENT_ID }}
          SSR_CLIENT_SECRET: ${{ secrets.SSR_CLIENT_SECRET }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_LINK_STATUS_PREVIEW_TOKEN: ${{ secrets.LINK_STATUS_PREVIEW_GITHUB_TOKEN }}
          PUBLIC_REVIEW_DISCUSSION_DESTINATIONS: ${{ secrets.PUBLIC_REVIEW_PRODUCTION_DISCUSSION_DESTINATIONS }}
        run: |
          set -euo pipefail

          jq -e '
            type == "object" and
            keys == ["production"] and
            (.production | type == "object") and
            (.production["stream-review"] | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
          ' <<<"$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" >/dev/null

          option_settings="$(
            jq -cn \
              --arg ssr_client_id "$SSR_CLIENT_ID" \
              --arg ssr_client_secret "$SSR_CLIENT_SECRET" \
              --arg alchemy_api_key "$ALCHEMY_API_KEY" \
              --arg github_link_status_preview_token "$GITHUB_LINK_STATUS_PREVIEW_TOKEN" \
              --arg public_review_discussion_destinations "$PUBLIC_REVIEW_DISCUSSION_DESTINATIONS" \
              '[
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_ID",Value:$ssr_client_id},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SSR_CLIENT_SECRET",Value:$ssr_client_secret},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"ALCHEMY_API_KEY",Value:$alchemy_api_key},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"GITHUB_LINK_STATUS_PREVIEW_TOKEN",Value:$github_link_status_preview_token},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"PUBLIC_REVIEW_DISCUSSION_DESTINATIONS",Value:$public_review_discussion_destinations},
                {Namespace:"aws:elasticbeanstalk:application:environment",OptionName:"SENTRY_SERVER_INSTRUMENTATION",Value:"false"}
              ]'
          )"

          aws elasticbeanstalk update-environment \
            --application-name "${{ env.BEANSTALK_APP_NAME }}" \
            --environment-name "${{ env.BEANSTALK_ENV_NAME }}" \
            --version-label "${{ env.COMMIT_SHA }}" \
            --option-settings "$option_settings"

      - name: Check Elastic Beanstalk health and readiness (120s warmup then 20 retries with 60s delay)
        env:
          DEPLOYMENT_ID: ${{ steps.deployment-record.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Warmup..."
          MAX_RETRIES=20
          COUNTER=0
          sleep 120
          while : ; do
            ENV_HEALTH=$(aws elasticbeanstalk describe-environments --environment-names "${BEANSTALK_ENV_NAME}" --query 'Environments[0].Health' --output text)
            ENV_STATUS=$(aws elasticbeanstalk describe-environments --environment-names "${BEANSTALK_ENV_NAME}" --query 'Environments[0].Status' --output text)
            echo "Environment health: $ENV_HEALTH"
            echo "Environment status: $ENV_STATUS"
            if [ $((COUNTER % 5)) -eq 0 ]; then
              node ops/scripts/deployment-bus.cjs github-create-status \
                --deployment-id "$DEPLOYMENT_ID" \
                --state in_progress \
                --description "Production EB health=$ENV_HEALTH status=$ENV_STATUS after $COUNTER checks" \
                --environment-url "https://6529.io" \
                --log-url "$RUN_URL" || true
            fi
            if [[ $ENV_HEALTH == "Green" && $ENV_STATUS == "Ready" ]]; then
              echo "Environment is healthy and ready!"
              break
            elif [[ $COUNTER -eq $MAX_RETRIES ]]; then
              echo "Environment did not become healthy and ready within the expected time."
              exit 1
            fi
            COUNTER=$((COUNTER+1))
            echo "Waiting for environment to become healthy and ready... Attempt: $COUNTER"
            sleep 60
          done

      - name: Validate Deployment
        run: |
          DEPLOYED_BEANSTALK_VERSION=$(aws elasticbeanstalk describe-environments \
            --environment-names "${BEANSTALK_ENV_NAME}" \
            --query 'Environments[0].VersionLabel' \
            --output text)
          echo "Current deployed version is $DEPLOYED_BEANSTALK_VERSION"
          if [ "$DEPLOYED_BEANSTALK_VERSION" != "${{ env.COMMIT_SHA }}" ]; then
            echo "Deployed version does not match the commit SHA."
            exit 1
          else
            echo "Deployed version valid!"
          fi

      - name: Verify production HTTP version
        run: |
          set -euo pipefail

          node ops/scripts/verify-deployment-version.cjs \
            --base-url https://6529.io \
            --expected-version "${COMMIT_SHA}" \
            --attempts 12 \
            --required-matches 3 \
            --delay-ms 10000 \
            --timeout-ms 10000 \
            --output deployment-version-evidence.json

          node ops/scripts/deployment-bus.cjs record-post-deploy-watch \
            --file deployment-bus-manifest.json \
            --status in_progress \
            --observed-duration-minutes 0 \
            --checkpoint http-version-match \
            --checkpoint-status passed \
            --evidence "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --notes "GET /api/version matched the production commit SHA."

      - name: Publish announced production version
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          announcement_file="current-production-version.json"
          published_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          announced_version_cdn_host="$(node -e 'process.stdout.write(new URL(process.env.ANNOUNCED_VERSION_ENDPOINT).hostname)')"

          # The app only treats this announcement as newer when published_at is after VERSION_BUILD_TIMESTAMP.
          cat > "$announcement_file" <<JSON
          {
            "schema_version": "frontend-announced-version.v1",
            "environment": "production",
            "version": "${COMMIT_SHA}",
            "ready": true,
            "published_at": "${published_at}",
            "workflow_run_url": "${RUN_URL}"
          }
          JSON

          aws s3 cp "$announcement_file" "s3://${AWS_BUCKET}/${ANNOUNCED_VERSION_OBJECT_KEY}" \
            --cache-control "no-store, max-age=0, must-revalidate" \
            --content-type "application/json"

          if distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${announced_version_cdn_host}'].Id | [0]" \
            --output text 2>/tmp/announced-version-cloudfront-error)"; then
            if [ -n "$distribution_id" ] && [ "$distribution_id" != "None" ]; then
              if aws cloudfront create-invalidation \
                --distribution-id "$distribution_id" \
                --paths "/${ANNOUNCED_VERSION_OBJECT_KEY}"; then
                echo "Requested CloudFront invalidation for /${ANNOUNCED_VERSION_OBJECT_KEY}."
              else
                echo "::warning::Could not invalidate /${ANNOUNCED_VERSION_OBJECT_KEY}; announced version may update after the CDN cache expires."
              fi
            else
              echo "::warning::Could not find the asset CloudFront distribution for ${announced_version_cdn_host}; announced version may update after the CDN cache expires."
            fi
          else
            echo "::warning::Could not list CloudFront distributions for announced version invalidation."
            cat /tmp/announced-version-cloudfront-error || true
          fi

      - name: Upload durable production version evidence
        id: durable-version-evidence
        continue-on-error: true
        env:
          DEPLOYMENT_ARTIFACT_S3_PREFIX: ${{ vars.DEPLOYMENT_ARTIFACT_S3_PREFIX || 's3://6529reviewbot-prod-artifacts/frontend-deployment/' }}
        run: |
          set -euo pipefail

          node ops/scripts/deployment-bus.cjs upload-validation-artifact \
            --file deployment-bus-manifest.json \
            --pack deployment:http-version \
            --status passed \
            --source-file deployment-version-evidence.json \
            --artifact-name deployment-version-evidence.json \
            --s3-prefix "${DEPLOYMENT_ARTIFACT_S3_PREFIX}" \
            --retention-policy standard-90-days \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --notes "Durable production GET /api/version evidence."

      - name: Warn if durable production evidence upload failed
        if: steps.durable-version-evidence.outcome == 'failure'
        run: |
          echo "::warning::Durable production version evidence upload failed. The deployment can continue, but release readiness remains incomplete until artifact storage/IAM is fixed and evidence is recorded."

      - name: Mark production deployment terminal
        if: always() && steps.deployment-record.outputs.deployment_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          case "$JOB_STATUS" in
            success)
              state="success"
              manifest_status="deploy_verified"
              description="Production deployment verified"
              ;;
            cancelled)
              state="error"
              manifest_status="cancelled"
              description="Production deployment cancelled before verification"
              ;;
            *)
              state="failure"
              manifest_status="failed"
              description="Production deployment failed before verification"
              ;;
          esac

          node ops/scripts/deployment-bus.cjs heartbeat-manifest \
            --file deployment-bus-manifest.json \
            --status "$manifest_status" \
            --phase terminal \
            --message "$description"

          node ops/scripts/deployment-bus.cjs github-create-status \
            --deployment-id "${{ steps.deployment-record.outputs.deployment_id }}" \
            --state "$state" \
            --description "$description" \
            --environment-url "https://6529.io" \
            --log-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record production post-deploy watch checkpoint
        if: always() && hashFiles('deployment-bus-manifest.json') != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            watch_status="in_progress"
            checkpoint_status="passed"
            observed_minutes="0"
            notes="Elastic Beanstalk health/readiness and deployed version validation passed; release-captain post-deploy watch still needs deployed-environment validation evidence."
          else
            watch_status="failed"
            checkpoint_status="failed"
            observed_minutes="0"
            notes="Production workflow did not complete deploy verification successfully."
          fi

          node ops/scripts/deployment-bus.cjs record-post-deploy-watch \
            --file deployment-bus-manifest.json \
            --status "$watch_status" \
            --observed-duration-minutes "$observed_minutes" \
            --checkpoint eb-version-health \
            --checkpoint-status "$checkpoint_status" \
            --evidence "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --notes "$notes"

      - name: Create production release report
        if: always()
        run: |
          if [ -f deployment-bus-manifest.json ]; then
            node ops/scripts/deployment-bus.cjs release-report \
              --file deployment-bus-manifest.json \
              --output deployment-release-report.md
          else
            echo "No deployment-bus-manifest.json was created; skipping release report."
          fi

      - name: Upload deployment bus manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-bus-production-${{ env.COMMIT_SHA || github.run_id }}
          path: |
            deployment-bus-manifest.json
            deployment-release-report.md
            deployment-version-evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Check out CI wave notifier
        if: always()
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .ci-wave-notifier
          sparse-checkout: scripts/notify-ci-wave.mjs
          sparse-checkout-cone-mode: false

      - name: Notify about failure
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "Seize PROD WEB DEPLOY: CI pipeline is broken!!!"
          description: ${{ env.COMMIT_SHA }} - ${{ env.COMMIT_MESSAGE }}
          content: "<@&1162355330798325861>"
          color: 0xff0000

      - name: Notify CI wave about failure
        if: failure() && hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: failure
          CI_PIPELINES_TITLE: "Seize PROD WEB DEPLOY: CI pipeline is broken!!!"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ github.sha }}
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs

      - name: Notify about success
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "Seize PROD WEB DEPLOY: CI pipeline complete"
          description: ${{ env.COMMIT_SHA }} - ${{ env.COMMIT_MESSAGE }}
          color: 0x00ff00

      - name: Notify CI wave about success
        if: success() && hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: success
          CI_PIPELINES_TITLE: "Seize PROD WEB DEPLOY: CI pipeline complete"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ github.sha }}
          CI_RELEASE_NOTES_PROMPT_PATH: ops/release-notes/release-notes.prompt.md
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs

  notify-production-prerequisite-failure:
    name: Notify about production prerequisite failure
    needs: [manual-deployment-guard, assert-main-ref, build-upload-deploy]
    if: >-
      ${{
        always() &&
        needs.build-upload-deploy.result == 'skipped' &&
        (
          needs.manual-deployment-guard.result == 'failure' ||
          needs.assert-main-ref.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Notify about prerequisite failure
        continue-on-error: true
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "Seize PROD WEB DEPLOY: CI pipeline is broken!!!"
          description: ${{ github.sha }} - A production deployment prerequisite failed before build/upload/deploy.
          content: "<@&1162355330798325861>"
          color: 0xff0000

      - name: Check out CI wave notifier
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .ci-wave-notifier
          sparse-checkout: scripts/notify-ci-wave.mjs
          sparse-checkout-cone-mode: false

      - name: Notify CI wave about prerequisite failure
        if: always() && hashFiles('.ci-wave-notifier/scripts/notify-ci-wave.mjs') != ''
        continue-on-error: true
        env:
          CI_PIPELINES_ALERT_URL: ${{ vars.CI_PIPELINES_ALERT_URL }}
          CI_PIPELINES_ALERT_SECRET: ${{ secrets.CI_PIPELINES_ALERT_SECRET }}
          CI_PIPELINES_ALERT_API_AUTH: ${{ secrets.CI_PIPELINES_ALERT_API_AUTH }}
          CI_PIPELINES_TARGET_ENV: production
          CI_PIPELINES_STATUS: failure
          CI_PIPELINES_TITLE: "Seize PROD WEB DEPLOY: CI pipeline is broken!!!"
          CI_PIPELINES_ENVIRONMENT: production
          CI_PIPELINES_SERVICE: web
          CI_PIPELINES_SHA: ${{ github.sha }}
        run: node .ci-wave-notifier/scripts/notify-ci-wave.mjs
