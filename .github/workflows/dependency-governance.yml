name: Dependency Governance

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-governance.yml"
      - "scripts/dependency-risk-gate.cjs"
      - "__tests__/scripts/dependency-risk-gate.test.ts"

permissions:
  contents: read

jobs:
  dependency-governance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Use cached pnpm store
        run: ./bin/6529 exec pnpm config set store-dir ~/.pnpm-store

      - name: Classify dependency risk
        id: risk
        continue-on-error: true
        env:
          DEPENDENCY_RISK_BASE_REF: "origin/${{ github.base_ref }}"
        run: ./bin/6529 run dependency:risk-gate

      - name: Install Socket Firewall
        id: socket_firewall
        continue-on-error: true
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall

      - name: Assert npm lockfile is absent
        id: guard_lock
        continue-on-error: true
        run: ./bin/6529 run guard:no-package-lock

      - name: Install dependencies
        id: install
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 ci

      - name: Lint package.json versions
        id: lint_package_json
        continue-on-error: true
        run: ./bin/6529 run lint:package-json

      - name: Dependency governance unit tests
        id: tests
        continue-on-error: true
        run: ./bin/6529 run test:no-coverage -- __tests__/scripts/dependency-risk-gate.test.ts

      - name: Summarize dependency policy
        if: always()
        env:
          RISK_LABELS: ${{ steps.risk.outputs.labels }}
          RISK_OUTCOME: ${{ steps.risk.outcome }}
          SOCKET_OUTCOME: ${{ steps.socket_firewall.outcome }}
          GUARD_OUTCOME: ${{ steps.guard_lock.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_PACKAGE_JSON_OUTCOME: ${{ steps.lint_package_json.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail

          {
            echo "## Dependency governance"
            echo
            echo "Suggested labels: \`${RISK_LABELS:-risk:high,deps:mixed,auto-merge:blocked}\`"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Risk classification | ${RISK_OUTCOME} |"
            echo "| Socket Firewall | ${SOCKET_OUTCOME} |"
            echo "| Lockfile guard | ${GUARD_OUTCOME} |"
            echo "| Frozen install | ${INSTALL_OUTCOME} |"
            echo "| Version pin policy | ${LINT_PACKAGE_JSON_OUTCOME} |"
            echo "| Governance tests | ${TESTS_OUTCOME} |"
            echo
            echo "This pull-request workflow is deliberately read-only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when dependency checks fail
        if: always()
        env:
          RISK_OUTCOME: ${{ steps.risk.outcome }}
          SOCKET_OUTCOME: ${{ steps.socket_firewall.outcome }}
          GUARD_OUTCOME: ${{ steps.guard_lock.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_PACKAGE_JSON_OUTCOME: ${{ steps.lint_package_json.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail

          failed="0"
          check_outcome() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "${name} did not pass: ${outcome}"
              failed="1"
            fi
          }

          check_outcome "Dependency risk classification" "$RISK_OUTCOME"
          check_outcome "Socket Firewall install" "$SOCKET_OUTCOME"
          check_outcome "No package-lock guard" "$GUARD_OUTCOME"
          check_outcome "Frozen install" "$INSTALL_OUTCOME"
          check_outcome "package.json pin lint" "$LINT_PACKAGE_JSON_OUTCOME"
          check_outcome "Dependency governance unit tests" "$TESTS_OUTCOME"

          # Required App PR CI owns the complete application typecheck and
          # production build in parallel lanes. This workflow remains focused
          # on dependency provenance, install integrity, pin policy and its
          # dedicated classifier tests.

          exit "$failed"
