name: Museum delivery diagnostic
on:
  push:
    branches: [fix/museum-images-sidebar-hydration]
    paths: [.github/workflows/museum-delivery-diagnostic.yml, ops/scripts/museum-delivery-diagnostic.cjs]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ${{ vars.E2E_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - run: corepack enable pnpm && corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f
        id: firewall
        with:
          mode: firewall
      - run: ./bin/6529 ci
        env:
          SFW_BIN: ${{ steps.firewall.outputs.firewall-path-binary }}
      - run: ./bin/6529 exec playwright install --with-deps chromium
      - run: ./bin/6529 exec node ops/scripts/museum-delivery-diagnostic.cjs
      - run: ./bin/6529 run test:e2e:production:museum-institutional-practice --grep "Casey artist and gift|accepts Collection|accepts Acquisitions" --repeat-each=3 --reporter=line
        env:
          PLAYWRIGHT_OUTPUT_DIR: diagnostic-browser-results
          PLAYWRIGHT_HTML_REPORT_DIR: diagnostic-browser-report
      - run: ./bin/6529 run test:e2e:production:home-readonly --grep "restores sidebar" --repeat-each=3 --reporter=line
        if: always()
        env:
          PLAYWRIGHT_OUTPUT_DIR: diagnostic-home-results
          PLAYWRIGHT_HTML_REPORT_DIR: diagnostic-home-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-delivery-diagnostic
          path: |
            diagnostic-results.json
            diagnostic-browser-results/
            diagnostic-browser-report/
            diagnostic-home-results/
            diagnostic-home-report/
          retention-days: 7
