[package]
name = "mls-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "OpenMLS (RFC 9420) device for 6529 end-to-end encrypted DMs and groups (D109), compiled to WebAssembly."
license = "MIT"
publish = false

[lib]
name = "mls_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
# draft-ietf-mls-pq-ciphersuites enables MLS_128_MLKEM768X25519_AES128GCM_SHA256_Ed25519
# (0x004F, X-Wing), the only suite this device uses (src/device.rs CIPHERSUITE).
# Cargo.lock also lists the optional OpenMLS storage and provider crates that
# this feature names as weak features (sqlite storage, libcrux provider,
# openmls_test); they are not built for either target (`cargo tree`).
openmls = { version = "=0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
aes-gcm = "0.10"
sha3 = "0.11"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser entropy (crypto.getRandomValues) and clock (Date.now) for wasm32.
openmls = { version = "=0.9.1", features = ["js", "draft-ietf-mls-pq-ciphersuites"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The native benchmark binary measures the same code with the speed profile
# that a native client would use; the wasm build keeps the size profile above.
[profile.bench-native]
inherits = "release"
opt-level = 3
