# Shared Codex local-environment setup for this repository.
version = 1
name = "6529seize-frontend"

[setup]
script = '''
set -eu

cd "$CODEX_WORKTREE_PATH"

bash ./scripts/setup-codex-worktree.sh

# Codex captures the successful setup environment. Remove an inherited runtime
# credential so it is never persisted in that capture.
unset NODE_AUTH_TOKEN'''
