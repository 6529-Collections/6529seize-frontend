# SonarCloud Automatic Analysis reads THIS file (.sonarcloud.properties);
# sonar-project.properties is only consumed by CI-based scanners, which this
# repository does not run. Keep the exclusion lists in both files in sync.
# Rationale (from sonar-project.properties): the excluded app/* trees are
# WordPress-scrape article snapshots — reviewed content artifacts, not
# runtime logic — whose repeated block skeletons trip the new-code
# duplication gate without carrying analysis signal.
sonar.exclusions=**/__tests__/**,**/e2e/**,scripts/**,**/__mocks__/**,generated/**,lib/e2ee/wasm/generated/**,content/delegation/**,public/delegation-content/**,app/museum/**,app/om/**,app/blog/**,app/about/media/**,app/about/press/**,app/about/100m-project/**,app/about/mission/**,app/about/open-metaverse/**,app/about/rules/**,app/author/**,app/capital/**,app/casabatllo/**,app/category/**,app/education/**,app/email-signatures/**,app/news/**
# The validator pages' text (lib/validator-page/content) is prose in string
# arrays, like the locale dictionaries: its folds and tables share one shape
# and trip the new-code duplication gate with no duplicated logic.
sonar.cpd.exclusions=ops/scripts/build-delegation-docs-content.mjs,i18n/messages/**,lib/validator-page/content/**
